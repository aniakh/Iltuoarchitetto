/* Generate BOM (bill of materials) for a solution tier */
function generateBOM(sol, d){
  const tier = sol.nm; // Essential / Balanced / Premium
  const style = d.style || "Japandi";
  const preferredProviders = STYLE_TO_PROVIDERS[style]?.prefer || [];
  const area = parseFloat(d.area) || 85;
  const rooms = parseInt(d.rooms) || 3;

  /* Pick one item per category per room */
  const selectedByRoom = {};
  Object.entries(PROCUREMENT_CATALOG).forEach(([roomKey, items])=>{
    selectedByRoom[roomKey] = [];
    /* Group by category */
    const byCat = {};
    items.forEach(it=>{
      if(!byCat[it.cat]) byCat[it.cat] = [];
      byCat[it.cat].push(it);
    });
    /* For each category, pick best matching tier + provider preference */
    Object.entries(byCat).forEach(([cat, options])=>{
      /* Filter to those matching tier */
      let candidates = options.filter(o => o.tier===tier);
      if(candidates.length===0){
        /* Fallback: pick closest tier */
        const tierOrder = ["Essential","Balanced","Premium"];
        const targetIdx = tierOrder.indexOf(tier);
        for(let delta=1; delta<3 && candidates.length===0; delta++){
          candidates = options.filter(o=>tierOrder.indexOf(o.tier)===targetIdx-delta) ;
          if(candidates.length===0) candidates = options.filter(o=>tierOrder.indexOf(o.tier)===targetIdx+delta);
        }
      }
      if(candidates.length===0) return;
      /* Sort by provider preference */
      candidates.sort((a,b)=>{
        const aPref = preferredProviders.indexOf(a.provider);
        const bPref = preferredProviders.indexOf(b.provider);
        if(aPref===-1 && bPref===-1) return PROVIDERS[a.provider].priority - PROVIDERS[b.provider].priority;
        if(aPref===-1) return 1;
        if(bPref===-1) return -1;
        return aPref - bPref;
      });
      const pick = candidates[0];
      /* Quantity heuristics */
      let qty = 1;
      if(cat==="bedside" || cat==="dining_chairs") qty = 1; // already pack of 4 or pair
      if(cat==="bedroom_single" && rooms>=4) qty = rooms-2;
      selectedByRoom[roomKey].push({...pick, qty});
    });
  });

  /* Compute totals */
  let grandTotal = 0;
  const providerTotals = {};
  const byRoomTotals = {};
  Object.entries(selectedByRoom).forEach(([roomKey, items])=>{
    let roomTotal = 0;
    items.forEach(it=>{
      const lineTotal = it.price * it.qty;
      const delivery = Math.round(lineTotal * 0.04);
      const install = it.cat==="kitchen_system"||it.cat==="vanity"||it.cat==="wardrobe"||it.cat==="hob"||it.cat==="oven"||it.cat==="washer" ? Math.round(lineTotal*0.12) : 0;
      it.lineTotal = lineTotal;
      it.delivery = delivery;
      it.install = install;
      it.totalAllIn = lineTotal + delivery + install;
      roomTotal += it.totalAllIn;
      grandTotal += it.totalAllIn;
      if(!providerTotals[it.provider]) providerTotals[it.provider] = {count:0, total:0, categories:new Set()};
      providerTotals[it.provider].count += it.qty;
      providerTotals[it.provider].total += it.totalAllIn;
      providerTotals[it.provider].categories.add(it.cat);
    });
    byRoomTotals[roomKey] = roomTotal;
  });

  return { selectedByRoom, providerTotals, byRoomTotals, grandTotal, tier, style };
}

/* Calculate Feng Shui score (0-100) based on selected principles and interventions */
function calcFengShuiScore(fengshui, changes, roomDetails) {
  if (!fengshui || fengshui.length === 0) return {score:50,label:"Neutral",detail:"No feng shui preferences selected"};
  let score = 30; /* Base score */
  const details = [];
  /* Points per selected principle */
  score += fengshui.length * 8;
  if (fengshui.includes("Command position (bed/desk facing door)")) { details.push("Command position +10"); score += 10; }
  if (fengshui.includes("Five elements balance (wood, fire, earth, metal, water)")) { details.push("Five elements +8"); score += 8; }
  if (fengshui.includes("Natural light maximization & mirror placement")) { details.push("Light optimization +7"); score += 7; }
  if (fengshui.includes("Clutter-free flow & rounded furniture edges")) { details.push("Flow optimization +8"); score += 8; }
  if (fengshui.includes("Living plants in east/southeast sectors")) { details.push("Plant energy +5"); score += 5; }
  /* Bonus for complementary interventions */
  if (changes.includes("Internal layout optimization")) { details.push("Layout optimization aligns with chi flow +5"); score += 5; }
  if (changes.includes("Smart controls")) { details.push("Smart controls support element balance +3"); score += 3; }
  if (changes.includes("Finishes refresh")) { details.push("Fresh finishes clear stagnant energy +4"); score += 4; }
  /* Room proportions bonus */
  const rd = roomDetails || {};
  if (rd.living?.length && rd.living?.width) {
    const ratio = Math.max(parseFloat(rd.living.length),parseFloat(rd.living.width)) / Math.min(parseFloat(rd.living.length),parseFloat(rd.living.width));
    if (ratio < 1.8) { details.push("Living room proportions favorable (ratio "+ratio.toFixed(1)+") +5"); score += 5; }
  }
  score = Math.min(100, Math.max(0, score));
  const label = score >= 85 ? "Excellent" : score >= 70 ? "Good" : score >= 50 ? "Moderate" : "Needs attention";
  return {score, label, details};
}

/* Convert File → base64 data URL */
async function fileToBase64(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
}

/* Shared Gemini vision call — returns parsed JSON or null */
async function geminiVision(file, textPrompt, apiKey){
  try{
    const b64=await fileToBase64(file);
    const base=b64.split(",")[1];
    const mime=file.type||"image/jpeg";
    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${AI_MODELS.vision}:generateContent?key=${apiKey}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts:[
         {inlineData:{mimeType:mime,data:base}},
         {text:textPrompt}
       ]}],generationConfig:visionCfg(2048)})
      }
    );
    if(!res.ok) throw new Error("Gemini "+res.status);
    const data=await res.json();
    const txt=data.candidates?.[0]?.content?.parts?.[0]?.text||"{}";
    return JSON.parse(txt.replace(/```json|```/g,"").trim());
  }catch(e){console.warn("Gemini vision failed:",e);return null;}
}

   Single source of truth for the image-generation/editing model. */
const NANO_BANANA_MODEL = "gemini-3-pro-image-preview";

/* ══════════════════════════════════════════════════════════════
   IMAGE-TO-IMAGE PIPELINE
   Pass original room photo/plan as input → model edits only
   furniture & finishes, keeping all spatial structure intact
   ══════════════════════════════════════════════════════════════ */

const _sleep = ms => new Promise(r=>setTimeout(r,ms));
const _OVERLOAD_RE = /overload|unavailable|high demand|try again later|temporarily|rate limit|quota|resource.?exhausted|internal error|backend/i;

/* One image-generation call to a specific model. Marks overload errors so the
   caller can retry / fall back. */
async function callImageModelOnce(model, parts, apiKey){
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
    {method:"POST", headers:{"Content-Type":"application/json"},
     body:JSON.stringify({contents:[{parts}], generationConfig:{responseModalities:["IMAGE"]}})}
  );
  if(!res.ok){
    const e = await res.json().catch(()=>({}));
    const msg = e.error?.message || ("HTTP "+res.status);
    const err = new Error(msg);
    err.overloaded = res.status===503||res.status===429||res.status===500||_OVERLOAD_RE.test(msg);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  const part = data.candidates?.[0]?.content?.parts?.find(p=>p.inlineData);
  if(!part?.inlineData){ const err=new Error("No image returned"); err.overloaded=false; throw err; }
  const m = part.inlineData.mimeType||"image/png";
  return {dataUrl:`data:${m};base64,${part.inlineData.data}`, base64:part.inlineData.data, mime:m};
}

/* Generate an image with automatic retry-on-overload + fallback across the
   available Nano Banana image models (Pro → flash variants). */
async function generateImage(parts, apiKey, onNote){
  const primary = AI_MODELS.image;
  const candidates = [primary, ...IMAGE_PREFS.filter(m=>m!==primary)];
  let lastErr = null;
  for(let ci=0; ci<candidates.length; ci++){
    const model = candidates[ci];
    const maxTry = ci===0 ? 3 : 2; // retry the preferred model a bit, then fall back to a lighter model
    for(let t=0; t<maxTry; t++){
      try{ return await callImageModelOnce(model, parts, apiKey); }
      catch(e){
        lastErr = e;
        if(!e.overloaded){
          // Non-transient (e.g. bad key, model returned no image): try next model once, else give up
          break;
        }
        if(onNote) onNote(ci>0 ? "fallback" : "busy");
        if(t < maxTry-1) await _sleep(1000*Math.pow(2,t) + Math.floor(Math.random()*500)); // 1s,2s,4s (+jitter)
      }
    }
  }
  const err = new Error(
    (lastErr && _OVERLOAD_RE.test(lastErr.message||""))
      ? "All Nano Banana image models are busy right now (high demand). Retried automatically — click to try again in a moment."
      : (lastErr?.message || "Image generation failed.")
  );
  err.overloaded = !!(lastErr && lastErr.overloaded);
  throw err;
}

/* Generate via image-to-image edit if original photo available; else, if an
   approved plan image is available, render the room FROM the plan (plan-to-3D);
   else text-to-image with constraints. `planRefImg` = the approved plan image
   (data URL) used to condition a room render on the actual layout. */
async function generateWithImagen(prompt, apiKey, originalPhotoFile, onNote, planRefImg){
  /* ── Image-to-image: pass original photo as reference ── */
  if(originalPhotoFile){
    try{
      const b64 = await fileToBase64(originalPhotoFile);
      const base = b64.split(",")[1];
      const mime = originalPhotoFile.type||"image/jpeg";
      const editPrompt = `${STRICT_BOUNDARY_PROTOCOL}

You are looking at an original room photo / plan. Generate a photorealistic renovation of THIS EXACT SPACE — the original image is the sole source of truth for geometry.

WHAT YOU MUST KEEP IDENTICAL (copy exactly from the photo):
- Every EXTERNAL / perimeter wall, its position, thickness, and angle
- Every window: exact count, exact position on wall, exact size
- Every balcony / French door (porta-finestra) to a balcony, loggia or terrace: exact count, position and size — do NOT convert it to a window or wall
- The main entrance door: exact position and width
- Ceiling height: exactly as in the photo
- Overall room shape, proportions and floor area: exactly as in the photo
- Bathroom: if visible, exact same position and size

WHAT YOU MAY CHANGE (the renovation) — INTERNAL only:
- Internal (non-load-bearing) partition walls and internal doors may be added, removed or moved
- Finishes, furniture and fittings
${prompt}

The result must look like a photograph of the SAME ROOM after renovation — not a different room. A viewer who knows the original should immediately recognise the same spatial layout.`;

      const r = await generateImage([
        {inlineData:{mimeType:mime, data:base}},
        {text:editPrompt.slice(0,9000)}
      ], apiKey, onNote);
      return {...r, mode:"image-edit"};
    }catch(e){
      /* If the models are overloaded, surface that (let the user retry) rather
         than silently degrading to text-to-image, which would also fail and
         would drop the original-image geometry constraint. */
      if(e.overloaded) throw e;
      console.warn("Image-to-image produced no image, trying next mode:",e);
    }
  }

  /* ── Plan-to-3D: render the room DIRECTLY from the approved floor plan so the
     geometry, sequence, openings and adjacencies come from the plan itself ── */
  if(planRefImg){
    try{
      const planPart = await imgPartFromAny(planRefImg);
      if(planPart){
        const planPrompt = `IMAGE 1 is the APPROVED 2D FLOOR PLAN of the whole apartment (the single source of truth for geometry). Produce a photorealistic 3D interior render of the target room, seen from a camera standing INSIDE that room on the plan, looking in a direction that reveals the room.
The render MUST match the plan EXACTLY — do a 1-to-1 correspondence:
- Same internal walls, internal doors, corridors and openings in the same positions.
- Same windows and balcony/French doors (porte-finestra): same count, same wall, same side; never add, move or omit one, never put a window on an internal wall.
- Same SEQUENCE and SIDE of adjacent spaces: if a neighbouring space is visible from this viewpoint (e.g. an open kitchen seen from the living room, a corridor, a balcony through a porta-finestra) it MUST appear on the same side and with the same character as the plan shows.
- Furniture placed consistently with the plan's room function and layout (e.g. kitchen units on the wall the plan assigns to the kitchen; bed in the bedroom zone); nothing blocking a door or window.
- Do NOT invent, move, add or remove any room, wall, door, window or opening. Geometry from the plan always beats aesthetics.
${prompt}`;
        const r = await generateImage([planPart, {text: planPrompt.slice(0,9000)}], apiKey, onNote);
        return {...r, mode:"plan-to-image"};
      }
    }catch(e){ if(e.overloaded) throw e; console.warn("Plan-to-3D produced no image, trying text-to-image:",e); }
  }

  /* ── Text-to-image with full constraints ── */
  const r = await generateImage([{text: prompt.slice(0,9000)}], apiKey, onNote);
  return {...r, mode:"text-to-image"};
}

/* Build a Gemini image part from a File, a data: URL, or an http(s) URL */
async function imgPartFromAny(src){
  if(src instanceof File){
    const b64=await fileToBase64(src);
    return {inlineData:{mimeType:src.type||"image/jpeg", data:b64.split(",")[1]}};
  }
  if(typeof src==="string" && src.startsWith("data:")){
    return {inlineData:{mimeType:src.split(";")[0].replace("data:",""), data:src.split(",")[1]}};
  }
  if(typeof src==="string" && src) return {fileData:{mimeType:"image/jpeg", fileUri:src}};
  return null;
}

/* Parse a JSON object out of a Gemini text response */
function parseJsonLoose(txt){
  const clean=(txt||"{}").replace(/```json|```/g,"").trim();
  const m=clean.match(/\{[\s\S]*\}/);
  return JSON.parse(m?m[0]:clean);
}

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
async function comparePlanToOriginal(originalSrc, generatedSrc, spatialData, apiKey, tier){
  if(!apiKey) return null;
  try{
    const a=await imgPartFromAny(originalSrc), b=await imgPartFromAny(generatedSrc);
    if(!a||!b) return null;
    const ctx=spatialData?`Reference data for the ORIGINAL: total area ${spatialData.totalArea||"?"}m², shape "${spatialData.overallShape||"?"}", entrance ${spatialData.entranceDoor?spatialData.entranceDoor.wall+" wall":"as drawn"}.`:"";
    /* Per-scenario internal freedom (envelope always frozen) */
    const tierRule = tier==="Essential"
      ? `SCENARIO = ESSENZIALE (layout locked): the internal layout must ALSO be IDENTICAL to the original — NO internal wall/partition added, removed or moved, and NO door added, removed or relocated. Set internalLayoutRespectsScenario=false if any internal wall or door differs from the original.`
      : tier==="Balanced"
      ? `SCENARIO = BILANCIATO (moderate internal changes): some internal partitions/doors may be moved/added/removed, but whole rooms must keep their identity and approximate positions. Set internalLayoutRespectsScenario=false if a whole room (kitchen/living/bedroom) was relocated or the changes are drastic.`
      : `SCENARIO = PREMIUM (full internal reorganisation): internal partitions/doors may change freely and kitchen/living/bedroom may be relocated within the envelope. Set internalLayoutRespectsScenario=true as long as everything stays inside the frozen envelope and wet rooms stay near existing stacks.`;
    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${AI_MODELS.vision}:generateContent?key=${apiKey}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts:[
         {text:"IMAGE 1 = ORIGINAL floor plan (existing apartment). IMAGE 2 = AI-generated POST-INTERVENTION floor plan of the SAME apartment."},
         a,
         {text:"IMAGE 2 follows:"},
         b,
         {text:`You are a strict Italian/Lombardy building-code reviewer verifying ENVELOPE INVARIANCE (D.P.R. 380/2001 sagoma) between the two plans. ${ctx}
The post-intervention plan is ACCEPTABLE only if it depicts the SAME SPACE as the original: identical external/perimeter walls, identical overall shape & footprint, identical total floor area, identical main entrance (wall/position/width), identical windows (count/position/size) and identical balcony/French doors (porte-finestra).
CRITICAL BOUNDARY RULES:
- The post-intervention plan must stay ENTIRELY WITHIN the original apartment perimeter — nothing may extend beyond it.
- NO new room, space, balcony, terrace, extension or annex may be ADDED that is not in the original apartment. The renovation only REDISTRIBUTES the existing internal area.
- The set of enclosed spaces must be the SAME apartment — internal partitions and internal doors may move, and rooms may be merged or split, but no space outside the original footprint may appear.
Anything outside the ENVELOPE rules = HARD CONSTRAINT VIOLATION. Internal changes are judged against the scenario rule below.
${tierRule}
Apply these STRICT BOUNDARY PROTOCOL tests (§7):
- Boundary overlay: proposed external boundary overlays the original exactly (P_proposed ⊆ P_original, ΔB≈0).
- Area: proposed net internal area ≤ original net internal area (A_proposed/A_original ≤ 1.00, small partition-thickness tolerance only). Set areaRatioOK=false if the proposal looks larger.

Return ONLY valid JSON (no markdown):
{"sameSpace":true/false,"outerWallsMatch":true/false,"overallShapeMatch":true/false,"totalAreaMatch":true/false,"withinOriginalBoundary":true/false,"areaRatioOK":true/false,"noSpacesAdded":true/false,"allSpacesTraceable":true/false,"entranceMatch":true/false,"windowsMatch":true/false,"balconyDoorsMatch":true/false,"internalLayoutRespectsScenario":true/false,"structuralWallsUntouched":true/false,"overallScore":0-100,"approved":true/false,"mismatches":["list every envelope difference, any added room/space, anything outside the perimeter, and any internal change not allowed by the scenario"],"summary":"one line"}
HARD GATE: if ANY of sameSpace, outerWallsMatch, overallShapeMatch, totalAreaMatch, withinOriginalBoundary, areaRatioOK, noSpacesAdded, allSpacesTraceable, entranceMatch, windowsMatch, balconyDoorsMatch, internalLayoutRespectsScenario is false → approved:false and overallScore ≤ 40.`}
       ]}],generationConfig:visionCfg(1400)})

    if(!res.ok) return null;
    const data=await res.json();
    return parseJsonLoose(data.candidates?.[0]?.content?.parts?.[0]?.text);
  }catch(e){ console.warn("Plan-vs-original compare failed:",e); return null; }

/* ══════════════════════════════════════════════════════════════

   Two-image comparison: confirm the room render is consistent with the

   ══════════════════════════════════════════════════════════════ */
async function comparePlanToRender(planSrc, renderSrc, roomType, apiKey){
  if(!apiKey) return null;
  try{
    const a=await imgPartFromAny(planSrc), b=await imgPartFromAny(renderSrc);
    if(!a||!b) return null;
    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${AI_MODELS.vision}:generateContent?key=${apiKey}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts:[
         {text:`IMAGE 1 = the post-intervention FLOOR PLAN (2D). IMAGE 2 = a 3D photorealistic RENDER of the ${roomType} in that same apartment.`},
         a,
         {text:"IMAGE 2 (the 3D render) follows:"},
         b,
         {text:`Do a strict 1-to-1 check that the 3D render is DERIVED FROM the approved floor plan for the ${roomType}. The plan (IMAGE 1) is the single source of truth. First infer, from the plan, a plausible camera position/direction inside the ${roomType} that could produce IMAGE 2, then verify EVERYTHING visible against the plan from that viewpoint. Check:
- Viewpoint & angle: the render must correspond to a real camera position that fits inside this room on the plan; the walls visible must be the walls that would actually be seen from that angle (viewpointValid).
- Windows / balcony doors (porte-finestra): exact count and position as the plan shows for this room; none added/moved/omitted (unless genuinely out of frame); never a window on an internal wall (windowsConsistent, balconyDoorsConsistent).

- Proportions: room width/length ratio and shape match the plan (proportionsConsistent).
- ADJACENT SPACES: if any neighbouring space is visible from this viewpoint (e.g. an open kitchen seen from the living room, a corridor, a balcony through a porta-finestra), it must be on the CORRECT SIDE relative to this room as the plan shows, with the correct characteristics (right room type, right opening between them, right relative position). Set adjacentSpacesConsistent=false if a visible adjacent space is on the wrong side, is the wrong room, or should not be visible from here.
- Room sequence: the order/adjacency of spaces matches the plan; no reordering, no invented space (roomSequenceConsistent, noExtraRoom, noInventedElements).
- FURNITURE placement: furniture is placed sensibly for this room's function and does not contradict the plan (e.g. the kitchen units/appliances sit on the wall the plan assigns to the kitchen; the bed is in the bedroom area; nothing blocks a door or window). Set furniturePlacementConsistent=false if furniture implies a different layout than the plan.
Compare spatial structure, openings, adjacency and furniture PLACEMENT; ignore only finishes, colours and lighting.
Return ONLY valid JSON (no markdown):
{"consistent":true/false,"windowsConsistent":true/false,"balconyDoorsConsistent":true/false,"proportionsConsistent":true/false,"openingsConsistent":true/false,"roomSequenceConsistent":true/false,"adjacentSpacesConsistent":true/false,"furniturePlacementConsistent":true/false,"noExtraRoom":true/false,"noInventedElements":true/false,"viewpointValid":true/false,"overallScore":0-100,"approved":true/false,"mismatches":["list every render-vs-plan inconsistency incl. wrong-side adjacent spaces and misplaced furniture"],"summary":"one line"}
HARD GATE: if ANY of consistent, windowsConsistent, balconyDoorsConsistent, proportionsConsistent, openingsConsistent, roomSequenceConsistent, adjacentSpacesConsistent, furniturePlacementConsistent, noExtraRoom, noInventedElements, viewpointValid is false → approved:false and overallScore ≤ 45.`}
       ]}],generationConfig:visionCfg(1400)})
      }
    );
    if(!res.ok) return null;
    const data=await res.json();
    return parseJsonLoose(data.candidates?.[0]?.content?.parts?.[0]?.text);
  }catch(e){ console.warn("Plan-vs-render compare failed:",e); return null; }
}

/* ══════════════════════════════════════════════════════════════
   FAST IMAGE-TO-IMAGE PIPELINE
   - One render per uploaded photo (parallel)
   - Single round when original photo provided (no retry loop needed)
   - Multi-round only for text-to-image fallback
   ══════════════════════════════════════════════════════════════ */

const _envBad = v => v && [v.outerWallsUnchanged,v.overallShapeUnchanged,v.entranceDoorUnchanged,v.balconyDoorsUnchanged,v.noWallMoves,v.totalAreaPreserved].some(x=>x===false);

async function runRefinementPipeline(prompt, apiKey, spatialData, roomType, onProgress, originalPhotoFile, tier, planRefImg){
  const isPlan = roomType==="Floor Plan";

  /* ── Image-to-image path (original photo/plan provided) ── */
  if(originalPhotoFile){
    /* One generation per call; the tile-level conformance loop regenerates
       until the plan/render conforms (or blocks after MAX attempts). */
    const rounds = 1;
    let best=null;
    for(let r=0;r<rounds;r++){
      onProgress({stage:r===0?"generating":"refining", round:r+1, total:rounds});
      const corrective = r>0 ? RETRY_ADDENDUM[1] : "";
      const result = await generateWithImagen((prompt+corrective).slice(0,9000), apiKey, originalPhotoFile, ()=>onProgress({stage:"busy", round:r+1, total:rounds}), planRefImg);
      if(spatialData && isPlan){
        onProgress({stage:"validating", round:r+1, total:rounds});
        const v=await validateRender(result.dataUrl, roomType, spatialData, apiKey);
        /* CROSS-CHECK 1: generated plan vs the ORIGINAL uploaded plan image */
        onProgress({stage:"comparing", round:r+1, total:rounds});
        const cmp=await comparePlanToOriginal(originalPhotoFile, result.dataUrl, spatialData, apiKey, tier);
        const hardViolation = _envBad(v) || (cmp && cmp.approved===false);
        const score = hardViolation ? Math.min(v?.overallScore??cmp?.overallScore??0,40)
                                    : Math.min(v?.overallScore??95, cmp?.overallScore??95);
        const cand={url:result.dataUrl, score, validation:v, planCompare:cmp, mode:"image-edit"};
        if(!best || cand.score>best.score) best=cand;
        if(!hardViolation) break;
      } else {
        best={url:result.dataUrl, score:95, validation:null, planCompare:null, mode:"image-edit"};
        break;
      }
    }
    return best;
  }

  /* ── Text-to-image path — one generation per call; the tile-level
     conformance loop handles regeneration until it conforms or blocks ── */
  let bestDataUrl=null, bestScore=-1, bestValidation=null;
  for(let round=0; round<1; round++){
    onProgress({stage:"generating", round:round+1, total:1});
    const fullPrompt=(prompt+RETRY_ADDENDUM[round]).slice(0,9000);
    const {dataUrl,base64,mime}=await generateWithImagen(fullPrompt, apiKey, null, ()=>onProgress({stage:"busy", round:round+1, total:MAX_ROUNDS}), planRefImg);
    if(spatialData){
      onProgress({stage:"validating", round:round+1, total:MAX_ROUNDS});
      const v=await validateRender(`data:${mime};base64,${base64}`, roomType, spatialData, apiKey);
      const hardViolation = _envBad(v);
      const score=hardViolation?Math.min(v?.overallScore??0,40):(v?.overallScore??50);
      if(score>bestScore){bestScore=score; bestDataUrl=dataUrl; bestValidation=v;}
      if(score>=PASS_SCORE && !hardViolation) break;
    } else {
      bestDataUrl=dataUrl; bestScore=100; bestValidation=null; break;
    }
  }
  return {url:bestDataUrl, score:bestScore, validation:bestValidation, planCompare:null, mode:"text-to-image"};
}

/* ══════ RENDER TILE — shows only the final approved render ══════ */
function AIRenderTile({prompt, style, solName, room, apiKey, spatialData, originalPhotoFile, batchTrigger, planImg, onPlanReady}) {
  const isPlan = room==="Floor Plan";
  const [phase, setPhase] = useState("idle"); // idle | pipeline | done | error
  const [progress, setProgress] = useState({stage:"generating",round:1,total:MAX_ROUNDS});
  const [imgUrl, setImgUrl] = useState("");
  const [finalScore, setFinalScore] = useState(null);
  const [validation, setValidation] = useState(null);
  const [planCompare, setPlanCompare] = useState(null); // plan-tile: generated plan vs original plan
  const [planConsistency, setPlanConsistency] = useState(undefined); // room-tile: render vs plan (undefined=not run)
  const [attempts, setAttempts] = useState(0);  // full generation attempts made for conformance
  const [blocked, setBlocked] = useState(false); // could not produce a conforming result after MAX attempts
  const [error, setError] = useState("");
  const MAX_CONFORM_ATTEMPTS = 5; // keep regenerating until it conforms, up to this many tries

  /* Extra pressure appended on each regeneration attempt */
  const CONFORM_NUDGE = "\n\n⛔ PREVIOUS ATTEMPT WAS REJECTED FOR BREAKING THE APARTMENT BOUNDARY OR ADDING SPACE. REGENERATE STRICTLY: keep the proposal ENTIRELY inside the original apartment perimeter (P_proposed ⊆ P_original), add NO room/space/balcony/terrace/corridor outside it, do NOT enlarge the footprint or total area, and change ONLY what this scenario permits internally. Fit every space inside the existing boundary.";

  const start = useCallback(async (attemptNo) => {
    if(!apiKey){ setError("Set Nano Banana API key above"); setPhase("error"); return; }
    setPhase("pipeline"); setError(""); setImgUrl(""); setFinalScore(null); setPlanCompare(null); setPlanConsistency(undefined);
    try{
      const usePrompt = (attemptNo>0) ? (prompt + CONFORM_NUDGE) : prompt;
      const result = await runRefinementPipeline(
        usePrompt, apiKey, spatialData, room,
        (p) => setProgress(p),
        originalPhotoFile, solName,
        isPlan ? undefined : planImg   // room renders are generated FROM the approved plan
      );
      setImgUrl(result.url);
      setFinalScore(result.score);
      setValidation(result.validation||null);
      setPlanCompare(result.planCompare||null);
      setPhase("done");
      /* NOTE: the plan is shared to room tiles ONLY once it conforms — see the
         conformance-gate effect below (never share a non-conforming plan). */
    }catch(e){ setError(e.message||"Failed"); setPhase("error"); }
  }, [prompt, apiKey, spatialData, room, originalPhotoFile, isPlan, onPlanReady, solName, planImg]);

  /* Fresh user-initiated generation. Room renders are generated FROM the
     approved plan, so when a plan is expected (batch run) we WAIT for it to
     conform before rendering the room, instead of guessing. */
  const beginGeneration = useCallback((deferForPlan)=>{
    setAttempts(0); setBlocked(false);
    if(!isPlan && deferForPlan && !planImg){ setPhase("waiting"); return; }
    start(0);
  },[isPlan, planImg, start]);
  const restart = useCallback(()=>beginGeneration(false),[beginGeneration]); // manual click: render now (best effort)

  /* Auto-start when batch trigger fires (only if idle/waiting) */
  useEffect(()=>{ if(batchTrigger>0 && (phase==="idle"||phase==="waiting")){ beginGeneration(true); } },[batchTrigger]);

  /* A deferred room render begins as soon as the conforming plan is available */
  useEffect(()=>{ if(phase==="waiting" && planImg && !isPlan){ start(0); } },[phase, planImg, isPlan, start]);

  /* CROSS-CHECK 2 — room render vs the post-intervention plan.
     Runs once this tile's render is done AND the plan image is available.
     Only performs the comparison here; regeneration is handled by the unified
     conformance-retry effect below. */
  const xcheckRef = useRef("");
  useEffect(()=>{
    if(isPlan || phase!=="done" || !imgUrl || !planImg || !apiKey) return;
    const sig = imgUrl+"|"+planImg;
    if(xcheckRef.current===sig) return; // already checked this pair
    xcheckRef.current=sig;
    let cancelled=false;
    setPlanConsistency("running");
    comparePlanToRender(planImg, imgUrl, room, apiKey).then(r=>{ if(!cancelled) setPlanConsistency(r||null); });
    return ()=>{cancelled=true;};
  },[isPlan, phase, imgUrl, planImg, apiKey, room]);

  /* UNIFIED CONFORMANCE GATE — regenerate until the result conforms, then STOP.
     A non-conforming result is NEVER presented: we regenerate up to
     MAX_CONFORM_ATTEMPTS, and only if still non-conforming do we show a
     "could not produce a conforming design — retry" card (no image). */
  useEffect(()=>{
    if(phase!=="done" || blocked) return;
    let failing;
    if(isPlan){
      if(planCompare==null){                     // no plan-vs-original check available → cannot verify, accept + share
        if(onPlanReady) onPlanReady(imgUrl);
        return;
      }
      failing = planCompare.approved===false || planCompare.sameSpace===false
              || planCompare.withinOriginalBoundary===false || planCompare.noSpacesAdded===false
              || planCompare.areaRatioOK===false;
    } else {
      if(planConsistency===undefined || planConsistency==="running") return; // wait for the render↔plan check
      if(planConsistency==null) return;        // no plan to compare against → accept
      failing = planConsistency.approved===false || planConsistency.consistent===false;
    }
    if(!failing){                                // CONFORMS → present it (and share the plan only now)
      if(isPlan && onPlanReady) onPlanReady(imgUrl);
      return;
    }
    if(attempts < MAX_CONFORM_ATTEMPTS-1){ setAttempts(a=>a+1); start(attempts+1); }
    else { setBlocked(true); if(isPlan && onPlanReady) onPlanReady(""); } // exhausted → block; never share a bad plan
  },[phase, blocked, isPlan, planCompare, planConsistency, attempts, start, onPlanReady, imgUrl]);

  const stageLabel = {
    generating: originalPhotoFile ? "Editing your original photo…" : ((!isPlan && planImg) ? "Rendering from the approved plan…" : "Generating render…"),
    busy:       "Model busy (high demand) — retrying / switching model…",
    validating: "Verifying spatial accuracy…",
    comparing:  isPlan ? "Cross-checking against the original plan…" : "Cross-checking against the plan…",
    refining:   "Refining spatial fidelity…"
  };
  const stageIcon = {generating:"🎨", busy:"⏳", validating:"🔍", comparing:"🧭", refining:"🔧"};

  /* Score badge colour */
  const sc = finalScore;
  const scoreClr = sc==null?"#78716C":sc>=80?"#1B3A2D":sc>=60?"#C87941":"#B91C1C";
  const scoreLabel = sc==null?"":sc>=80?"✓ Verified":sc>=60?"~ Acceptable":"⚠ Best attempt";

  /* Cross-check outcome (plan-vs-original for the plan tile, render-vs-plan for rooms) */
  const xcheckFailed = isPlan
    ? !!(planCompare && (planCompare.approved===false || planCompare.sameSpace===false))
    : !!(planConsistency && planConsistency!=="running" && (planConsistency.approved===false || planConsistency.consistent===false));
  const xcheckDone = isPlan ? !!planCompare : (planConsistency!==undefined && planConsistency!=="running" && planConsistency!==null);

  return (
    <div className="card" style={{padding:0,overflow:"hidden",border:"1px solid #E2DCD2"}}>
      {/* IDLE */}
      {phase==="idle"&&(
        <div className="render-idle" onClick={restart}
          style={{background:"linear-gradient(135deg,"+(STYLES[style]?.pal||["#F5F0E8"])[2]+"88,"+(STYLES[style]?.pal||["#E8DCC8"])[1]+"55)"}}>
          <span style={{fontSize:36,marginBottom:6}}>🎨</span>
          <span style={{fontSize:13,fontWeight:700,color:"#1B3A2D"}}>Generate Render</span>
          <span style={{fontSize:11,color:"#78716C",marginTop:2}}>{room} · {solName}</span>
          <span style={{fontSize:9,color:"#87A98F",marginTop:5,padding:"2px 10px",background:"#D1E7DD",borderRadius:10}}>
            {originalPhotoFile ? "🖼 Image-to-image · Spatial Refinement" : "Text-to-image · Spatial Refinement"}
          </span>
          {originalPhotoFile&&<span style={{fontSize:9,color:"#1B3A2D",marginTop:3,padding:"2px 8px",background:"#B5CDB8",borderRadius:8}}>
            ✓ Original photo attached — editing in place
          </span>}
        </div>
      )}

      {/* WAITING — room render deferred until its scenario's plan conforms */}
      {phase==="waiting"&&(
        <div className="render-idle" onClick={()=>start(0)} style={{background:"linear-gradient(135deg,#EEF4FA,#F5F0E8)",cursor:"default"}}>
          <div className="spinner" style={{width:26,height:26,borderWidth:3,marginBottom:8}}/>
          <span style={{fontSize:12,fontWeight:700,color:"#2E5A82",textAlign:"center",padding:"0 14px"}}>In attesa del piano conforme…</span>
          <span style={{fontSize:10,color:"#78716C",marginTop:3,textAlign:"center",padding:"0 16px",lineHeight:1.4}}>This render is generated FROM the approved plan. It starts automatically once this scenario's plan passes its checks.</span>
        </div>
      )}

      {/* PIPELINE IN PROGRESS */}
      {phase==="pipeline"&&(
        <div className="render-loading" style={{flexDirection:"column",gap:0,padding:24}}>
          <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:18}}>
            <div className="spinner"/>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:"#1B3A2D"}}>{stageIcon[progress.stage]} {stageLabel[progress.stage]}</div>
              <div style={{fontSize:10,color:"#78716C",marginTop:2}}>Round {progress.round} of {progress.total} · {room} · {solName}</div>
            </div>
          </div>
          {/* Progress steps */}
          {(()=>{
            const steps=isPlan?[["generating","Generate"],["validating","Verify"],["comparing","Cross-check"]]:[["generating","Generate"],["validating","Verify"]];
            const rank={generating:0,refining:0,validating:1,comparing:2};
            const cur=rank[progress.stage]??0;
            return(<div style={{display:"flex",gap:6,alignItems:"center",width:"100%",maxWidth:340}}>
              {steps.map(([k,l],i)=>{
                const active=i===cur, done=i<cur;
                return<React.Fragment key={k}>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                    <div style={{width:28,height:28,borderRadius:"50%",background:active?"#1B3A2D":done?"#87A98F":"#E2DCD2",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,transition:"all .3s"}}>{done?"✓":<span style={{color:active?"#fff":"#B8AFA5"}}>{i+1}</span>}</div>
                    <span style={{fontSize:9,color:active?"#1B3A2D":"#78716C",fontWeight:active?700:400}}>{l}</span>
                  </div>
                  {i<steps.length-1&&<div style={{flex:1,height:2,background:done?"#87A98F":"#E2DCD2",borderRadius:1,marginBottom:16,transition:"background .3s"}}/>}
                </React.Fragment>;
              })}
            </div>);
          })()}
          <div style={{fontSize:10,color:"#87A98F",marginTop:14,textAlign:"center"}}>
            {isPlan?"Verifying the new plan presents the SAME space as the original — only approved plans are shown":"Auto-refining for spatial fidelity — only the approved result will be shown"}
          </div>
        </div>
      )}

      {/* BLOCKED — could not produce a conforming result after MAX attempts.
          The non-conforming image is NOT shown; the user regenerates instead. */}
      {blocked&&(
        <div className="render-idle" onClick={restart} style={{background:"#FEF2F2"}}>
          <span style={{fontSize:30}}>⛔</span>
          <span style={{fontSize:12,color:"#B91C1C",fontWeight:800,marginTop:6,textAlign:"center",padding:"0 14px"}}>Nessuna soluzione conforme dopo {MAX_CONFORM_ATTEMPTS} tentativi</span>
          <span style={{fontSize:10,color:"#B91C1C",marginTop:3,textAlign:"center",padding:"0 16px",lineHeight:1.4}}>Il modello ha superato il confine dell'appartamento o aggiunto spazi. La proposta non conforme non viene mostrata.</span>
          <span style={{fontSize:11,color:"#B91C1C",marginTop:6,fontWeight:700}}>↻ Riprova · Click to regenerate</span>
        </div>
      )}

      {/* FINAL RENDER — only shown once it CONFORMS (blocked results never render) */}
      {phase==="done"&&imgUrl&&!blocked&&(
        <div style={{position:"relative"}}>
          <img src={imgUrl} alt={style+" "+room+" — "+solName} className="render-img"
            onError={()=>{setPhase("error");setError("Image failed to load");}}/>
          {sc!=null&&(
            <div style={{position:"absolute",top:8,right:8,background:scoreClr+"ee",padding:"4px 10px",borderRadius:20,fontSize:10,fontWeight:700,color:"#fff",backdropFilter:"blur(4px)"}}>
              {scoreLabel} {sc}/100
            </div>
          )}
        </div>
      )}

      {/* V7 COMPLIANCE STATUS — shown for conforming (presented) results only */}
      {phase==="done"&&!blocked&&(()=>{
        const isPlan=room==="Floor Plan";
        const checks=isPlan?[
          ["Muri esterni",validation?.outerWallsUnchanged,"BLG-ENV-01"],
          ["Ingresso",validation?.entranceDoorUnchanged,"BLG-ENV-02"],
          ["Sagoma",validation?.overallShapeUnchanged,"BLG-ENV-03"],
          ["Porte-finestra",validation?.balconyDoorsUnchanged,"BLG-ENV-05"],
          ["Superficie",validation?.totalAreaPreserved,"HYG-02"],
        ]:[
          ["Finestre",validation?validation.windowCountMatch!==false&&validation.windowPositionsMatch!==false:undefined,"BLG-ENV-04"],
          ["Porte-finestra",validation?.balconyDoorsUnchanged,"BLG-ENV-05"],
          ["Muri",validation?validation.noWallMoves!==false&&validation.outerWallsUnchanged!==false:undefined,"BLG-ENV-01"],
          ["Altezze",validation?.complianceCeilingHeight,"HYG-01"],
          ["Superfici min.",validation?.complianceRoomAreas,"HYG-03"],
          ["Aeroillum.",validation?.complianceLightVent,"HYG-06"],
          ["Accessibilità",validation?.complianceAccessibility,"ACC-DM-01"],
        ];
        const violations=(validation?.violations||[]).concat(validation?.complianceNotes||[]).filter(Boolean).slice(0,4);
        const anyFail=checks.some(([,v])=>v===false);
        const allPass=checks.every(([,v])=>v===true);
        const verdict=anyFail?"REJECTED — HARD CONSTRAINT VIOLATION":allPass?(isPlan?"ENVELOPE INVARIANCE CONFIRMED — VERIFICHE PROFESSIONALI RICHIESTE":"SPATIAL & CODE CHECKS PASSED — VERIFICHE PROFESSIONALI RICHIESTE"):"CONCEPT FEASIBLE — VERIFICATIONS OUTSTANDING";
        const vCol=anyFail?"#B91C1C":allPass?"#1B3A2D":"#A16207";
        return(<div style={{padding:"8px 12px",borderTop:"1px solid #ECE8E1",background:anyFail?"#FEF2F2":"#F6F9F6"}}>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}}>
            {checks.map(([l,v,id])=>(
              <span key={id} title={id} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:10,fontSize:9.5,fontWeight:700,background:v===false?"#FEE2E2":v===true?"#D1E7DD":"#FEF3C7",color:v===false?"#B91C1C":v===true?"#1B3A2D":"#A16207"}}>
                {v===false?"✗":v===true?"✓":"⚠"} {l}
              </span>
            ))}
          </div>
          <div style={{fontSize:9.5,fontWeight:700,letterSpacing:".04em",color:vCol}}>{verdict}</div>
          {violations.length>0&&<ul style={{margin:"4px 0 0",paddingLeft:16,fontSize:9.5,color:"#B91C1C",lineHeight:1.5}}>{violations.map((vi,i)=><li key={i}>{vi}</li>)}</ul>}
          {!validation&&<div style={{fontSize:9,color:"#78716C",marginTop:2}}>Validazione visiva non eseguita (image-to-image / dati assenti) — vincoli comunque imposti nel prompt di generazione.</div>}
        </div>);
      })()}

      {/* CROSS-CHECK 1 — post-intervention PLAN vs INITIAL plan (plan tile only) */}
      {phase==="done"&&!blocked&&isPlan&&planCompare&&(()=>{
        const rows=[
          ["Muri esterni",planCompare.outerWallsMatch],
          ["Sagoma/impronta",planCompare.overallShapeMatch],
          ["Superficie",planCompare.totalAreaMatch],
          ["Entro il perimetro",planCompare.withinOriginalBoundary],
          ["Area ≤ originale",planCompare.areaRatioOK],
          ["Nessun locale aggiunto",planCompare.noSpacesAdded],
          ["Spazi tracciabili",planCompare.allSpacesTraceable],
          ["Ingresso",planCompare.entranceMatch],
          ["Finestre",planCompare.windowsMatch],
          ["Porte-finestra",planCompare.balconyDoorsMatch],
          ["Layout conforme allo scenario",planCompare.internalLayoutRespectsScenario],
        ];
        const fail=planCompare.approved===false||rows.some(([,v])=>v===false)||planCompare.sameSpace===false;
        const ms=(planCompare.mismatches||[]).filter(Boolean).slice(0,4);
        return(<div style={{padding:"8px 12px",borderTop:"1px solid #ECE8E1",background:fail?"#FEF2F2":"#EEF4FA"}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:".05em",color:fail?"#B91C1C":"#2E5A82",marginBottom:5}}>🧭 PIANO NUOVO ↔ PIANO INIZIALE {fail?"— SPAZIO NON COINCIDENTE":"— STESSO SPAZIO CONFERMATO"}{planCompare.overallScore!=null?` · ${planCompare.overallScore}/100`:""}</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {rows.map(([l,v],i)=>(
              <span key={i} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:10,fontSize:9.5,fontWeight:700,background:v===false?"#FEE2E2":v===true?"#D1E7DD":"#FEF3C7",color:v===false?"#B91C1C":v===true?"#1B3A2D":"#A16207"}}>{v===false?"✗":v===true?"✓":"⚠"} {l}</span>
            ))}
          </div>
          {ms.length>0&&<ul style={{margin:"5px 0 0",paddingLeft:16,fontSize:9.5,color:"#B91C1C",lineHeight:1.5}}>{ms.map((m,i)=><li key={i}>{m}</li>)}</ul>}
          {!fail&&<div style={{marginTop:6,padding:"6px 8px",background:"#D1E7DD",borderRadius:6,fontSize:9,color:"#1B3A2D",lineHeight:1.45}}>✓ <strong>Dichiarazione di conformità geometrica:</strong> l'intervento resta interamente entro il perimetro originale dell'appartamento. Muri esterni, ingresso, finestre e aperture esterne non sono modificati. Tutti i locali proposti derivano dalla sola riorganizzazione della superficie interna esistente.</div>}
        </div>);
      })()}

      {/* CROSS-CHECK 2 — 3D render vs the post-intervention PLAN (room tiles) */}
      {phase==="done"&&!blocked&&!isPlan&&planConsistency!==undefined&&(()=>{
        if(planConsistency==="running") return(<div style={{padding:"7px 12px",borderTop:"1px solid #ECE8E1",background:"#EEF4FA",fontSize:9.5,color:"#2E5A82",display:"flex",alignItems:"center",gap:7}}><div className="spinner" style={{width:14,height:14,borderWidth:2}}/> Verifica coerenza render ↔ piano…</div>);

        </div>

      if(mm('cap')) mined.cap = mm('cap');

      /* (2) Gemini extraction from the SUPPLIED text (no browsing) */
      const body = {
        contents:[{parts:[{text:'Below is the already-fetched readable text of an Italian real-estate listing (annuncio immobiliare). Extract the property fields from it. '+ANTI_RECITATION+'\n\nPAGE TEXT (delimited):\n<<<\n'+text.slice(0,13000)+'\n>>>\n\nReturn ONLY valid JSON matching this schema (use null for anything not present):\n'+SCHEMA}]}],
        generationConfig:visionCfg(4096,{responseMimeType:'application/json'})
      };
      const llm = await tryGemini(AI_MODELS.vision, body, 'F:reader-llm', 30000);
      if(llm && llm !== 'RETRY_PARAPHRASE'){
        for(const k in llm){ if(llm[k]!=null && llm[k]!=='' && (mined[k]==null || mined[k]==='')) mined[k]=llm[k]; }
      }
      const keys = Object.keys(mined).filter(k=>mined[k]!=null && mined[k]!=='');
      log('F:reader '+keys.length+'k');
      return keys.length > 0 ? mined : null;
    };

    /* Raw-text Gemini call (for the two-step describe→structure strategy) */
    const geminiText = async (model, body, label, timeoutMs=32000) => {
      try{
        const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),timeoutMs);
        const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});
        clearTimeout(t);
        if(!r.ok){ log(label+' HTTP '+r.status); return ''; }
        const j=await r.json(); const c=j.candidates?.[0];
        const txt=(c?.content?.parts||[]).map(p=>p.text||'').join('').trim();
        log(label+' '+(c?.finishReason||'')+' '+txt.length+'ch');
        return txt;
      }catch(e){ log(label+' '+(e.name==='AbortError'?'TIMEOUT':e.message)); return ''; }
    };

    /* === Attempt G: two-step grounded search → structure. Grounding works best
       WITHOUT a strict-JSON constraint, so we first get a paraphrased description
       via google_search, then convert that (recitation-safe) text to JSON. This
       is the most reliable path for listings that are indexed on the web. === */
    const attemptSearchDescribe = async () => {
      for(const model of EXTRACT_MODELS){
        const desc = await geminiText(model, {
          contents:[{parts:[{text:'Search the web for this Italian real-estate listing (annuncio immobiliare) and describe it in your OWN words — never copy sentences from the page. Include, if available: surface area in m², number of locali/rooms, bathrooms, floor, energy class (single letter A4–G), price in €, full street address, city, CAP, heating type, condition, property type, and the main features.\n\nURL: '+url}]}],
          tools:[{google_search:{}}],
          generationConfig:toolCfg(model,8192,0.2)
        }, 'G:describe['+model+']', 34000);
        if(desc && desc.length>40 && !/unable to|non sono riuscito|not find|no information/i.test(desc)){
          const r = await tryGemini(model, {
            contents:[{parts:[{text:'From this paraphrased description of an Italian property listing, output ONLY valid JSON matching the schema (use null for anything unknown). Convert Italian floor words (piano terra→Ground, primo→1, etc.) and normalise the energy class to a single code.\n'+SCHEMA+'\n\nDESCRIPTION:\n'+desc}]}],
            generationConfig:visionCfg(4096,{responseMimeType:'application/json'})
          }, 'G2:structure['+model+']', 20000);
          if(r && r!=='RETRY_PARAPHRASE') return r;
        }
      }
      return null;
    };

    const results = await Promise.all([
      attemptPlain().catch(()=>null),
      attemptSearch().catch(()=>null),
      attemptSearchDescribe().catch(()=>null),
      attemptUrlCtx().catch(()=>null),
      attempt20().catch(()=>null),
      attemptScrape().catch(()=>null),
      attemptReader().catch(()=>null),
    ]);
    log('done '+results.map(x=>x&&x!=='RETRY_PARAPHRASE'?Object.keys(x).filter(k=>x[k]).length:'-').join('/'));

    const parsed = {};
    results.filter(r=>r && r !== 'RETRY_PARAPHRASE').forEach(r=>{ for(const k in r){ if(r[k]!=null && r[k]!=='' && (parsed[k]==null || parsed[k]==='')) parsed[k]=r[k]; }});

    applyParsed(parsed, (Date.now()-t0)/1000, 'URL');
  };

  /* Schema.org extractor for JSON-LD blocks */
  const extractFromSchema = (o) => {
    if(!o || typeof o !== 'object') return {};
    const out = {};
    const t = o['@type'] || '';
    if(o.offers?.price) out.price = parseInt(String(o.offers.price).replace(/[^\d]/g,''));
    if(o.price) out.price = parseInt(String(o.price).replace(/[^\d]/g,''));
    if(o.floorSize?.value) out.area = parseFloat(o.floorSize.value);

/* STEP 2: Planimetria — with AI spatial extraction */
function S2({d,u,apiKey}){
  const rooms=[{key:"living",label:"Living / Dining",icon:"🛋️"},{key:"kitchen",label:"Kitchen",icon:"🍳"},{key:"bedroom",label:"Bedroom",icon:"🛏️"},{key:"bathroom",label:"Bathroom",icon:"🚿"},{key:"balcony",label:"Balcony",icon:"🌿"},{key:"corridor",label:"Corridor / Entry",icon:"🚪"}];
  const rd=d.roomDetails||{};
  const [planAnalyzing,setPlanAnalyzing]=useState(false);
  const [roomAnalyzing,setRoomAnalyzing]=useState({});
  const updateRoom=(key,field,val)=>{const nr={...rd};if(!nr[key])nr[key]={length:"",width:"",photos:[],extractedData:null};nr[key]={...nr[key],[field]:val};u({...d,roomDetails:nr})};
  const ref=useRef();

  const handlePlanUpload=async(files)=>{
    const newPlans=[...d.plans,...Array.from(files)];
    u({...d,plans:newPlans});
    const imgFile=Array.from(files).find(f=>f.type.startsWith("image/"));
    if(!imgFile)return;
    setPlanAnalyzing(true);
    const extracted=await analyzePlanImage(imgFile, apiKey);
    if(extracted){
      /* Auto-fill room dimensions from extracted plan data */
      const nr={...rd};
      Object.entries(extracted.rooms||{}).forEach(([key,room])=>{
        if(room.presentInPlan){
          if(!nr[key])nr[key]={length:"",width:"",photos:[],extractedData:null};
          if(room.lengthM&&!nr[key].length)nr[key]={...nr[key],length:String(room.lengthM)};
          if(room.widthM&&!nr[key].width)nr[key]={...nr[key],width:String(room.widthM)};
        }
      });
      u({...d,plans:newPlans,extractedPlan:extracted,roomDetails:nr});
    }
    setPlanAnalyzing(false);
  };

  const handleRoomPhotos=async(roomKey,files)=>{
    const newPhotos=[...(rd[roomKey]?.photos||[]),...Array.from(files)];
    updateRoom(roomKey,"photos",newPhotos);
    const imgFile=Array.from(files).find(f=>f.type.startsWith("image/"));
    if(!imgFile)return;

const TIER_FLEX = {
  Essential: {label:"layout locked — no walls added/removed, no doors changed", color:"#6B705C"},
  Balanced:  {label:"some internal walls/doors may move, be added or removed", color:"#1B3A2D"},
  Premium:   {label:"free internal reorganisation — kitchen/living/bedroom may be relocated", color:"#C87941"}
};
function SolRenderCard({x, solIdx, d, apiKey}){
  const m=SM[solIdx];
  const [batchTrigger,setBatchTrigger]=useState(0);
  const [planImg,setPlanImg]=useState(""); // THIS scenario's own post-intervention plan, shared to its room tiles
  const flex=TIER_FLEX[x.nm]||TIER_FLEX.Balanced;
  const tiles=[];
  [{roomKey:"living",label:"Living Area"},{roomKey:"kitchen",label:"Kitchen"},{roomKey:"bedroom",label:"Bedroom"},{roomKey:"bathroom",label:"Bathroom"}].forEach(({roomKey,label})=>{
    const photos=(d.roomDetails?.[roomKey]?.photos||[]).filter(f=>f instanceof File);
    const spatialData=d.roomDetails?.[roomKey]?.extractedData||null;
    if(photos.length>0){
      photos.forEach((photoFile,pi)=>{
        tiles.push({roomKey,label:`${label}${photos.length>1?" ("+(pi+1)+"/"+photos.length+")":""}`,photoFile,spatialData});
      });
    } else {
      tiles.push({roomKey,label,photoFile:null,spatialData});
    }
  });
  /* Each scenario has its OWN plan (with its own internal-flexibility level).
     Plan tile is generated first; its image is shared to this card's room
     tiles so every render is 1-to-1 checked against THIS scenario's plan. */
  const planPhoto=(d.plans||[]).find(f=>f instanceof File)||null;
  tiles.push({roomKey:"plan",label:"Floor Plan",photoFile:planPhoto,spatialData:d.extractedPlan||null});
  const imgToImg=tiles.filter(t=>t.photoFile).length;
  return(
    <div className="card" style={{borderColor:solIdx===1?m.color+"60":"#E2DCD2",borderWidth:solIdx===1?2:1,marginBottom:12}}>

        <div style={{flex:1}}>

          <div style={{fontSize:10.5,color:"#78716C"}}>{tiles.length} renders · {imgToImg>0?imgToImg+" image-to-image":"text-to-image"}</div>
        </div>
        {apiKey&&<button className="btn btn-p" style={{fontSize:10,padding:"5px 12px",whiteSpace:"nowrap"}} onClick={()=>{setPlanImg("");setBatchTrigger(t=>t+1);}}>⚡ Generate All</button>}
      </div>
      <div style={{fontSize:10,color:m.color,marginBottom:4,fontWeight:600}}>🏗 Internal flexibility: {flex.label}. Envelope (external walls, entrance, windows, footprint) always frozen.</div>
      <div style={{fontSize:10,color:"#78716C",marginBottom:8,lineHeight:1.5}}>Each render is checked 1-to-1 against THIS scenario's plan (<strong>viewpoint, walls/doors/windows, furniture, adjacent spaces</strong>); non-compliant results are regenerated or rejected.</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {tiles.map((t,ti)=>(
          <AIRenderTile key={x.nm+"-"+t.roomKey+"-"+ti} prompt={renderPrompt(d,x,t.roomKey)} style={d.style} solName={x.nm} room={t.label} apiKey={apiKey} spatialData={t.spatialData} originalPhotoFile={t.photoFile} batchTrigger={batchTrigger} planImg={planImg} onPlanReady={setPlanImg}/>

  );

/* ══════ MARKET FETCH BUTTON ══════ */
/* Live catalogue verification — ALL providers. Grounds each item's price,
   availability, article code, dimensions and official product URL in the
   provider's own official Italian product page (same source-registry approach
   as IKEA), and checks that the LINK works and the PRICE and SIZE correspond to
   the announcement. Field-level provenance; graceful fallback without a key. */
function CatalogueVerifyPanel({items, apiKey}){
  const [state,setState]=useState("idle");
  const [rows,setRows]=useState(null);
  const [err,setErr]=useState("");
  const allItems=(items||[]).filter(Boolean);

  const verify=async()=>{
    if(!apiKey){setErr("Enter your Google AI Studio key in the header to run live catalogue verification.");return;}
    if(allItems.length===0){setErr("No items in this scenario.");return;}
    setState("loading"); setErr("");
    try{
      const list=allItems.map((it,i)=>{
        const pv=PROVIDERS[it.provider]||{};
        const dims=(it.w?it.w+"×"+it.d+"×"+it.h+"cm":"?");
        return `${i+1}. provider="${pv.name||it.provider}" official_site="${pv.base||""}" · expected_article="${it.name}" · search_term="${it.q||it.name}" · listed_price=${it.price}€ · listed_size=${dims}`;
      }).join("\n");
      const schema='[{"idx":<1-based number matching the item>,"provider":"","article_name":"","article_code":"","product_url":"https://<official provider domain>/...","live_price_eur":<number>,"currency":"EUR","availability":"<in_stock|limited|out_of_stock|unknown>","dimensions_cm":"<w×d×h>","link_ok":<true|false>,"price_matches":<true|false>,"size_matches":<true|false>,"in_current_catalogue":<true|false>,"source_url":"","extraction_method":"json_ld|product_page|category_listing|search","retrieved_at":"","confidence_score":<0-1>}]';
      const prompt=(IKEA_REGISTRY_MD? IKEA_REGISTRY_MD.slice(0,4000)+"\n\n":"")+CATALOGUE_COMPLIANCE_DIRECTIVE
        +'\n\n────\nTASK: For EACH item below, find the matching CURRENT article on that provider\'s OFFICIAL Italian website and return its live data. Use ONLY the provider\'s own official domain (the official_site shown), never a marketplace or another country. Confirm the product LINK resolves to a live product page (link_ok), the PRICE equals the current listed selling price (price_matches vs listed_price), and the SIZE matches the listed dimensions (size_matches vs listed_size). Strip tracking params from product_url. If the exact article is discontinued, return the closest current replacement on the SAME provider and set in_current_catalogue=false. Return ONLY a valid JSON array (no markdown), one object per item, matching this schema:\n'+schema+'\n\nITEMS:\n'+list;
      const res=await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${AI_MODELS.vision}:generateContent?key=${apiKey}`,
        {method:"POST",headers:{"Content-Type":"application/json"},
         body:JSON.stringify({contents:[{parts:[{text:prompt}]}],tools:[{google_search:{}}],generationConfig:visionCfg(8192,{temperature:0})})});
      const data=await res.json();
      const txt=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
      const match=txt.replace(/```json|```/g,"").match(/\[[\s\S]*\]/);
      if(!match) throw new Error("No catalogue data returned — try again or check the key.");
      const parsed=JSON.parse(match[0]);
      const merged=parsed.map((r,i)=>{
        const src=allItems[(Number(r.idx)||i+1)-1]||allItems[i]||{};
        const pid=src.provider;
        /* Validate the returned URL is on the provider's own official domain; else fall back to the official search URL. */
        const okUrl=providerUrlAllowed(pid,r.product_url)?cleanTrackingUrl(r.product_url):(providerUrlAllowed(pid,r.source_url)?cleanTrackingUrl(r.source_url):mkSearchUrl(pid,src.q||r.article_name||src.name));
        const onOfficial=providerUrlAllowed(pid,r.product_url)||providerUrlAllowed(pid,r.source_url);
        return {...r, product_url:okUrl, on_official_domain:onOfficial, catalog_price:src.price, expected:src.name, provider_name:(PROVIDERS[pid]||{}).name||pid, listed_size:(src.w?src.w+"×"+src.d+"×"+src.h+"cm":"—"), room:src.room};
      });
      setRows(merged); setState("done");
    }catch(e){setErr(e.message||"Verification failed");setState("error");}
  };

  const okCount=rows?rows.filter(r=>r.link_ok!==false&&r.on_official_domain).length:0;
  return(
    <div className="card" style={{borderLeft:"4px solid #0058A3"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:8}}>
        <div>
          <div className="section-title" style={{margin:0,color:"#0058A3"}}>🛒 Catalogue verification — all providers (live)</div>
          <p style={{fontSize:10.5,color:"#78716C",marginTop:4,lineHeight:1.5,maxWidth:660}}>Grounds every item's <strong>price, availability, dimensions and official product link</strong> in the provider's own official Italian product page (same source-registry approach as IKEA), and checks that the <strong>link works</strong> and the <strong>price and size correspond to the announcement</strong>. Listed values are indicative until verified.</p>
        </div>
        <button className="btn btn-p" onClick={verify} disabled={state==="loading"} style={{whiteSpace:"nowrap",fontSize:12,background:"#0058A3"}}>
          {state==="loading"?"🔍 Verifying…":"🌐 Verify live prices & links"}
        </button>
      </div>
      {state==="loading"&&<div style={{fontSize:10.5,color:"#0058A3"}}>Querying official provider product pages ({allItems.length} items)…</div>}
      {err&&state!=="loading"&&<div className="note note-warn" style={{fontSize:11,marginTop:4}}>⚠️ {err}</div>}
      {state==="done"&&rows&&<div style={{marginTop:8,overflowX:"auto"}}>
        <div className="note note-ok" style={{fontSize:10.5,marginBottom:8}}>✓ {okCount}/{rows.length} items resolved to a working official product page. Price ▲/▼ = live vs listed; ⚠ flags a link, price or size that did not match.</div>
        <table style={{fontSize:10.5}}>
          <thead><tr style={{borderBottom:"2px solid #E2DCD2"}}>
            {["Article","Provider","Code","Listed €","Live €","Link","Size","Avail.","Conf."].map(h=><th key={h} style={{textAlign:"left",padding:"5px 7px",fontSize:9,color:"#78716C",whiteSpace:"nowrap"}}>{h}</th>)}
          </tr></thead>
          <tbody>{rows.map((r,i)=>{
            const live=Number(r.live_price_eur), cat=Number(r.catalog_price);
            const delta=(Number.isFinite(live)&&Number.isFinite(cat)&&cat>0)?Math.round(((live-cat)/cat)*100):null;
            const linkOk=r.link_ok!==false&&r.on_official_domain;
            return(<tr key={i} style={{borderBottom:"1px solid #ECE8E1",background:i%2?"#FAFAF8":"#fff"}}>
              <td style={{padding:"5px 7px"}}>
                <a href={r.product_url} target="_blank" rel="noopener noreferrer" style={{color:"#1B3A2D",fontWeight:600,textDecoration:"none"}}>{r.article_name||r.expected} 🔗</a>
                {r.in_current_catalogue===false&&<span style={{marginLeft:5,fontSize:8.5,padding:"1px 5px",borderRadius:6,background:"#FEE08B",color:"#7D5A00",fontWeight:700}}>replacement</span>}
                {r.expected&&r.article_name&&r.article_name!==r.expected&&<div style={{fontSize:9,color:"#78716C"}}>was: {r.expected}</div>}
              </td>
              <td style={{padding:"5px 7px",fontSize:9.5,color:"#C87941",fontWeight:600,whiteSpace:"nowrap"}}>{r.provider_name}</td>
              <td style={{padding:"5px 7px",fontFamily:"monospace",fontSize:9,color:"#78716C",whiteSpace:"nowrap"}}>{r.article_code||"—"}</td>
              <td style={{padding:"5px 7px",textAlign:"right"}}>{Number.isFinite(cat)?fmt(cat):"—"}</td>
              <td style={{padding:"5px 7px",textAlign:"right",fontWeight:700,color:"#0058A3"}}>{Number.isFinite(live)?fmt(live):"—"}{delta!=null&&Math.abs(delta)>=2&&<span style={{fontSize:8.5,color:delta>0?"#B91C1C":"#1B3A2D",marginLeft:3}}>{delta>0?"▲":"▼"}{Math.abs(delta)}%</span>}{r.price_matches===false&&<span title="price differs from listing" style={{marginLeft:3}}>⚠</span>}</td>
              <td style={{padding:"5px 7px",fontSize:11}} title={r.product_url}>{linkOk?"🔗":"⚠"}</td>
              <td style={{padding:"5px 7px",fontSize:9.5,color:"#78716C",whiteSpace:"nowrap"}}>{r.dimensions_cm||r.listed_size||"—"}{r.size_matches===false&&<span title={"listing: "+r.listed_size} style={{marginLeft:3,color:"#B91C1C"}}>⚠</span>}</td>
              <td style={{padding:"5px 7px",fontSize:9.5}}>{r.availability==="in_stock"?"✅":r.availability==="limited"?"🟡":r.availability==="out_of_stock"?"⛔":"—"}</td>
              <td style={{padding:"5px 7px",fontSize:9.5,color:r.confidence_score>=0.8?"#1B3A2D":r.confidence_score>=0.5?"#C87941":"#B91C1C"}}>{r.confidence_score!=null?Math.round(r.confidence_score*100)+"%":"—"}</td>
            </tr>);})}</tbody>
        </table>
        <p style={{fontSize:9.5,color:"#A8A29E",marginTop:6,lineHeight:1.5}}>Field-level provenance — each live price/link is traced to the provider's official Italian product page (retrieved just now). A brochure never overrides a live product page; confirm final price and availability for your postcode on the product page before ordering.</p>
      </div>}
    </div>
  );
}

              <td style={{fontSize:10.5,fontWeight:600,verticalAlign:"top",whiteSpace:"nowrap"}}>{m.cat}<div style={{fontSize:8.5,fontWeight:400,color:"#78716C"}}>{m.code}</div></td>
              <td style={{fontSize:9.5,color:"#57534E"}}>{m.msg}</td>
              <td style={{fontSize:9.5,fontWeight:700,whiteSpace:"nowrap",verticalAlign:"top",color:m.status==="PASS"?"#1B3A2D":m.status==="FAIL"?"#B91C1C":"#A16207"}}>{m.status}</td>
            </tr>))}
          </tbody></table>
          <div className="note note-warn" style={{marginTop:10}}>⚠️ Documento concettuale — non costituisce certificazione legale, strutturale, energetica o di agibilità (v7 §1.7). Le voci UNVERIFIED richiedono verifica di tecnico abilitato. Muri esterni, ingresso e sagoma dell'appartamento restano invariati in ogni soluzione proposta.</div>
        </div>
      </div>);
    })()}
  </div>);
}

/* ══════ MAIN APP ══════ */
function App(){

  const [ld,setLd]=useState(false);
  /* Google AI Studio key (Gemini + Nano Banana) — pasted at runtime.

     any committed key and Google auto-revokes it. Paste your key into the
     header field (the downloadable build can have it pre-filled). */
  /* Google AI Studio key. Paste your key here (or in the header field) to enable
     listing extraction, valuation grounding and renders. It is intentionally
     left EMPTY in the repository: a key committed to GitHub is blocked by push
     protection and auto-revoked by Google. The downloadable build ships with the
     key pre-filled. */

  const [models,setModels]=useState(AI_MODELS);

  /* Auto-activate the newest Gemini + Nano Banana models the key can access */
  useEffect(()=>{ let on=true; if(apiKey) detectBestModels(apiKey).then(m=>{ if(on) setModels({...m}); }); return ()=>{on=false;}; },[apiKey]);
  const [d,setD]=useState({address:"",city:"Milano",cap:"",area:"85",rooms:"3",eCls:"E",band:"Major city",floor:"3",ceiling:"2.7",currentStatus:"Da ristrutturare",heatingType:"Centralizzato",annualEnergy:"",pType:"Apartment",listingUrl:"",plans:[],photos:[],roomDetails:{},changes:["Kitchen upgrade","Bathroom upgrade","Finishes refresh","Storage boost"],style:"Japandi",customStyle:"",fengshui:[],preferredPalette:null,propertyValue:"",budget:"",timeLimit:"12"});
  const steps=[{n:"Proprietà · Property",i:"🏛️"},{n:"Planimetria · Floor Plan",i:"📐"},{n:"Interventi · Interventions",i:"🏗️"},{n:"Stile · Style",i:"🎨"},{n:"Analisi · Analysis",i:"📊"}];
  const ok=step===0?(d.city&&d.area):step===2?d.changes.length>0:true;
  const go=()=>{setLd(true);setTimeout(()=>{setLd(false);setStep(4)},1800)};

  if(ld)return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#FFFFFF"}}><div style={{textAlign:"center"}}><div className="spinner" style={{margin:"0 auto 20px"}}></div><h3 style={{fontFamily:"'Source Sans 3',sans-serif",color:"#4A7AAA",fontSize:18,letterSpacing:2,textTransform:"uppercase",fontWeight:400}}>Generazione 3 Soluzioni · Generating 3 Solutions</h3><p style={{color:"#78716C",fontSize:12,marginTop:6}}>Essenziale · Bilanciato · Premium / Essential · Balanced · Premium</p></div></div>);

  return(<div style={{minHeight:"100vh",background:"#F6F4EF"}}>
    <div style={{background:"#fff",color:"#3D3D3D",padding:"0",borderBottom:"1px solid #E5E0D8"}}>
      <div style={{background:"#F5F2EE",borderBottom:"1px solid #E5E0D8",fontSize:11,color:"#7A7A7A",padding:"6px 0"}}><div style={{maxWidth:1020,margin:"0 auto",padding:"0 28px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span>📞 +39 339 144 6039 · ✉ info@iltuoarchitetto.it</span><span style={{color:"#4A7AAA",fontWeight:600}}>Studio di Architettura Colombo</span></div></div><div style={{maxWidth:1020,margin:"0 auto",padding:"18px 28px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:54,height:54,border:"2.5px solid #4A7AAA",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontFamily:"'Source Sans 3',sans-serif",fontWeight:800,color:"#4A7AAA",letterSpacing:.5}}>2·5D</div><div><h1 style={{fontSize:22,fontWeight:400,letterSpacing:3,color:"#4A7AAA",fontFamily:"'Source Sans 3',sans-serif",textTransform:"uppercase"}}>2D to 5D</h1><p style={{fontSize:11,color:"#7A7A7A",letterSpacing:.3,marginTop:2}}>Integrated Design Solutions · Soluzioni di Progettazione Integrata</p></div></div>
        <div style={{display:"flex",alignItems:"center",gap:6}}><input type={showKey?"text":"password"} value={apiKey} onChange={e=>setApiKey(e.target.value.trim())} placeholder="Google AI Studio key (AIza… / AQ.…)" title="Gemini + Nano Banana key" style={{width:240,padding:"6px 10px",borderRadius:6,border:"1px solid rgba(255,255,255,.2)",background:"rgba(255,255,255,.1)",color:"#fff",fontSize:11}}/><button onClick={()=>setShowKey(!showKey)} style={{background:"none",border:"none",color:"#fff",cursor:"pointer",fontSize:13}}>{showKey?"🙈":"👁️"}</button>{apiKey&&<span title={models.detected?("Render: "+models.image+"\nExtract/validate: "+models.vision):"Connecting — detecting best models…"} style={{fontSize:9.5,color:models.detected?"#8CC63F":"#C9B24A",whiteSpace:"nowrap"}}>{models.detected?("✓ "+models.image.replace("gemini-","").replace("-preview","")+" · "+models.vision.replace("gemini-","")):"⏳ detecting models…"}</span>}</div>
      </div>
    </div>
    {step<4&&<div style={{maxWidth:1020,margin:"0 auto",padding:"12px 22px 0"}}><div style={{display:"flex",alignItems:"center",gap:3}}>{steps.map((x,i)=><div key={x.n} style={{display:"flex",alignItems:"center",flex:1}}><div style={{width:30,height:30,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:i<step?"#1B3A2D":i===step?"#C87941":"#ECE8E1",color:i<=step?"#fff":"#78716C",fontWeight:600,fontSize:11,flexShrink:0}}>{x.i}</div><span style={{fontSize:9.5,marginLeft:5,color:i===step?"#1C1917":"#78716C",fontWeight:i===step?600:400,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{x.n}</span>{i<steps.length-1&&<div style={{flex:1,height:2,background:i<step?"#1B3A2D":"#ECE8E1",margin:"0 7px",minWidth:8}}/>}</div>)}</div></div>}
    <div style={{maxWidth:1020,margin:"0 auto",padding:"16px 22px 56px"}}>
      {step===0&&<S1 d={d} u={setD} apiKey={apiKey}/>}{step===1&&<S2 d={d} u={setD} apiKey={apiKey}/>}{step===2&&<S3 d={d} u={setD}/>}{step===3&&<S4 d={d} u={setD}/>}{step===4&&<Results d={d} apiKey={apiKey}/>}
      {step<4&&<div style={{display:"flex",justifyContent:"space-between",marginTop:22}}><button className="btn btn-g" onClick={()=>setStep(Math.max(0,step-1))} disabled={step===0}>← Indietro · Back</button>{step<3?<button className="btn btn-p" onClick={()=>setStep(step+1)} disabled={!ok}>Continua · Next →</button>:<button className="btn btn-w" onClick={go}>Genera 3 Soluzioni · Generate 3 Solutions ✨</button>}</div>}
      {step===4&&<div style={{display:"flex",gap:8,marginTop:22}}><button className="btn btn-g" onClick={()=>setStep(0)}>← Modifica · Edit</button><button className="btn btn-s" onClick={()=>window.print()}>📄 Stampa · Print</button></div>}
    </div>
  </div>);
}

(function tryMount(){
  var el = document.getElementById("root");
  if(el){ ReactDOM.render(<App/>, el); }
  else { requestAnimationFrame(tryMount); }
})();
</script>
