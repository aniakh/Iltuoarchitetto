ITALY + LOMBARDY BUILDING-CODE COMPLIANCE — HARD CONSTRAINTS
Sources: DM 5/7/1975 · DPR 380/2001 art.34-bis · L.R. Lombardia 12/2005 · DM 236/1989 · L.13/1989 · D.Lgs.42/2004 · L.R.33/2015 + NTC2018 · D.Lgs.192/2005 + DDUO 18546/2019 · DM 37/2008 · DPR 151/2011

ENVELOPE INVARIANCE — ABSOLUTE HARD CONSTRAINT (DPR 380/2001 sagoma; project scope)
- External / perimeter walls: FROZEN (position + thickness) — never moved, pierced or removed
- Main entrance door: FROZEN — same wall, position, width, swing
- Windows: FROZEN — exact count, position and size; none added, removed or resized
- Balcony / French doors (porte-finestra) to balconies, loggias, terraces: FROZEN — exact count, position and size; never added, removed, resized, or converted to/from a window
- Overall apartment shape, footprint and net floor area: FROZEN — zero deviation
- Balconies, loggias, terraces: geometry FROZEN
- THE ONLY PERMITTED CHANGES: internal non-load-bearing partitions (tramezzi) and internal doors — add / remove / relocate / resize. A load-bearing internal wall stays FROZEN (seismic-restricted).

CEILING HEIGHTS (DM 5/7/1975 art.1)
- Habitable rooms (living/dining/kitchen/bedroom/studio): ≥ 2.70 m
- Bathrooms, corridors, halls, storage: ≥ 2.40 m
- Mountain >1000m a.s.l. habitable: ≥ 2.55 m
- Heritage-protected habitable: ≥ 2.40 m (accessory ≥ 2.20 m)
- DPR 380 art.34-bis ±2% tolerance allowed on EXISTING parts; new works hit nominal

FLOOR AREAS (DM 5/7/1975 art.2-3)
- Single bedroom ≥ 9 m² · Double bedroom ≥ 14 m² · Living ≥ 14 m²
- Per-occupant: 14 m² each for first 4, 10 m² each thereafter
- Mono-room studio: ≥ 28 m² (1 occ.) / ≥ 38 m² (2 occ.)
- ≥ 1 bathroom with WC + bidet + bath/shower + washbasin
- Second bathroom ≥ 2.00 m²

LIGHT & VENTILATION (DM 5/7/1975 art.5-6)
- Every habitable room: openable window directly outside (or compliant cavedio)
- FLDm ≥ 2% (heritage waiver 1%)
- RAI = openable window area / floor area ≥ 1/8 (heritage waiver 1/16)
- Roof windows ≥ 1/12 to 1/16 per local RE
- Room depth ≤ 2.5× window-header height (up to 3.5× if RAI raised to 25%)
- Bathroom: openable window ≥ 0.50 m² OR mechanical extraction ≥ 6 vol/h continuous / ≥ 12 vol/h intermittent
- No open-flame appliances in windowless bathrooms
- Cooking corner: openly connected to living + forced extraction over hob
- Cross-ventilation required if dwelling > 70 m² or > 1 bedroom

ACCESSIBILITY VISITABILITY (DM 236/1989)
- Main entrance door clear width ≥ 80 cm · Other internal doors ≥ 75 cm
- Door handles 85-95 cm height · Single leaf ≤ 120 cm · Force ≤ 8 kg
- Floor level changes ≤ 2.5 cm (or ramp ≤ 8% normal / ≤ 12% short rise ≤ 50 cm)
- Window handles 100-130 cm · Parapets ≥ 100 cm, 10 cm sphere non-traversable
- Switches/thermostats/intercom 40-140 cm height
- Accessible bathroom: WC lateral clear ≥ 80 cm · Washbasin frontal clear ≥ 80 cm · Wheelchair turn Ø 150 cm · Door outward or sliding
- Corridor width ≥ 100 cm · Turning area Ø 140 cm at length > 10 m
- Adattabilità required for every other unit (room to install accessible bathroom + widen entrance later without moving structural walls/risers)

STRUCTURAL & SEISMIC (L.R. Lombardia 33/2015 + NTC 2018)
- DO NOT remove/pierce load-bearing walls (muratura portante, pilastri, setti, travi) — only flag as "seismic-restricted: requires structural project + SCIA/PdC"
- New partitions: lightweight (plasterboard) ≤ 60 kg/m² unless slab verified
- Lombardy seismic zones 2-4 trigger NTC verification on structural works

HERITAGE (D.Lgs. 42/2004)
- If heritage_protected = true: no changes to external openings, façade, original roof, frescoes, coffered/stuccoed ceilings, historic wood/marble floors, original stairs
- Original distributive scheme (enfilade, central corridor) preserved unless Soprintendenza authorization is asserted
- Apply L.120/2020 relaxed limits where useful

ENERGY (D.Lgs. 192/2005 + DDUO Lombardia 18546/2019, Zone E)
- U-walls ≤ 0.26 W/m²K · U-roof ≤ 0.22 · U-floor ≤ 0.26 · U-window ≤ 1.40 · U-glass ≤ 1.10
- RES quota: ≥ 60% DHW + ≥ 50% total
- Air-permeability ≤ 0.6 vol/h @ 50 Pa
- Indoor design T: 18-20 °C
- New south/west glazing > 25% wall area needs external shading

PLANT SYSTEMS (DM 37/2008)
- No sockets within 60 cm of bath/shower edge or washbasin spout
- Gas boiler needs permanent vent ≥ 6 cm²/kW (≥ 100 cm² total) or sealed-chamber/external
- Plumbing risers: do not relocate across slabs

FIRE (DPR 151/2011 + DM 246/1987 residential)
- Buildings antincendio height > 24 m → VVF approval required
- Protected stairs (filtro a prova fumo) when height > 32 m
- Apartment door EI30 (height 12-24 m) / EI60 (> 24 m)
- Common-corridor escape ≤ 30 m single dir / ≤ 40 m two dir
- No bedrooms in piano interrato without secondary escape

NEVER:
✗ Move/remove/pierce an external perimeter wall
✗ Add, remove, resize or reposition any window
✗ Add, remove, resize or reposition any balcony / French door (porta-finestra); never convert it to a window or wall
✗ Move, resize or reorient the main entrance door
✗ Change the overall apartment shape, footprint or net floor area
✗ Place habitable room with no openable exterior window
✗ Place kitchen/bedroom/living over bathroom of unit below
✗ Remove load-bearing element without flagging structural project
✗ Reduce corridor < 100 cm or door < 75 cm clear
✗ Reduce habitable ceiling height < 2.70 m (or heritage waiver value)
✗ Move plumbing stack across slab without acoustic + structural note
✗ Output a plan as "compliant" without §5 validation table

PERMITS: CILA (non-structural internal), SCIA (ristrutturazione leggera, openings in non-LB walls), PdC (ristrutturazione pesante, load-bearing modifications, volumetric changes). Never reduce the required title.
</script>

<script type="text/plain" id="ikea-catalogue-registry-md">
2. Official IKEA Italy source registry and catalogue links
Connect the application directly to the following official IKEA Italy sources.
These URLs are the initial seed URLs for catalogue discovery. The ingestion service must start from these pages, discover their valid product, category, collection, brochure, guide and product-document links, and create a complete source registry.

2.1 Main official sources
IKEA Italy homepage: https://www.ikea.com/it/it/
Use to verify: market/language, current promotions, new collections, navigation changes, newly introduced catalogue sections, links to official services and product categories.
Complete IKEA Italy product catalogue (primary catalogue-discovery URL): https://www.ikea.com/it/it/cat/prodotti-products/
The crawler must: open this page; identify every valid IKEA Italy category and subcategory link; follow links whose canonical URLs remain within https://www.ikea.com/it/it/cat/ ; discover all paginated or dynamically loaded product listings; discover the official product-detail pages associated with each listing; store the category hierarchy and source URL for every product; repeat category discovery during each full catalogue refresh so that newly created categories are automatically included. Do not rely only on the hardcoded category list — the product index is the authoritative category-discovery source.

2.2 Digital catalogues, brochures and buying guides
IKEA Italy catalogues and brochures: https://www.ikea.com/it/it/customer-service/brochures/
Discover all currently published: digital catalogues, product brochures, buying guides, kitchen/bathroom brochures, wardrobe/storage guides, lighting guides, product-family brochures, technical guides, product lists, installation documents, linked PDF documents. Expected official PDF URL pattern: https://www.ikea.com/it/it/files/pdf/
Do not permanently rely on a fixed list of PDF links. Instead: retrieve the brochures landing page; extract every current brochure/guide URL; verify destination belongs to the official IKEA domain; identify HTML/PDF/permitted format; retrieve only when permitted; extract issue date, publication year, catalogue subject; store the original document URL and retrieval date; recheck the landing page for additions/removals/replacements; mark superseded guides as archived rather than deleting; do not use an old brochure price as the current selling price without checking the live product page.
PDFs/buying guides may be used for: product-system compatibility, available modules, nominal dimensions, materials, installation principles, required components, product-family relationships, configuration rules, historical product information. Current prices and availability must be confirmed against the live IKEA Italy product page.

2.3 Major IKEA Italy catalogue categories (additional crawler seeds)
Storage/wardrobes/shelving: https://www.ikea.com/it/it/cat/prodotti-per-organizzazione-della-casa-st001/
Beds and mattresses: https://www.ikea.com/it/it/cat/letti-e-materassi-bm001/
Sofas and armchairs: https://www.ikea.com/it/it/cat/divani-e-poltrone-700640/
Tables and chairs: https://www.ikea.com/it/it/cat/tavoli-e-sedie-fu002/
Office furniture: https://www.ikea.com/it/it/cat/scrivanie-e-sedie-da-ufficio-fu004/
Kitchens and appliances: https://www.ikea.com/it/it/cat/cucine-ed-elettrodomestici-ka001/
Bathrooms: https://www.ikea.com/it/it/cat/mobili-e-soluzioni-per-bagno-ba001/
Lighting: https://www.ikea.com/it/it/cat/illuminazione-li001/
Textiles and rugs: https://www.ikea.com/it/it/cat/tessili-tl001/
Curtains, blinds and window accessories: https://www.ikea.com/it/it/cat/tende-e-accessori-tl002/
Interior decoration: https://www.ikea.com/it/it/cat/decorazioni-casa-de001/
Outdoor furniture and accessories: https://www.ikea.com/it/it/cat/mobili-e-accessori-da-esterno-od001/

2.4 Collections and newly released products
IKEA Italy collections: https://www.ikea.com/it/it/cat/collezioni-collections/
Identify: new/limited/seasonal/collaboration collections, newly launched furniture and accessories, collection-specific colourways, limited-edition products. Match every collection product to its official product-detail page and article number. Do not assume permanent availability. Store: collection name, collection URL, launch status, limited-edition status, product URL, article number, retrieval date, availability status.

2.5 IKEA planners, configurators and 3D references
IKEA Italy planners and configurators: https://www.ikea.com/it/it/planners/
Discover currently supported planning/configuration systems where available: Kitchen planner, PAX planner, PLATSA/BESTÅ/EKET/KALLAX/BILLY/ENHET configurators, Bathroom planner, sofa configurators, bedroom/living-room/workspace planners, IKEA Kreativ. Planner info may be used to understand: valid modular combinations, valid component relationships, available finishes, available frame sizes, door/drawer compatibility, internal accessory compatibility, official configuration constraints, product-system geometry. Do not automate authenticated planners, extract private user projects or bypass technical controls; only use public and permitted planner information.
PAX planner: https://www.ikea.com/it/it/planners/pax-planner/ — validate component compatibility against official product descriptions, buying guides or planner rules; do not infer compatibility solely from visual similarity.

2.6 IKEA Italy product search (secondary discovery only)
https://www.ikea.com/it/it/search/?q={URL_ENCODED_SEARCH_TERM}
Examples: .../search/?q=PAX · .../search/?q=divano%20letto · .../search/?q=tavolo%20estensibile
Use search to: locate a known product family, recheck a missing product, find replacements, identify renamed product pages, search by article number, identify compatible accessories. Search results are discovery sources only; final product data must come from the official product-detail page.

2.7 Product-detail page discovery
Product pages remain within the IKEA Italy domain with a product-specific path. Detect product-detail links from: category pages, search results, collection pages, brochures, buying guides, related-product sections, compatible-product sections, planner/configurator landing pages. For each product-detail page, extract structured data in this order: (1) JSON-LD schema.org/Product; (2) other structured page data; (3) semantic HTML; (4) visible product-page text; (5) product images and image metadata; (6) product documents; (7) related/required component links. Prefer structured data over free-text. Do not call undocumented private endpoints unless explicitly permitted.

2.8 Link-discovery rules — Allowed discovery prefixes:
https://www.ikea.com/it/it/ · https://www.ikea.com/it/it/cat/ · https://www.ikea.com/it/it/files/pdf/ · https://www.ikea.com/it/it/customer-service/brochures/ · https://www.ikea.com/it/it/planners/ · https://www.ikea.com/it/it/search/
Normally excluded: login/account, cart, checkout, order-management, customer-specific URLs, tracking URLs, advertising URLs, social-media URLs, third-party marketplace pages, user-generated content, non-Italian IKEA markets, duplicate URLs with tracking parameters. Remove tracking parameters (msockid, utm_source, utm_medium, utm_campaign, utm_term, utm_content) and store/use the clean canonical URL.

2.9 Dynamic catalogue discovery — At every scheduled full refresh: start from the complete product catalogue; extract all current /it/it/cat/ links; compare with the stored category registry; add newly discovered categories; flag removed categories for review; start from the brochures page and extract all current official brochure/PDF links; compare with the stored document registry; start from the collections page and discover current/new collections; start from the planners page and discover new planners/configurators; record all changes in a source-registry audit table.
Suggested source-registry record: {source_name, source_url, canonical_url, source_type: category|product|brochure|pdf|collection|planner, market:"IT", language:"it-IT", discovered_from, first_discovered_at, last_successfully_checked_at, last_changed_at, http_status, active, permitted_for_ingestion, content_hash, notes}

2.10 Extraction priority and source authority
Current price: (1) live official product-detail page; (2) official structured product data on the product page; (3) live official category listing; (4) current official promotional page; (5) brochure/buying guide only as historical/supporting.
Dimensions/materials: (1) product-detail page; (2) official technical documentation; (3) current buying guide; (4) official planner/configurator; (5) current official brochure.
Compatibility: (1) official planner/configurator; (2) official buying guide; (3) required-components section on the product page; (4) compatible-products section on the product page; (5) official installation documentation.
Availability: (1) live official product page for the selected location/postcode; (2) official stock/delivery information presented by IKEA Italy; (3) store-specific availability via a permitted official interface.
A brochure must never override newer data from a live product page.

2.11 Required application behaviour — Respect IKEA robots rules and terms of use; prefer an official API or approved product feed when available; use rate limiting and caching; avoid repeated retrieval of unchanged resources; use conditional requests when supported; apply exponential backoff after errors; stop accessing a source when access is explicitly denied; never bypass CAPTCHA, authentication or anti-bot controls; never disguise automated access; never extract private account information; never use another country's price as an Italian price; never interpret a brochure publication date as a price-verification date; never present data from an inaccessible page as verified; keep a traceable link between every extracted field and its source. When automated retrieval is not permitted or reliable, provide an administrative import option for: an official IKEA product feed, an authorized API, a manually downloaded official brochure, an authorized CSV/JSON catalogue, a commercial data-sharing agreement.

2.12 Source-level validation — For every source URL: confirm HTTPS; confirm hostname is www.ikea.com or another explicitly approved official IKEA hostname; confirm Italian market path where applicable; resolve redirects; save the final canonical URL; reject unexpected third-party redirects; record retrieval status; record retrieval time; calculate a content hash; detect meaningful page changes; re-run extraction when the source changes; log parsing failures. For each extracted product field, store field-level provenance: {field_name, field_value, source_url, source_type: official_product_page, extraction_method: json_ld, retrieved_at, confidence_score}.

2.13 Initial crawl sequence: (1) https://www.ikea.com/it/it/cat/prodotti-products/ ; (2) https://www.ikea.com/it/it/customer-service/brochures/ ; (3) https://www.ikea.com/it/it/cat/collezioni-collections/ ; (4) https://www.ikea.com/it/it/planners/ ; (5) all discovered category pages; (6) all discovered product-detail pages; (7) all current official brochures and buying guides; (8) all permitted planner/configurator reference pages; (9) product availability checks; (10) validation, deduplication and database import. After initial ingestion, use incremental refreshes for prices, availability, promotions and changed products. Category discovery must not be restricted to the manually listed category URLs — discover and maintain all current catalogue categories from the official IKEA Italy product index.
</script>

<script type="text/plain" id="lombardy-valuation-engine-md">
LOMBARDY APARTMENT RENOVATION VALUE & RENTAL-INCOME PREDICTION ENGINE — grounding brief for the live market query. Act as a senior real-estate data scientist, Italian chartered valuer, renovation cost consultant, GIS specialist and rental-investment analyst.

OUTPUTS (each as a RANGE with confidence, never a single false-precise number): (1) pre-renovation market value; (2) pre-renovation achievable rent; (3) post-renovation market value; (4) post-renovation long-term rent; (5) short/medium-term & student rent where legally applicable; (6) renovation cost; (7) incremental value; (8) incremental rent; (9) gross & net yields; (10) renovation ROI; (11) total return / cash-on-cash / NPV / IRR; (12) conservative/base/upside scenarios; (13) confidence & prediction intervals; (14) transparent assumptions & sources.

FOUR SEPARATE PRICE CONCEPTS — never merge into one "market price":
A. verified_transaction_price — from deeds/agency/lender/comparable datasets. Do NOT claim individual Italian deeds are a public live feed.
B. OMI (Agenzia delle Entrate) — omi_sale_min/max_eur_m2, omi_rent_min/max_eur_m2_month, omi_property_type, omi_condition, omi_zone_code, omi_semester. Zonal RANGES, not exact prices.
C. asking / listing (immobiliare.it, idealista) — asking_sale_eur_m2, asking_rent_eur_m2_month, listing_source, listing_date, days_on_market, price_reductions, listing_condition, listing_energy_class. These are ASKING prices.
D. modelled estimate — estimated_transaction_value, estimated_achievable_rent, estimated_post_renovation_value, estimated_post_renovation_rent, each with valuation date, sources, comparable count, geographic level, low/central/high, confidence, model version, assumptions.

SOURCES: OMI Quotazioni (agenziaentrate.gov.it/…/omi/…); Idealista report Lombardia (idealista.it/sala-stampa/report-prezzo-immobile/…/lombardia/); Immobiliare.it Insights (immobiliare.it/mercato-immobiliare/lombardia/); CENED 2.0 energy certs (cened.it/opendata-cened-2.0); Regione Lombardia prezzario opere (prezzario.regione.lombardia.it); ISTAT comuni; Lombardy Geoportal; Milan 88 NIL (dati.comune.milano.it). Keep Idealista and Immobiliare.it measures SEPARATE. Cite OMI as "Agenzia delle Entrate – OMI".

GEOGRAPHY: all 12 Lombardy provinces & every comune, all OMI zones, Milan's 88 NIL, and lake/mountain/tourist/student/metropolitan submarkets handled separately. Map address→comune→OMI zone→neighbourhood via an alias table (OMI, portals, NIL, common names differ). Do NOT smooth across lakefront vs inland, luxury vs ordinary, resort vs permanent, central Milan vs outer metro.

RENOVATION LEVELS (no universal uplift): L0 none · L1 cosmetic refresh · L2 light functional · L3 complete standard · L4 high-spec · L5 deep energy+premium. Separate interior-quality, layout, energy, added-room, added-bathroom and furnished/turnkey uplifts; avoid double counting.

COMPARABLES: same building → same street → same neighbourhood/OMI zone → adjacent zones → same comune → similar comuni. Filter by type/size/rooms/condition/energy/floor/lift/outdoor/parking/period/view/noise. Time-adjust with LOCAL indices (not national). Estimate asking→transaction discount from local evidence (not one fixed % for all Lombardy). Detect duplicate listings.

POST-RENO COUNTERFACTUAL: value the SAME apartment pre and post, changing only variables the renovation affects (condition, bathrooms, layout efficiency, energy class, cooling, windows, furnished). Uplift = post − pre. Renovation cost ≠ value created. CAP post value at the best renovated comparables / local new-build / market ceiling — a luxury interior in an ordinary building is NOT a luxury new-build.

ENERGY PREMIUM: from CENED + locally calibrated models; never a flat national 25%. Varies by province/comune/climate/value/age/heating/owner-vs-investor/energy prices/scarcity. Keep energy premium separate from finish-quality premium. Show current class, expected post class, probability of reaching it, €/yr energy saving, value & rent contribution, confidence range.

RENOVATION COST: bottom-up from Regione Lombardia prezzario work items (demolition, partitions, plaster, floors, tiling, painting, doors, windows, electrical, plumbing, heating, cooling, ventilation, bath, kitchen, insulation, heat pump, PV…) + overheads/fees/permits/safety/APE/cadastral/contingency/VAT. Risk-based contingency (not fixed). Location cost factors (Milan vs metro vs provincial vs mountain/lake). Show bottom-up BoQ AND a €/m² reasonableness check.

RENT MODELS: long-term (furnished/unfurnished, ordinary/canone concordato/student/transitory/corporate) and, only where legally & commercially applicable, short-term (ADR×365×occupancy, seasonal). Do NOT multiply portal €/m² by full cadastral area blindly. NOI = effective gross income − owner opex (non-recoverable condo, maintenance, management, insurance, IMU, letting fees, reserve). Report taxes separately. Short-term needs condominium/municipal/regional/CIN/safety checks first.

INVESTMENT METRICS: total project cost = acquisition (price+taxes+notary+agency+DD+finance) + renovation + fees + furnishing + contingency + holding. gross yield = annual gross rent / total project cost; net yield = NOI / total project cost; renovation ROI = (post value − pre value − reno cost)/reno cost; cash-on-cash, profit on sale, NPV, IRR, payback, DSCR, break-even occupancy & rent.

SCENARIOS: conservative (lower price/rent, higher cost/vacancy/contingency), base (central), upside (upper-but-defensible, no unjustified luxury premium). Sensitivity on price/rent ±5/10/15%, cost ±10/20/30%, delay, occupancy, rate, discount, exit, energy premium.

CONFIDENCE 0–100 from comparable quantity/recency/proximity/similarity, source reliability, source agreement, dispersion, transaction-vs-listing evidence, liquidity, model validation. 85–100 high · 70–84 good · 50–69 moderate · <50 low. Low confidence → WIDER range + explanation, never false precision. Never a single exact value without a range.

REQUIRED WARNINGS: automated estimate, not a certified appraisal; OMI values are broad zonal indications; portal prices are asking prices; actual transaction prices may differ; renovation costs need design + contractor quotes; energy-class improvement needs professional confirmation; rental income depends on vacancy/tenant/expenses/taxation/regulation; short-term use is subject to local/regional/national/condominium rules; legal/cadastral/planning/condominium compliance must be checked separately.
</script>

<script type="text/plain" id="rental-valuation-model-md">
§12 RENTAL VALUATION & INCOME MODEL — grounding brief for the rent query.

12.1 FUNDAMENTAL RULE: do NOT estimate rent as only "neighbourhood rent €/m² × area" — that is a benchmark only. The final achievable rent is a property-specific model adjusting for: micro-location, distance/travel-time to the relevant centre, transport proximity, floor, basement/semi-basement, lift, floor×lift interaction, apartment condition, building condition, balcony/terrace/garden, energy class, furnishing, layout efficiency, bedrooms/bathrooms, light, orientation, view, noise, parking, size, local demand/supply/vacancy, contract type. Estimate the rent a tenant will actually accept, not the current advertised ask.

12.2 SEPARATE VARIABLES (never merge): portal_asking_rent, asking_rent_eur_m2_month, estimated_negotiated_rent, estimated_achievable_rent, verified_contracted_rent, effective_rent_after_vacancy, net_owner_income. Advertised rents run above signed rents → Achievable = Asking × (1 − negotiation/overpricing adjustment); the adjustment varies by comune/neighbourhood/type/strategy/condition/month/liquidity — not one fixed % across Lombardy. Where signed-contract evidence is missing, widen the range and state it is asking-based.

12.3 HEDONIC MODEL: ln(R) = α(zone,time) + f1(area) + f2(distance/accessibility) + βfloor + βlift + βfloor×lift + βcondition + βbuilding + βbalcony + βterrace + βenergy + βfurnished + βlayout + βparking + βnoise + βview + ε. Keep individual effects explainable.

12.4 MICRO-LOCATION: calibrate at the smallest reliable level (same building → street → micro-neighbourhood → OMI zone → adjacent zones → comune → similar comuni). Use travel-time & transport access, not straight-line distance; nonlinear centrality curve; for Milan use multiple employment centres (Centro, Porta Nuova, CityLife, Bicocca, campuses, hospitals, hubs).

12.5–12.6 FLOOR × LIFT: distinguish basement/semi-basement/ground/mezzanine/1st/intermediate/upper/top/penthouse. Material discount for basements (light, humidity, privacy, demand). Ground floor: discount for privacy/noise/light, premium if private garden/independent entrance. Model lift as an INTERACTION with floor: no lift matters little at raised-ground/1st, penalty grows from 2nd–3rd up, 4th–5th no-lift = substantial discount + smaller tenant pool; high floor WITH lift = premium; no penthouse premium if access/common areas poor. Output floor adj, lift adj, combined adj.

12.7 APARTMENT CONDITION (separate from building): to-renovate / poor-habitable / dated / good / renovated-standard / renovated-high / new. No full renovated premium for superficial painting when systems/bath/kitchen/windows remain dated.

12.8 BUILDING CONDITION (independent): a renovated flat in a poor building ≠ same rent as in a renovated building. Show internal premium and building premium/discount separately.

12.9 OUTDOOR: none / Juliet / small / usable / large balcony / terrace / roof terrace / private / shared garden — value by area, usability, orientation, privacy, view, floor, direct access. A service balcony ≠ a usable terrace.

12.10 NONLINEAR SIZE: rent €/m² is not constant; small units rent higher €/m². Size bands (<30, 30–45, 45–65, 65–90, 90–120, >120 m²). Do NOT estimate a 120 m² flat by ×120 the €/m² of a 35 m² studio.

12.11 LAYOUT & ROOMS: value legal bedrooms/bathrooms, separate vs open kitchen, circulation %, storage, privacy. No value for bedrooms failing legal habitability.

12.12 OTHER: energy/operating cost, furnishing (old furniture is not a premium), light/orientation/view, noise, parking/storage, accessibility.

12.13 COMPARABLES: similar in location/size/floor/lift/condition/building/outdoor/furnishing/energy/rooms/parking/contract; similarity-weighted medians. Exclude room rentals, tourist nightly, serviced, luxury, promo, auction, unclear-surface, duplicates.

12.14 SUSTAINABILITY CHECK: because ads may be elevated, compare with signed rents, historical asks, income, rent-to-income, competing listings, days-on-market, vacancy. Produce BOTH current-advertised-rent range and estimated-sustainable-achievable-rent range; warn when advertised > sustainable.

12.15 PRE vs POST: run the whole model twice; incremental rent = post − pre; separate uplift by finish, layout, added legal bedroom, added bathroom, energy, cooling, windows, furnishing, outdoor.

12.16 FINAL: predicted property rent = base micro-location rent × combined property factor; achievable = asking × asking-to-contract; effective annual = achievable × 12 × (1 − vacancy − collection loss); NOI = effective + accessory − owner opex.

12.17 OUTPUT: municipality & neighbourhood benchmark, OMI rent range, portal asking-rent range by source, adjusted comparable-rent range, predicted property asking rent, predicted achievable contracted rent, effective rent after vacancy, net owner income, lower/central/upper, confidence, and a transparent adjustment table. No false precision when evidence is thin.
</script>

/* ══════════════════════════════════════════════════════════════
   AI MODEL AUTO-SELECTION
   Automatically activate the most recent / advanced models the API key can
   reach: the newest Gemini for info extraction + validation, and Nano Banana
   (Nano Banana Pro / Gemini image) for rendering. Defaults are safe; once a
   key is present detectBestModels() queries the live model list and upgrades.
   ══════════════════════════════════════════════════════════════ */
const AI_MODELS = { vision: "gemini-2.5-flash", image: "gemini-3-pro-image-preview", detected: false, label: "" };
/* Preference order — first available wins (newest / most capable first) */
const VISION_PREFS = ["gemini-3.5-flash","gemini-3.1-pro-preview","gemini-3-pro-preview","gemini-3-flash-preview","gemini-flash-latest","gemini-2.5-flash","gemini-2.0-flash"];
const IMAGE_PREFS  = ["gemini-3-pro-image","gemini-3-pro-image-preview","gemini-3.1-flash-image","gemini-3.1-flash-image-preview","gemini-2.5-flash-image"];
/* Gemini 3.x / 2.5 are "thinking" models: reasoning consumes the output-token
   budget, so a small maxOutputTokens truncates the JSON (fr=MAX_TOKENS) and
   extraction/validation silently return nothing. Disable thinking for these
   structured-output tasks and give an ample token budget. */
function _thinkingModel(m){ return /gemini-(2\.5|3(\.\d+)?)/.test(m||""); }
function visionCfg(maxTokens, extra){
  const c = Object.assign({temperature:0.1, maxOutputTokens:maxTokens||2048}, extra||{});
  if(_thinkingModel(AI_MODELS.vision)) c.thinkingConfig = {thinkingBudget:0};
  return c;
}

async function detectBestModels(apiKey){
  if(!apiKey) return AI_MODELS;
  try{
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key="+apiKey);
    if(!r.ok) return AI_MODELS;
    const j = await r.json();
    const gen = new Set((j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace("models/","")));
    const pick = (prefs,cur)=>prefs.find(m=>gen.has(m))||cur;
    AI_MODELS.vision = pick(VISION_PREFS, AI_MODELS.vision);
    AI_MODELS.image  = pick(IMAGE_PREFS,  AI_MODELS.image);
    AI_MODELS.detected = true;
    AI_MODELS.label = "🍌 "+AI_MODELS.image+" · ✨ "+AI_MODELS.vision;
    console.log("[AI models] render:",AI_MODELS.image," | extract/validate:",AI_MODELS.vision);
  }catch(e){ console.warn("model detection failed", e); }
  return AI_MODELS;
}

/* Serialize d.iv into a v7 §B prompt block for plan & render generation */
function ivBrief(d){
  const iv=d.iv||{};const ks=Object.keys(iv).filter(k=>iv[k]);if(!ks.length)return"";
  const byCat={};ks.forEach(k=>{const[c]=k.split("::");(byCat[c]=byCat[c]||[]).push(k)});
  let out="\nSELECTED INTERVENTION PROGRAMME (Unified Agent v7 §A/§B) — the client selected these interventions. They EXTEND the permitted optimisations above but remain SUBORDINATE to every envelope hard constraint (outer walls, main entrance, sagoma/footprint, windows, balcony/French doors (porte-finestra), load-bearing structure, risers = FROZEN; only internal partitions and internal doors may change). Where an intervention conflicts with a hard constraint, do NOT execute it silently — flag it and apply the closest compliant alternative.\n";
  Object.entries(byCat).forEach(([c,items])=>{
    out+=`\n[${c}]${IV_CAT[c]?.v?` ⚠ ${IV_CAT[c].v}`:""}\n`;
    items.forEach(k=>{const o=iv[k],n=k.split("::")[1];
      out+=`• ${n} — priority ${o.pri||"Preferred"} · extent ${o.ext||"Full"} · budget ${o.bud||"Balanced"} · timing ${o.tim||"Immediate"} · ${o.flx||"Open to alternatives"}${o.rooms?` · target: ${o.rooms}`:""}${o.keep?` · preserve: ${o.keep}`:""}${o.rm?` · remove: ${o.rm}`:""}\n`;});
  });
  out+=`\nFor EACH intervention above assess: layout effect · usable surface · structural implications · plumbing/drainage · electrical/HVAC · light & ventilation · accessibility · fire safety · acoustics · energy · façade/condominium · authorisations · relative cost & complexity. Classify each as feasible / conditionally feasible / non-feasible / not verifiable. Essential interventions must be included or explicitly flagged as infeasible with the reason and the closest compliant alternative.\n`;
  return out;
}

/* Match user city / address to Milan zone (fuzzy keyword) */
function matchMilanZone(d){
  const hay = ((d.address||"")+" "+(d.city||"")+" "+(d.listingExtracted?.address||"")).toLowerCase();
  if(!hay.includes("milan")&&!hay.includes("milano")) return null;
  /* find best matching zone by keyword */
  let best=null,bestScore=0;
  MILAN_ZONE_BENCHMARKS.forEach(zone=>{
    const keys=zone.z.toLowerCase().split(/[,\s]+/).filter(k=>k.length>3);
    let score=0;
    keys.forEach(k=>{if(hay.includes(k))score++;});
    if(score>bestScore){bestScore=score;best=zone;}
  });
  return bestScore>0?best:MILAN_ZONE_BENCHMARKS.find(z=>z.z==="Centro"); // default Milan central if no match
}

/* Parse a user-typed € amount → whole-euro number.
   Handles "€ 320.000", "320000", "320,000", "1.234.567" (thousands grouped with
   either separator). Property values / budgets are whole euros, so all grouping
   separators are dropped and the digits parsed as an integer. */
function parseEuro(v){
  if(v==null) return 0;
  const n = parseInt(String(v).replace(/[^\d]/g,""), 10);
  return Number.isFinite(n) ? n : 0;
}

/* ══════════════════════════════════════════════════════════════
   PROPERTY-SPECIFIC RENTAL MODEL (§12)
   Never estimate rent as just "neighbourhood €/m² × area" — that is only a
   benchmark. Adjust the benchmark for the property's own characteristics
   (floor×lift interaction, condition, outdoor space, energy, parking, size),
   then convert ASKING rent → ACHIEVABLE contracted rent. Returns the total
   factor plus an explainable adjustment table.
   ══════════════════════════════════════════════════════════════ */
/* Nonlinear €/m² size curve (§12.10): smaller units rent higher per m². */
function rentSizeFactor(area){
  return area<30?1.15 : area<45?1.08 : area<65?1.02 : area<90?1.00 : area<120?0.95 : 0.90;
}
/* Property adjustment factor + explainable rows. statusOverride / eClsOverride
   let us run the same model pre- and post-renovation (§12.15). */
function rentPropertyFactor(d, statusOverride, eClsOverride){
  const rows=[]; let f=1.0;
  const status=statusOverride||d.currentStatus;
  const eCls=eClsOverride||d.eCls;
  const feats=((d.listingExtracted?.features||[]).join(" ")).toLowerCase();
  const hasLift = d.elevator!==false;
  const fl=String(d.floor||"3");
  const floorNum = fl==="Ground"?0 : fl==="Mezzanino"?0.5 : fl==="Mansarda"?4 : fl==="Attico"?5 : (parseInt(fl)||3);
  /* §12.5–12.6 floor × lift interaction */
  let floorAdj=0, floorNote="";
  if(fl==="Ground"){ floorAdj = feats.includes("giardin")||feats.includes("garden")?0.0:-0.05; floorNote=floorAdj<0?"ground floor (privacy/noise/light)":"garden level"; }
  else if(hasLift){ floorAdj = (fl==="Attico")?0.06 : floorNum>=4?0.04 : 0.02; floorNote=`floor ${fl} + lift (light/view)`; }
  else { floorAdj = floorNum<=1?-0.01 : Math.max(-0.15, -0.035*(floorNum-1)); floorNote=`floor ${fl}, no lift (walk-up penalty)`; }
  f+=floorAdj; if(floorAdj) rows.push([floorNote, (floorAdj>=0?"+":"")+Math.round(floorAdj*100)+"%"]);
  /* §12.7 apartment condition */
  const condAdj={"Da ristrutturare":-0.10,"to_renovate":-0.10,"scadente":-0.12,"Buono / Abitabile":0.0,"normal":0.0,"habitable_old":-0.03,"good":0.04,"Ristrutturato":0.07,"renovated":0.07,"Ottimo":0.10,"finely_renovated":0.10,"Nuovo / In costruzione":0.12}[status] ?? 0;
  f+=condAdj; if(condAdj) rows.push(["condition: "+status, (condAdj>=0?"+":"")+Math.round(condAdj*100)+"%"]);
  /* §12.9 outdoor space */
  let outAdj=0,outNote="";
  if(feats.includes("terraz")){ outAdj=0.05; outNote="terrace"; }
  else if(feats.includes("giardin")||feats.includes("garden")){ outAdj=0.04; outNote="garden"; }
  else if(feats.includes("balcon")){ outAdj=0.02; outNote="balcony"; }
  f+=outAdj; if(outAdj) rows.push([outNote, "+"+Math.round(outAdj*100)+"%"]);
  /* §12.12 energy */
  const enAdj={A4:0.06,A3:0.05,A2:0.05,A1:0.04,B:0.03,C:0.015,D:0,E:-0.02,F:-0.03,G:-0.04,Unknown:-0.01}[eCls] ?? 0;
  f+=enAdj; if(enAdj) rows.push(["energy class "+eCls, (enAdj>=0?"+":"")+Math.round(enAdj*100)+"%"]);
  /* §12.12 parking */
  if(feats.includes("box")||feats.includes("garage")||feats.includes("posto auto")){ f+=0.03; rows.push(["parking","+3%"]); }
  f=Math.max(0.6, Math.min(1.35, f));
  return {factor:Math.round(f*1000)/1000, rows};
}

   renoCostOverride (optional): the solution's ACTUAL construction total (budget-
   scaled in genSols). When present it replaces the model's tier estimate so that
   ROI, net-uplift and yields all reflect the money the user will really spend. */
function calcLombardyVal(d, sol, renoCostOverride){
  const area = parseFloat(d.area)||85;
  const trace = []; // step-by-step log
  const userVal = parseEuro(d.propertyValue); // manually entered / listing-derived current value

  /* STEP 1: Geography → reference €/m² (OMI Agenzia Entrate + immobiliare.it zone benchmarks) */
  const milanZone = matchMilanZone(d);
  const askingRef = milanZone?.sale || CITY_PRICES[(d.city||"").toLowerCase().trim()] || LOMBARDY_AVG;
  const rentRef = milanZone?.rent || 14;
  const omiMin = Math.round(askingRef * 0.85); // OMI quotazioni typically ~15% below immobiliare.it asking
  const omiMax = Math.round(askingRef * 1.05);
  trace.push({step:1, label:"Geography — OMI + immobiliare.it €/m²", note: (milanZone ? `Milan OMI zone "${milanZone.z}"` : (d.city||"Lombardy")+" municipality avg")+" · source: OMI Agenzia Entrate + immobiliare.it Apr 2026",
    OMI_min:omiMin, OMI_max:omiMax, asking_ref:askingRef, rent_ref:rentRef});

  /* STEP 2: Base OMI €/m² weighted by current condition */
  const condPos = COND_POSITION[d.currentStatus] ?? 0.50;
  const baseOMI = Math.round(omiMin + (omiMax - omiMin) * condPos);
  trace.push({step:2, label:"Base OMI (weighted by current condition)", note:`${d.currentStatus||"normal"} → OMI position ${condPos} (0=stato OMI min · 1=OMI max)`, value:baseOMI});

  /* STEP 3: Market calibration — blend OMI (60%) with immobiliare.it asking (40%) −5% to transaction */
  const OMI_WEIGHT = 0.60, ASK_WEIGHT = 0.40, ASK_DISCOUNT = 0.05;
  const calibrated = Math.round(OMI_WEIGHT * baseOMI + ASK_WEIGHT * askingRef * (1 - ASK_DISCOUNT));
  trace.push({step:3, label:"Calibrated market €/m²", note:`60% OMI quotazione + 40% immobiliare.it asking (−5% asking→rogito gap)`, value:calibrated});

  /* STEP 4: Property-specific adjustments */
  const adj = {};
  /* Floor */
  const floor = parseInt(d.floor)||3;
  const hasElevator = d.elevator !== false;
  if(hasElevator){
    if(floor===0) adj.floor=-0.04;
    else if(floor>=4) adj.floor=0.04;
    else adj.floor=0.02;
  } else {
    if(floor===0) adj.floor=-0.05;
    else if(floor>=4) adj.floor=-0.10;
    else if(floor>=3) adj.floor=-0.06;
    else adj.floor=-0.02;
  }
  /* Outdoor space (best guess from features) */
  const features = (d.listingExtracted?.features||[]).map(f=>f.toLowerCase()).join(" ");
  if(features.includes("terraz")) adj.outdoor = features.includes("grand")||features.includes("large") ? 0.08 : 0.05;
  else if(features.includes("balcon")) adj.outdoor = 0.02;
  else adj.outdoor = 0;
  /* Condo expenses */
  const condoY = parseFloat(d.listingExtracted?.condominium)||0;
  if(condoY>0){
    if(condoY < 1200) adj.condo=0.02;
    else if(condoY < 2500) adj.condo=0.00;
    else if(condoY < 4000) adj.condo=-0.03;
    else adj.condo=-0.06;
  } else adj.condo=0;

  const adjSum = Math.max(-0.20, Math.min(0.20, (adj.floor||0)+(adj.outdoor||0)+(adj.condo||0)));
  const adjusted = Math.round(calibrated * (1 + adjSum));
  trace.push({step:4, label:"Property adjustments", note:`floor ${adj.floor*100||0}% · outdoor ${(adj.outdoor*100)||0}% · condo ${(adj.condo*100)||0}% → total ${(adjSum*100).toFixed(1)}%`, value:adjusted, adjustments:adj});

  /* STEP 5: Energy class premium (pre-renovation) — then anchor to the user's
     declared / listing value when available (the actual price is the most
     accurate current value; the OMI model is the fallback estimate). */
  const ePremPre = ENERGY_PREMIUM[d.eCls] ?? -0.03;
  const modelPreSqm = Math.round(adjusted * (1 + ePremPre));
  const modelPreTotal = Math.round(modelPreSqm * area);
  const anchor = userVal || d.listingExtracted?.price || 0;
  const preRenovTotal = anchor > 0 ? Math.round(anchor) : modelPreTotal;
  const preRenovPerSqm = Math.round(preRenovTotal / area);
  trace.push({step:5, label:"Current value (pre-renovation)", note: anchor>0
      ? `User/listing value €${Math.round(anchor).toLocaleString("it-IT")} used as anchor (OMI model estimate €${modelPreTotal.toLocaleString("it-IT")})`
      : `OMI model estimate · ${d.eCls||"?"} energy premium ${(ePremPre*100).toFixed(1)}%`,
    value:preRenovPerSqm, total:preRenovTotal});

  /* STEP 6: Renovation cost — prefer the solution's ACTUAL budget-scaled total
     (co.total) so ROI/yield reflect real spend; else the tier €/m² model. */
  const tier = TIER_TO_RENO[sol.nm] || TIER_TO_RENO["Balanced"];
  const actualReno = renoCostOverride || sol?.co?.total || 0;
  let renoCost, renoNote;
  if(actualReno > 0){
    renoCost = Math.round(actualReno);
    renoNote = `Actual scenario construction total (${sol.nm}) — includes finishes, plant, professional fees & contingency`;
  } else {
    const renoBase = RENO_COST_PER_SQM[tier.tier].typ;
    let rc = area * renoBase;
    const interv = sol.ch || [];
    const adders = {};
    if(interv.includes("Electrical upgrade")) adders.electrical = 6000;
    if(interv.includes("Plumbing upgrade")) adders.plumbing = 12000;
    if(interv.includes("Bathroom upgrade")) adders.bathroom = 12000;
    if(interv.includes("Transparent envelope")) adders.windows = area * 0.15 * 750;
    if(interv.includes("Heating system")) adders.heatpump = 9000;
    if(interv.includes("Cooling system")) adders.aircon = 4500;
    if(interv.includes("Complete energy upgrade")) adders.deep_retrofit = 15000;
    adders.cila = 2500;
    Object.values(adders).forEach(v => rc += v);
    rc = rc * 1.12; // 12% contingency
    renoCost = Math.round(rc);
    renoNote = `${tier.tier}: €${renoBase}/m² × ${area}m² + adders + 12% contingency`;
  }
  trace.push({step:6, label:"Renovation cost", note:renoNote, value:renoCost});

  /* STEP 7: Post-renovation €/m² — the works lift the CURRENT value by the
     condition uplift (da-ristrutturare → renovated/finely) plus the APE energy
     delta, applied to the anchored current €/m² (respecting the user's value
     rather than resetting to the zone average). Capped at a realistic renovated
     ceiling so we never exceed what the local market will actually pay. */
  const targetECls = sol.en?.aC || "C";
  const ePremPost = ENERGY_PREMIUM[targetECls] ?? 0.02;
  const energyDelta = ePremPost - ePremPre;            // APE class uplift
  const cvPre = CONDITION_VALUE[d.currentStatus] ?? 1.00;
  const cvPost = CONDITION_VALUE[tier.postCond] ?? 1.30;
  const condUplift = cvPost/cvPre - 1;                 // value gain from improving the stato conservativo
  const upliftPct = condUplift + energyDelta;
  let postPerSqmUncapped = Math.round(preRenovPerSqm * (1 + upliftPct));
  /* Renovated ceiling: prime renovated stock trades a little above the zone
     asking benchmark; premium finish reaches higher than essential/balanced. */
  const ceilMult = {Essential:1.06, Balanced:1.10, Premium:1.16}[sol.nm] || 1.08;
  const ceiling = Math.round(askingRef * ceilMult);
  const comparableRenovated = Math.round(askingRef * (1 + Math.max(0,adjSum))); // zone renovated asking (info bar)
  const floorPost = Math.round(preRenovPerSqm * 1.02);      // never below current value
  const postPerSqm = Math.max(floorPost, Math.min(postPerSqmUncapped, ceiling));
  const ceilingHit = postPerSqmUncapped > ceiling;
  const postRenovTotal = Math.round(postPerSqm * area);
  trace.push({step:7, label:"Post-renovation €/m²", note:`current €${preRenovPerSqm.toLocaleString("it-IT")}/m² × (1 + condition ${d.currentStatus||"?"}→${tier.postCond} +${(condUplift*100).toFixed(1)}% + energy ${d.eCls||"?"}→${targetECls} +${(energyDelta*100).toFixed(1)}%)${ceilingHit?` [capped at renovated ceiling €${ceiling.toLocaleString("it-IT")}/m²]`:""}`, value:postPerSqm, total:postRenovTotal, ceilingHit, ceiling});

  /* STEP 8: Investment, uplift & two ROIs */
  const purchase = anchor > 0 ? Math.round(anchor) : preRenovTotal;
  const agencyFee = purchase * 0.03;      // agency ~3% + VAT
  const notaryTax = purchase * 0.04;      // notary + registration/imposta
  const totalInvestment = Math.round(purchase + agencyFee + notaryTax + renoCost);
  const grossUplift = postRenovTotal - preRenovTotal;         // value added by the works
  const netUplift = grossUplift - renoCost;                   // value added net of spend
  const profitIfResold = postRenovTotal - totalInvestment;    // flip profit after all costs
  /* Renovation ROI = return on the money spent on the works (the decision metric) */
  const renovationRoi = renoCost > 0 ? (netUplift / renoCost) * 100 : 0;
  /* Capital ROI = flip profit on total capital deployed (buy + costs + reno) */
  const capitalRoi = totalInvestment > 0 ? (profitIfResold / totalInvestment) * 100 : 0;
  trace.push({step:8, label:"Investment & ROI", note:`Buy €${(purchase/1000).toFixed(0)}k + 3% agency + 4% notary/tax + reno €${(renoCost/1000).toFixed(0)}k → renovation ROI = net uplift ÷ reno cost`, value:totalInvestment, gross_uplift:grossUplift, net_uplift:netUplift, profit_resold:profitIfResold, roi_pct:Math.round(renovationRoi*10)/10, capital_roi_pct:Math.round(capitalRoi*10)/10});

  /* STEP 9: Property-specific rent (§12) — NOT just benchmark €/m² × area.
     benchmark → property-adjusted asking → achievable contracted → net. Run
     the model twice (pre-renovation vs post-renovation). */
  const NOI_FACTOR = 0.70; // strip ~5% vacancy + ~8% mgmt + ~17% condo/IMU/maint
  const sizeF = rentSizeFactor(area);
  const benchmarkMonthly = Math.round(rentRef * area);              // §12.1 benchmark only
  const padjPost = rentPropertyFactor(d, tier.postCond, targetECls); // post-reno property factor + rows
  const padjPre  = rentPropertyFactor(d);                           // current property factor
  const askingMonthlyPost = Math.round(rentRef * sizeF * area * padjPost.factor);
  const askingMonthlyPre  = Math.round(rentRef * sizeF * area * padjPre.factor);
  const monthlyRent   = Math.round(askingMonthlyPost * ASKING_TO_ACHIEVABLE); // achievable contracted (post)
  const preMonthlyRent= Math.round(askingMonthlyPre  * ASKING_TO_ACHIEVABLE); // achievable contracted (pre)
  const annualRent = monthlyRent * 12;
  const annualRentNet = Math.round(annualRent * NOI_FACTOR);
  const monthlyRentNet = Math.round(annualRentNet / 12);
  const preAnnualRentNet = Math.round(preMonthlyRent*12*NOI_FACTOR);
  const rentUpliftMo = monthlyRent - preMonthlyRent;
  const grossYield = totalInvestment>0 ? (annualRent/totalInvestment)*100 : 0;      // gross yield on capital
  const netYield = totalInvestment>0 ? (annualRentNet/totalInvestment)*100 : 0;     // net yield on capital
  trace.push({step:9, label:"Property-specific rent (§12)", note:`benchmark €${rentRef}/m²·mo × ${area}m² (€${benchmarkMonthly}) → size ×${sizeF} → property ×${padjPost.factor} = asking €${askingMonthlyPost}/mo → achievable €${monthlyRent}/mo (−${Math.round((1-ASKING_TO_ACHIEVABLE)*100)}% asking→contract). gross yield ${Math.round(grossYield*100)/100}% · net yield ${Math.round(netYield*100)/100}%`, benchmark:benchmarkMonthly, asking:askingMonthlyPost, monthly:monthlyRent, annual:annualRent, monthly_net:monthlyRentNet, gross_yield_pct:Math.round(grossYield*100)/100, net_yield_pct:Math.round(netYield*100)/100, adjustments:padjPost.rows});

  /* STEP 11: Confidence score + prediction band (avoid false precision — a
     modelled estimate is always a range, wider when evidence is thin). */
  let confidence = 60;
  if(anchor>0) confidence += 16;                 // real current value known
  if(d.eCls && d.eCls!=="Unknown") confidence += 8;
  if(milanZone) confidence += 8;                 // matched a specific OMI zone
  if(sol.co && sol.co.total>0) confidence += 6;  // budget-scaled real cost
  confidence = Math.max(35, Math.min(95, confidence));
  const confidence_label = confidence>=85?"High":confidence>=70?"Good":confidence>=50?"Moderate":"Low";
  const band = confidence>=85?0.05 : confidence>=70?0.08 : confidence>=50?0.12 : 0.18; // ± range width
  const rng = c => [Math.round(c*(1-band)), Math.round(c), Math.round(c*(1+band))];

  /* STEP 12: Conservative / Base / Upside scenarios (post value, rent & ROI) */
  const scen = (label, priceMult, rentMult, costMult) => {
    const pv = Math.round(postRenovTotal*priceMult);
    const rc = Math.round(renoCost*costMult);
    const roi = rc>0 ? Math.round(((pv - preRenovTotal - rc)/rc)*1000)/10 : 0;
    return {label, post_value:pv, reno_cost:rc, roi_pct:roi, monthly_rent:Math.round(monthlyRent*rentMult)};
  };
  const scenarios = {
    conservative: scen("Conservative", 0.93, 0.92, 1.15),
    base:         scen("Base",         1.00, 1.00, 1.00),
    upside:       scen("Upside",       1.07, 1.06, 0.95),
  };

  /* STEP 10: Recommendation (based on renovation ROI) */
  let recommendation = "Not recommended unless strategic reason";
  if(renovationRoi >= 40) recommendation = "Strong value-add candidate";
  else if(renovationRoi >= 15) recommendation = "Moderate value-add candidate";
  else if(renovationRoi >= 0) recommendation = "Low-margin — negotiate price or trim reno scope";

  return {
    /* legacy compat */
    pB: preRenovPerSqm, pA: postPerSqm, vB: preRenovTotal, vA: postRenovTotal,
    up: Math.round((postPerSqm/preRenovPerSqm - 1)*1000)/10,
    taxBenefit: Math.round(renoCost*0.50),
    taxBenefitAnnual: Math.round(renoCost*0.50/10),
    /* new traceable detail */
    zone: milanZone?.z || (d.city||"Lombardy"),
    OMI_range: [omiMin, omiMax],
    asking_ref: askingRef, comparable_renovated: comparableRenovated,
    rent_ref: rentRef,
    value_anchored: anchor > 0,
    cond_pre: d.currentStatus, cond_post: tier.postCond,
    energy_pre: d.eCls, energy_post: targetECls,
    reno_cost: renoCost, reno_tier: tier.tier,
    total_investment: totalInvestment,
    gross_uplift: grossUplift, net_uplift: netUplift,
    profit_resold: profitIfResold,
    roi_pct: Math.round(renovationRoi*10)/10, capital_roi_pct: Math.round(capitalRoi*10)/10,
    monthly_rent: monthlyRent, annual_rent: annualRent,
    monthly_rent_net: monthlyRentNet, annual_rent_net: annualRentNet,
    pre_monthly_rent: preMonthlyRent, pre_annual_rent_net: preAnnualRentNet, rent_uplift_mo: rentUpliftMo,
    rent_benchmark: benchmarkMonthly, rent_asking_post: askingMonthlyPost, rent_asking_pre: askingMonthlyPre,
    rent_size_factor: sizeF, rent_factor_post: padjPost.factor, rent_factor_pre: padjPre.factor,
    rent_adjustments: padjPost.rows, rent_asking_to_achievable: ASKING_TO_ACHIEVABLE,
    gross_yield_pct: Math.round(grossYield*100)/100, net_yield_pct: Math.round(netYield*100)/100,
    pre_value_range: rng(preRenovTotal), post_value_range: rng(postRenovTotal),
    confidence, confidence_label, scenarios,
    recommendation, ceiling_hit: ceilingHit,
    trace
  };
}

/* ══════ ITALIAN BUILDING REGULATIONS ══════
   Sources: DM Sanità 5/7/1975 · DM 236/1989 · DPCM 5/12/1997 · 
   Reg. Edilizio Milano 2016 (Art.95-110) · DM Requisiti Minimi · NTC 2018 */
const REGS = {
  /* Minimum CEILING heights (m) */
  ceilingMain: 2.70,         // soggiorno, camere, cucina (DM 5/7/1975 Art.1)
  ceilingAccessory: 2.40,    // corridoi, disimpegni, bagni, ripostigli
  ceilingService: 2.10,      // locali tecnici
  ceilingMountainAbove1000m: 2.55,
  ceilingExistingMin: 2.40,  // recupero esistente (Reg.Ed. Art.95)
  /* Minimum room AREAS (m²) — Reg.Ed. Milano Art.97 + DM 5/7/1975 */
  minRoom: {
    soggiorno: 14,
    soggiornoConCottura: 17,
    cucina: 5,
    cameraSingola: 9,        // DM 5/7/1975 (8 in Reg.Ed.)
    cameraDoppia: 14,        // DM 5/7/1975 (12 in Reg.Ed.)
    studio: 7,
    bagnoLatoMin: 1.20,      // lato minimo bagno
    bagnoMinSqm: 3.5,
  },
  /* Whole apartment minimums */
  minMonolocale1pers: 28,    // DM 5/7/1975 Art.3
  minMonolocale2pers: 38,
  minAlloggio: 28,           // Reg.Ed. Art.96
  minAlloggioDisabili: 45,   // accessibile
  /* Per-occupant area */
  sqmPerOccupantFirst4: 14,
  sqmPerOccupantAdditional: 10,
  /* AERATION (natural ventilation) — Reg.Ed. Art.103 */
  aerationRatio: 0.10,       // openable window ≥ 1/10 floor area
  bagnoMinWindow: 0.50,      // m² minimum bath window
  /* ILLUMINATION — Reg.Ed. Art.105 + DM 5/7/1975 */
  illumRatio: 0.125,         // 1/8 floor area, fattore luce diurna ≥ 2%
  illumDepthRatio: 2.5,      // distance window→far wall ≤ 2.5× window height
  zenitalIllumRatio: 1/12,   // skylight
  /* ACCESSIBILITY — DM 236/1989 */
  doorWidthEntrance: 0.80,   // luce netta porta ingresso
  doorWidthInternal: 0.75,   // altre porte
  corridorMin: 1.00,         // larghezza corridoio comune (1.40 nei pubblici)
  wheelchairTurn: 1.50,      // diametro rotazione sedia rotelle
  rampMaxSlope: 0.08,        // 8%
  handrailHeight: 0.90,
  parapetMin: 1.00,
  /* ENERGY — DM Requisiti Minimi (DM 26/6/2015) */
  minEnergyClassRenov: "C",  // ristrutturazione importante 1° livello target
  /* ACOUSTIC — DPCM 5/12/1997 (Cat.A residenziale) */
  acoustic: {
    facciataD2mnT: 40,       // dB isolamento facciata
    partizioneR: 50,         // dB potere fonoisolante pareti tra unità
    calpestioL: 63,          // dB rumore calpestio max
  },
  /* ENERGY-EFFICIENCY — Lombardy DGR */
  insulationUmaxWall: 0.26,  // W/m²K (zona E Milano)
  insulationUmaxRoof: 0.22,
  insulationUmaxFloor: 0.30,

};

/* Compliance checker — runs against design data + scenario plan */
function runCompliance(d, s, area){
  const issues=[]; // {sev:"err"|"warn"|"ok", cat, code, msg}
  const ch=parseFloat(d.ch)||2.7;
  const eCls=d.eCls||"E";
  const postECls=s?.en?.aC||"C";
  const rooms=parseInt(d.rooms)||3;
  const baths=parseInt(d.baths)||1;

  /* Ceiling height — DM 5/7/1975 Art.1 */
  if(ch<REGS.ceilingExistingMin) issues.push({sev:"err",cat:"Altezza",code:"DM 5/7/1975",msg:`Altezza ${ch}m < ${REGS.ceilingExistingMin}m minimo per locali principali (anche in recupero)`});
  else if(ch<REGS.ceilingMain) issues.push({sev:"warn",cat:"Altezza",code:"DM 5/7/1975",msg:`Altezza ${ch}m < ${REGS.ceilingMain}m raccomandato per nuovi interventi (ammesso ${REGS.ceilingExistingMin}m in recupero)`});
  else issues.push({sev:"ok",cat:"Altezza",code:"DM 5/7/1975",msg:`Altezza ${ch}m ≥ ${REGS.ceilingMain}m ✓`});

  /* Total floor area */
  if(area<REGS.minAlloggio) issues.push({sev:"err",cat:"Superficie",code:"Reg.Ed. Art.96",msg:`Sup. utile ${area}m² < ${REGS.minAlloggio}m² minimo alloggio`});
  else issues.push({sev:"ok",cat:"Superficie",code:"Reg.Ed. Art.96",msg:`Sup. utile ${area}m² ≥ ${REGS.minAlloggio}m² ✓`});

  /* Estimate per-room area & flag if undersized */
  const livingArea=Math.max(14,area*0.30);
  const bedroomArea=rooms>1?(area*0.20):0;
  if(rooms>=2&&bedroomArea<REGS.minRoom.cameraDoppia) issues.push({sev:"warn",cat:"Camere",code:"Reg.Ed. Art.97",msg:`Verifica camera doppia ≥ ${REGS.minRoom.cameraDoppia}m² (stima ${bedroomArea.toFixed(1)}m²)`});
  if(livingArea<REGS.minRoom.soggiorno) issues.push({sev:"warn",cat:"Soggiorno",code:"DM 5/7/1975",msg:`Soggiorno < ${REGS.minRoom.soggiorno}m² minimo`});

  /* Bathroom — verify ≥ 1 with window OR VMC */
  if(baths<1) issues.push({sev:"err",cat:"Servizi",code:"Reg.Ed. Art.97-98",msg:"Almeno un bagno con dotazione minima (lavabo, doccia/vasca, wc, bidet)"});
  else issues.push({sev:"ok",cat:"Servizi",code:"Reg.Ed. Art.97-98",msg:`${baths} bagno/i — verificare lato min 1.20m e dotazione completa ✓`});

  /* Aeration & Illumination — needs window area data; flag as advisory */
  issues.push({sev:"warn",cat:"Aeroilluminazione",code:"Reg.Ed. Art.103-105",msg:`Verificare apribile ≥ 1/10 superficie locale (${(area*REGS.aerationRatio).toFixed(1)}m² tot.) e illuminante ≥ 1/8 (${(area*REGS.illumRatio).toFixed(1)}m²)`});

  /* Energy — DM Requisiti Minimi */
  const cls=["A4","A3","A2","A1","B","C","D","E","F","G"];
  const post=cls.indexOf(postECls), target=cls.indexOf(REGS.minEnergyClassRenov);
  if(post<0||target<0) issues.push({sev:"warn",cat:"Energetico",code:"DM 26/6/2015",msg:"Verificare classe post-intervento"});
  else if(post>target) issues.push({sev:"err",cat:"Energetico",code:"DM 26/6/2015",msg:`Post-renov classe ${postECls} non raggiunge ${REGS.minEnergyClassRenov} (ristrutturazione importante 1° liv.)`});
  else issues.push({sev:"ok",cat:"Energetico",code:"DM 26/6/2015",msg:`Classe ${postECls} ≥ ${REGS.minEnergyClassRenov} target ✓`});

  /* Accessibility — DM 236/1989 visitabilità sempre richiesta */
  issues.push({sev:"warn",cat:"Accessibilità",code:"DM 236/1989",msg:`Visitabilità: porta ingresso luce netta ≥ ${REGS.doorWidthEntrance*100}cm, almeno 1 bagno raggiungibile, soggiorno fruibile`});

  /* Acoustic — DPCM 5/12/1997 */
  issues.push({sev:"warn",cat:"Acustico",code:"DPCM 5/12/1997",msg:`Cat.A residenziale: facciata D2m,nT ≥ ${REGS.acoustic.facciataD2mnT}dB, R'w pareti ≥ ${REGS.acoustic.partizioneR}dB, calpestio L'nw ≤ ${REGS.acoustic.calpestioL}dB`});

  /* Riscontro d'aria — Reg.Ed. Art.100 */
  if(area>=60) issues.push({sev:"warn",cat:"Riscontro d'aria",code:"Reg.Ed. Art.100",msg:`Sup. ${area}m² ≥ 60m²: richiesto doppio affaccio o VMC`});
  else issues.push({sev:"ok",cat:"Riscontro d'aria",code:"Reg.Ed. Art.100",msg:`< 60m²: monoaffaccio ammesso (purché non orientato Nord ±30°) ✓`});

  return issues;
}

/* ══════ V7 UNIFIED AGENT GATE (Unified Master Prompt v7) ══════
   Envelope-invariance hard constraints + rule-ID compliance matrix.
   Per v7 §1.1 hard-constraint principle, §0.2 rule IDs, §1.7 permitted
   statuses: the app NEVER claims "compliant/approved/certified". */
const V7_INVARIANTS=[

function calcEnergy(cls,ch,a){
  /* Reductions calibrated on ENEA "riqualificazione importante" data 2020-2024.
     Combined multiplicatively (not summed) on the residual demand. */
  const b=ENERGY_MID[cls]||230;
  let residual = 1.0;
  if(ch.includes("Opaque envelope"))      residual *= 0.74;   // cappotto -26%
  if(ch.includes("Transparent envelope")) residual *= 0.90;   // serramenti -10%
  if(ch.includes("Ventilation system"))   residual *= 0.93;   // VMC double-flow -7%
  if(ch.includes("Heating system"))       residual *= 0.78;   // condensing boiler or PdC -22%
  if(ch.includes("Renewable sources"))    residual *= 0.85;   // solar+PV self-cons -15%
  if(ch.includes("Cooling system"))       residual *= 0.96;   // -4% on EPgl
  if(ch.includes("Smart controls"))       residual *= 0.96;   // -4% via zoning/regulation
  if(ch.includes("Other energy interventions")) residual *= 0.98;
  if(ch.includes("Complete energy upgrade")) residual = 0.42; // 58% total (NZEB-ready)
  if(ch.includes("Electrical upgrade"))   residual *= 0.99;
  if(ch.includes("Finishes refresh"))     residual *= 0.99;
  /* Realistic floor: cannot go below 0.30 (70% reduction) without NZEB intervention */
  residual = Math.max(0.30, residual);
  const af = b * residual;
  const sp = Math.round((1 - residual)*1000)/10;
  return{bC:cls,bS:b,aC:eCl(af),aS:Math.round(af*10)/10,sp};
}
function calcSave(a,eB,eA){
  const epDelta = Math.max(0,(ENERGY_MID[eB]||230)-(ENERGY_MID[eA]||230)); // kWh/m²·yr PRIMARY
  const deliveredPerSqm = epDelta / 1.6;          // primary→delivered
  const blendedPrice = 0.155;                      // €/kWh delivered (70% gas + 30% ele blend)
  const rawYear = deliveredPerSqm * a * blendedPrice;
  const capped = Math.min(rawYear, a * 40);        // realistic ceiling ~€40/m²·yr for deep retrofit
  return {yr:Math.round(capped), mo:Math.round(capped/12)};
}

/* ══════════════════════════════════════════════════════════════
   LOMBARDY CENED+2 ENERGY ENGINE (DDUO 2456/2017 + DM 26/6/2015)
   Pre/post-renovation EPgl,nren, class, consumption by vector,
   annual cost, CO2, and 30-year NPV with tax deductions
   ══════════════════════════════════════════════════════════════ */

/* Degree-days by Lombardy city (DPR 412/93) */
const LOMBARDY_GG = {
  milano:2404, milan:2404, bergamo:2533, brescia:2410, como:2587,
  cremona:2389, lecco:2598, lodi:2448, mantova:2388, monza:2404,
  "monza e brianza":2404, pavia:2623, sondrio:3084, varese:2652
};

/* Typical EPgl,nren by build era (Lombardy zone E, residential) */
const EPnren_BY_ERA = {
  "<1976":   {min:250, max:450, def:330, cls:"G"},
  "1976-1991":{min:180, max:280, def:225, cls:"F"},
  "1991-2005":{min:130, max:200, def:165, cls:"E"},
  "2005-2015":{min:90,  max:150, def:115, cls:"D"},
  ">2015":   {min:30,  max:60,  def:50,  cls:"A1"}
};
const ERA_FROM_YEAR = (y) => !y ? "1976-1991" : y<1976?"<1976" : y<1991?"1976-1991" : y<2005?"1991-2005" : y<2015?"2005-2015" : ">2015";

/* Primary energy non-renewable conversion factors (DM 26/6/2015 Tab.1) */
const F_PNREN = {gas:1.05, gpl:1.05, gasolio:1.07, pellet:0.20, elettricita:1.95, teleriscaldamento:1.50};

/* CO2 emission factors kgCO2/kWh */
const F_CO2 = {gas:0.202, gpl:0.227, gasolio:0.267, pellet:0.025, elettricita:0.257, teleriscaldamento:0.200};

/* ARERA Q2 2026 default tariffs */
const TARIFFS = {ele:0.3018, gas:1.2105, pellet:0.40, gasolio:1.55, fixed_ele:45, fixed_gas:70};

/* PCI (lower heating value) */
const PCI_GAS = 9.45; // kWh/Smc
const PCI_PELLET = 4.8; // kWh/kg

/* Determine class from EPgl,nren / EPgl,nren,rif ratio (DDUO 2456/2017 Tab.4) */
function classFromRatio(r){
  if(r<=0.40) return "A4";
  if(r<=0.60) return "A3";
  if(r<=0.80) return "A2";
  if(r<=1.00) return "A1";
  if(r<=1.20) return "B";
  if(r<=1.50) return "C";
  if(r<=2.00) return "D";
  if(r<=2.60) return "E";
  if(r<=3.50) return "F";
  return "G";
}

/* Reference EP for the standard building (zone E Lombardy) */
function EPnren_rif(GG, S_su_V){
  return (45 + 25*S_su_V) * (GG/2100) + 14; // kWh/m²·anno
}

/* Estimate pre-renovation EPgl,nren from user inputs or APE */
function estimateEPnrenPre(d){
  if(d.eCls && d.eCls !== "Unknown" && d.annualEnergy){
    const a = parseFloat(d.area)||85;
    return parseFloat(d.annualEnergy)/a;
  }
  const era = d.buildingEra || ERA_FROM_YEAR(parseInt(d.listingExtracted?.buildingYear));
  return EPnren_BY_ERA[era]?.def || 220;
}

/* Apply interventions multiplicatively to the heating-load fraction */
function applyInterventions(EP_pre, interventions){
  let EP = EP_pre;
  /* Envelope-related reductions on heating demand (about 60% of EP) */
  const heatingShare = 0.60;
  const acsShare = 0.20;
  const coolingShare = 0.10;
  let H = EP*heatingShare, W = EP*acsShare, C = EP*coolingShare;
  const baseElec = EP*0.10;

  if(interventions.includes("Opaque envelope")){ H*=0.62; C*=0.85; }    // cappotto 35% / 15%
  if(interventions.includes("Transparent envelope")){ H*=0.90; C*=0.93; } // serramenti 10% / 7%
  if(interventions.includes("Ventilation system")){ H*=0.90; }              // VMC 10%
  /* Plant changes */
  if(interventions.includes("Heating system")){ H *= 0.78; }                // caldaia condens. 22%
  if(interventions.includes("Complete energy upgrade")){ H*=0.45; C*=0.70; W*=0.55; }
  if(interventions.includes("Cooling system")){ C*=0.80; }
  if(interventions.includes("Renewable sources")){ W*=0.40; } // 60% ACS from solar/PV
  if(interventions.includes("Smart controls")){ H*=0.95; C*=0.95; }
  if(interventions.includes("Other energy interventions")){ H*=0.98; C*=0.98; }
  return Math.max(15, H + W + C + baseElec);
}

/* Decompose EP into gas + electricity consumption */
function decomposeConsumption(EP, area, heatingVector, hasHeatPump){
  const total_kWh = EP * area;
  const heating_kWh = total_kWh * 0.60;
  const acs_kWh = total_kWh * 0.20;
  const cooling_kWh = total_kWh * 0.10;
  const base_elec = total_kWh * 0.10;

  if(hasHeatPump){
    /* All H+W on electricity via SCOP=3.8 */
    const elec_total = (heating_kWh+acs_kWh)/3.8 + cooling_kWh/3.5 + base_elec + 2700;
    return {gas_Smc:0, elec_kWh:Math.round(elec_total), pellet_kg:0};
  }
  if(heatingVector==="pellet"){
    const pellet_kWh = heating_kWh + acs_kWh;
    return {gas_Smc:0, elec_kWh:Math.round(cooling_kWh/3.5 + base_elec + 2700), pellet_kg:Math.round(pellet_kWh/(0.85*PCI_PELLET))};
  }
  /* Default: gas heating + electric cooling + base */
  const eta_H = 0.85;
  const gas_kWh = (heating_kWh + acs_kWh) / eta_H;
  const elec_kWh = cooling_kWh/3.5 + base_elec + 2700;
  return {gas_Smc:Math.round(gas_kWh/PCI_GAS), elec_kWh:Math.round(elec_kWh), pellet_kg:0};
}

/* Cost from consumption */
function annualCost(c){
  return Math.round(c.gas_Smc * TARIFFS.gas + c.elec_kWh * TARIFFS.ele + c.pellet_kg * TARIFFS.pellet + (c.gas_Smc>0?TARIFFS.fixed_gas:0) + TARIFFS.fixed_ele);
}

/* CO2 from consumption */
function annualCO2(c){
  const gas_kWh = c.gas_Smc * PCI_GAS;
  return Math.round(gas_kWh * F_CO2.gas + c.elec_kWh * F_CO2.elettricita + (c.pellet_kg * PCI_PELLET * F_CO2.pellet));
}

/* PV annual production (Lombardy ~1100 kWh/kWp) with autoconsumo factor */
function pvProduction(kWp, hasBattery){
  const factor = hasBattery ? 0.70 : 0.32;
  return Math.round(kWp * 1100 * factor); // kWh self-consumed
}

/* 30-year NPV with discount rate, energy escalation, tax deductions */
function calcEnergyNPV(investment, taxDeductionRate, annualSaving, years=30, discount=0.04, energyEscalation=0.03){
  /* Tax deduction recovered in 10 years (Ecobonus/Bonus Casa) */
  const annualDeduction = investment * taxDeductionRate / 10;
  let npv = -investment;
  const cashflow = [];
  for(let y=1; y<=years; y++){
    const saving = annualSaving * Math.pow(1+energyEscalation, y-1);
    const deduction = y<=10 ? annualDeduction : 0;
    const yearCF = saving + deduction;
    npv += yearCF / Math.pow(1+discount, y);
    cashflow.push({year:y, saving:Math.round(saving), deduction:Math.round(deduction), cumNPV:Math.round(npv)});
  }
  return {npv:Math.round(npv), cashflow, paybackYears: investment>0&&annualSaving>0 ? +(investment*(1-taxDeductionRate)/annualSaving).toFixed(1) : null};
}

/* Master function — runs the full pre/post + NPV pipeline */
function runFullEnergyCalc(d, sol){
  const area = parseFloat(d.area)||85;
  const cityKey = (d.city||"").toLowerCase().trim();
  const GG = LOMBARDY_GG[cityKey] || 2404;
  const S_su_V = 0.65;
  const EPrif = EPnren_rif(GG, S_su_V);
  const EP_pre = estimateEPnrenPre(d);
  const EP_post = applyInterventions(EP_pre, sol.ch);
  const heatingVector = d.heatingType==="Pompa di calore" ? "elettricita" : d.heatingType==="Centralizzato"?"teleriscaldamento":"gas";
  const hasPdC_pre = d.heatingType==="Pompa di calore";
  const hasPdC_post = sol.ch.includes("Heating system") || sol.ch.includes("Complete energy upgrade");
  const cons_pre = decomposeConsumption(EP_pre, area, heatingVector, hasPdC_pre);
  let cons_post = decomposeConsumption(EP_post, area, heatingVector, hasPdC_post);

  /* PV self-consumption subtracts from electricity */
  if(sol.ch.includes("Renewable sources") || sol.ch.includes("Complete energy upgrade")){
    const kWp = 3, hasBattery = sol.ch.includes("Complete energy upgrade");
    const pv = pvProduction(kWp, hasBattery);
    cons_post.elec_kWh = Math.max(0, cons_post.elec_kWh - pv);
  }

  const cost_pre = annualCost(cons_pre);
  const cost_post = annualCost(cons_post);
  const co2_pre = annualCO2(cons_pre);
  const co2_post = annualCO2(cons_post);
  const cls_pre = classFromRatio(EP_pre/EPrif);
  const cls_post = classFromRatio(EP_post/EPrif);
  const saving_year = cost_pre - cost_post;

  /* Investment subset for energy-only interventions */
  const energyInterv = ["Opaque envelope","Transparent envelope","Heating system","Cooling system","Renewable sources","Ventilation system","Complete energy upgrade","Smart controls","Other energy interventions"];
  const investmentEnergy = Math.round(
    (sol.co.heating||0) + (sol.co.cooling||0) + (sol.co.windows||0) +
    (sol.co.insulation_int||0) + (sol.co.solar||0) + (sol.co.ventilation||0) +
    (sol.co.smart||0) + (sol.co.led||0)
  );
  const taxRate = 0.50; // Ecobonus primary residence 2026

  const npvResult = calcEnergyNPV(investmentEnergy, taxRate, saving_year, 30, 0.04, 0.03);

  const rapportoPre = EP_pre/EPrif;
  const rapportoPost = EP_post/EPrif;

  return {
    GG, EPrif: Math.round(EPrif*10)/10,
    ante: {
      EPnren: Math.round(EP_pre*10)/10,
      classe: cls_pre,
      rapporto: Math.round(rapportoPre*100)/100,
      cons: cons_pre,
      cost: cost_pre,
      co2: co2_pre
    },
    post: {
      EPnren: Math.round(EP_post*10)/10,
      classe: cls_post,
      rapporto: Math.round(rapportoPost*100)/100,
      cons: cons_post,
      cost: cost_post,
      co2: co2_post
    },
    delta: {
      saving_year,
      saving_pct: Math.round((1 - EP_post/EP_pre)*1000)/10,
      co2_kg_saved: co2_pre - co2_post,
      class_jumps: Math.max(0, (ENERGY_RANK[cls_post]||0) - (ENERGY_RANK[cls_pre]||0))
    },
    economy: {
      investment_gross: investmentEnergy,
      tax_deduction: Math.round(investmentEnergy*taxRate),
      investment_net: Math.round(investmentEnergy*(1-taxRate)),
      payback_years: npvResult.paybackYears,
      npv_30y: npvResult.npv,
      cashflow: npvResult.cashflow
    }
  };
}

function calcVal(a,ci,bd,ch,eB,eA,currentStatus){
  const cityKey=(ci||"").toLowerCase().trim();
  let ref=CITY_PRICES[cityKey]||LOMBARDY_AVG;
  /* Status-based discount on current value */
  const statusDiscount={"Da ristrutturare":.82,"Buono / Abitabile":.92,"Ristrutturato":.98,"Nuovo / In costruzione":1.02,"Ottimo":1.0};
  const disc=statusDiscount[currentStatus]||.88;
  const pB=ref*disc;
  /* Renovation uplift */
  let rP=0;
  if(ch.includes("Finishes refresh"))rP+=.04;if(ch.includes("Kitchen upgrade"))rP+=.03;if(ch.includes("Bathroom upgrade"))rP+=.03;
  if(ch.includes("Internal layout optimization")||ch.includes("Home office / flex room"))rP+=.04;if(ch.includes("Storage boost"))rP+=.02;
  if(ch.includes("Bathroom addition"))rP+=.02;if(ch.includes("Walk-in closet"))rP+=.01;if(ch.includes("Ceiling renovation"))rP+=.01;
  const cG=Math.max(0,(ENERGY_RANK[eA]||0)-(ENERGY_RANK[eB]||0));
  const up=Math.min(.18,rP+Math.min(.09,cG*.015));
  const pA=pB*(1+up);
  /* Tax benefit calculation (2026 rates) */
  const taxableItems=ch.filter(c=>INTERVENTIONS[c]?.tax50);
  const taxBenefitRate=.36; /* 2026: 36% primary, 30% secondary — use 36% as default */
  const taxBenefitMax=96000;
  const totalTaxable=Math.min(taxBenefitMax,Math.round(Object.entries(calcCosts(a,ch,"Contemporary",bd,3)).filter(([k])=>!["total","professional_fees"].includes(k)).reduce((s,[_,v])=>s+v,0)));
  const taxBenefit=Math.round(totalTaxable*taxBenefitRate);
  return{pB:Math.round(pB),pA:Math.round(pA),vB:Math.round(pB*a),vA:Math.round(pA*a),up:Math.round(up*1e3)/10,taxBenefit,taxBenefitAnnual:Math.round(taxBenefit/10)};

const fmt=n=>n==null?"—":"€"+n.toLocaleString("it-IT");
const fmtK=n=>n>=1e3?"€"+(n/1e3).toFixed(0)+"k":"€"+n;

/* 3-SOLUTION GENERATOR */
const T_E=["Finishes refresh","Storage boost","Ceiling renovation","Wall treatments","Other energy interventions"];
const T_C=["Kitchen upgrade","Bathroom upgrade","Electrical upgrade","Plumbing upgrade","Smart controls"];
const T_P=["Internal layout optimization","Heating system","Transparent envelope","Opaque envelope","Cooling system","Renewable sources","Complete energy upgrade","Home office / flex room","Ventilation system","Bathroom addition"];

/* Budget targets per tier as a share of the user's preferred budget.
   Essential ≈ budget −25% (hard max), Balanced ≈ budget, Premium ≈ budget +25%
   (the overall hard cap). When the user sets a budget the three solutions are
   scaled to hit these targets; otherwise the intrinsic cost model is used. */
const BUDGET_TARGET = {Essential:0.75, Balanced:1.00, Premium:1.25};

function genSols(d){
  const a=parseFloat(d.area)||85,rm=parseInt(d.rooms)||3,ec=d.eCls==="Unknown"?"E":d.eCls,all=d.changes;
  const budget=parseEuro(d.budget);                 // user preferred renovation budget (€)
  const budgetCap=budget>0?Math.round(budget*1.25):null; // budget +25% hard cap
  const ess=[...all.filter(c=>T_E.includes(c)),...all.filter(c=>T_C.includes(c)).slice(0,2)];
  const bal=[...all];
  const pre=[...all,...T_P.filter(c=>!all.includes(c)).slice(0,3)];
  const mk=(nm,ch,qm,mg)=>{
    const ch2=ch.length?ch:["Finishes refresh"];
    const co=calcCosts(a,ch2,d.style,d.band,rm),adj={...co};
    Object.keys(adj).forEach(k=>{if(k!=="total"&&k!=="professional_fees")adj[k]=Math.round(adj[k]*qm)});
    adj.total=Object.entries(adj).filter(([k])=>k!=="total").reduce((x,[_,v])=>x+v,0);
    const modelTotal=adj.total;
    /* Budget scaling: resize every line item proportionally so the construction
       total lands on this tier's budget target — never above budget +25%. */
    let budgetTarget=null, budgetScaled=false;
    if(budget>0){
      budgetTarget=Math.min(Math.round(budget*BUDGET_TARGET[nm]), budgetCap);
      if(adj.total>0){
        const scale=budgetTarget/adj.total;
        Object.keys(adj).forEach(k=>{if(k!=="total")adj[k]=Math.round(adj[k]*scale)});
        adj.total=Object.entries(adj).filter(([k])=>k!=="total").reduce((x,[_,v])=>x+v,0);
        budgetScaled=Math.abs(scale-1)>0.001;
      }
    }
    const en=calcEnergy(ec,ch2,a),sv=calcSave(a,en.bC,en.aC),sc=calcSched(a,ch2);
    const solDraft={nm,ch:ch2,co:adj,en,sv,sc,mg,qm,modelTotal,budgetTarget,budgetScaled,budgetCap,
      overBudgetCap: budgetCap!=null && adj.total>budgetCap};
    const vl=calcLombardyVal(d,solDraft); // reads co.total as the actual reno cost
    return{...solDraft,vl};
  };
  return[
    mk("Essential",ess,.85,"Standard-grade: laminate, painted MDF, basic ceramic, standard fixtures"),
    mk("Balanced",bal,1,"Mid-range "+d.style+": "+(STYLES[d.style]?.mat||"quality finishes")),
    mk("Premium",pre,1.25,"Premium "+d.style+": high-end "+(STYLES[d.style]?.mat||"luxury finishes")+", top fixtures, custom joinery")
  ];
}

    out += `\n\nUSER PREFERRED-BUDGET CEILING (client hard requirement — outranks the %-of-value ceiling): basic ≤ ${eur(sol.budgetCap/1.25*0.75)} (budget −25%) · intermediate ≈ ${eur(sol.budgetCap/1.25)} (budget) · premium ≤ ${eur(sol.budgetCap)} (budget +25%, ABSOLUTE CAP — no scenario may exceed this).`;
    out += `\nTHIS SCENARIO ("${sol.nm}" = ${TIER_LABEL[sol.nm]}): target ${eur(sol.budgetTarget)}, must stay ≤ ${eur(sol.budgetCap)}.`;
    if(Number.isFinite(cost)) out += ` Current estimated cost ${eur(cost)} → ${cost<=sol.budgetCap?"WITHIN the budget +25% cap.":"OVER the budget +25% cap: reduce scope / choose more economical interventions, furniture and materials until below the cap."}`;
  } else if(vB && Number.isFinite(vB) && vB>0){
    /* FALLBACK: %-of-initial-value ceilings when no budget was entered */
    out += `\nINITIAL APARTMENT VALUE (pre-renovation) = ${eur(vB)}. Absolute ceilings: basic ≤ ${eur(vB*0.10)} · intermediate ≤ ${eur(vB*0.20)} · premium ≤ ${eur(vB*0.35)}.`;
    const pct = TIER_PCT[sol?.nm];
    if(pct){
      const cap = vB*pct;
      out += `\nTHIS SCENARIO ("${sol.nm}" = ${TIER_LABEL[sol.nm]} intervention): total cost MUST stay ≤ ${eur(cap)} (${Math.round(pct*100)}% of initial value).`;
      if(Number.isFinite(cost)) out += ` Current estimated cost ${eur(cost)} → ${cost<=cap?"WITHIN ceiling.":"OVER ceiling: reduce scope, choose more economical interventions, furniture and materials until the total is below the threshold."}`;
    }
  }
  return out;
}

const STYLE_TO_PROVIDERS = {
  Japandi:           {prefer:["IKEA_IT","MAISONS_DU_MONDE","WESTWING","SCAVOLINI"]},
  Scandinavian:      {prefer:["IKEA_IT","MAISONS_DU_MONDE","WESTWING"]},

  "Industrial Soft": {prefer:["LEROY_MERLIN","IKEA_IT","WESTWING"]},
  "Classic Modern":  {prefer:["NATUZZI","MAISONS_DU_MONDE","COIN_CASA","SCAVOLINI"]},
