ITALY + LOMBARDY BUILDING-CODE COMPLIANCE — HARD CONSTRAINTS
Sources: DM 5/7/1975 · DPR 380/2001 art.34-bis · L.R. Lombardia 12/2005 · DM 236/1989 · L.13/1989 · D.Lgs.42/2004 · L.R.33/2015 + NTC2018 · D.Lgs.192/2005 + DDUO 18546/2019 · DM 37/2008 · DPR 151/2011

ENVELOPE INVARIANCE — ABSOLUTE HARD CONSTRAINT (DPR 380/2001 sagoma; project scope)
- External / perimeter walls: FROZEN (position + thickness) — never moved, pierced or removed
- Main entrance door: FROZEN — same wall, position, width, swing
- Windows: FROZEN — exact count, position and size; none added, removed or resized
- Balcony / French doors (porte-finestra) to balconies, loggias, terraces: FROZEN — exact count, position and size; never added, removed, resized, or converted to/from a window
- Overall apartment shape, footprint and net floor area: FROZEN — zero deviation
- Balconies, loggias, terraces: geometry FROZEN
- THE ONLY PERMITTED CHANGES: internal non-load-bearing partitions (tramezzi) and internal doors — add / remove / relocate / resize. A load-bearing internal wall stays FROZEN (seismic-restricted).

CEILING HEIGHTS (DM 5/7/1975 art.1)
- Habitable rooms (living/dining/kitchen/bedroom/studio): ≥ 2.70 m
- Bathrooms, corridors, halls, storage: ≥ 2.40 m
- Mountain >1000m a.s.l. habitable: ≥ 2.55 m
- Heritage-protected habitable: ≥ 2.40 m (accessory ≥ 2.20 m)
- DPR 380 art.34-bis ±2% tolerance allowed on EXISTING parts; new works hit nominal

FLOOR AREAS (DM 5/7/1975 art.2-3)
- Single bedroom ≥ 9 m² · Double bedroom ≥ 14 m² · Living ≥ 14 m²
- Per-occupant: 14 m² each for first 4, 10 m² each thereafter
- Mono-room studio: ≥ 28 m² (1 occ.) / ≥ 38 m² (2 occ.)
- ≥ 1 bathroom with WC + bidet + bath/shower + washbasin
- Second bathroom ≥ 2.00 m²

LIGHT & VENTILATION (DM 5/7/1975 art.5-6)
- Every habitable room: openable window directly outside (or compliant cavedio)
- FLDm ≥ 2% (heritage waiver 1%)
- RAI = openable window area / floor area ≥ 1/8 (heritage waiver 1/16)
- Roof windows ≥ 1/12 to 1/16 per local RE
- Room depth ≤ 2.5× window-header height (up to 3.5× if RAI raised to 25%)
- Bathroom: openable window ≥ 0.50 m² OR mechanical extraction ≥ 6 vol/h continuous / ≥ 12 vol/h intermittent
- No open-flame appliances in windowless bathrooms
- Cooking corner: openly connected to living + forced extraction over hob
- Cross-ventilation required if dwelling > 70 m² or > 1 bedroom

ACCESSIBILITY VISITABILITY (DM 236/1989)
- Main entrance door clear width ≥ 80 cm · Other internal doors ≥ 75 cm
- Door handles 85-95 cm height · Single leaf ≤ 120 cm · Force ≤ 8 kg
- Floor level changes ≤ 2.5 cm (or ramp ≤ 8% normal / ≤ 12% short rise ≤ 50 cm)
- Window handles 100-130 cm · Parapets ≥ 100 cm, 10 cm sphere non-traversable
- Switches/thermostats/intercom 40-140 cm height
- Accessible bathroom: WC lateral clear ≥ 80 cm · Washbasin frontal clear ≥ 80 cm · Wheelchair turn Ø 150 cm · Door outward or sliding
- Corridor width ≥ 100 cm · Turning area Ø 140 cm at length > 10 m
- Adattabilità required for every other unit (room to install accessible bathroom + widen entrance later without moving structural walls/risers)

STRUCTURAL & SEISMIC (L.R. Lombardia 33/2015 + NTC 2018)
- DO NOT remove/pierce load-bearing walls (muratura portante, pilastri, setti, travi) — only flag as "seismic-restricted: requires structural project + SCIA/PdC"
- New partitions: lightweight (plasterboard) ≤ 60 kg/m² unless slab verified
- Lombardy seismic zones 2-4 trigger NTC verification on structural works

HERITAGE (D.Lgs. 42/2004)
- If heritage_protected = true: no changes to external openings, façade, original roof, frescoes, coffered/stuccoed ceilings, historic wood/marble floors, original stairs
- Original distributive scheme (enfilade, central corridor) preserved unless Soprintendenza authorization is asserted
- Apply L.120/2020 relaxed limits where useful

ENERGY (D.Lgs. 192/2005 + DDUO Lombardia 18546/2019, Zone E)
- U-walls ≤ 0.26 W/m²K · U-roof ≤ 0.22 · U-floor ≤ 0.26 · U-window ≤ 1.40 · U-glass ≤ 1.10
- RES quota: ≥ 60% DHW + ≥ 50% total
- Air-permeability ≤ 0.6 vol/h @ 50 Pa
- Indoor design T: 18-20 °C
- New south/west glazing > 25% wall area needs external shading

PLANT SYSTEMS (DM 37/2008)
- No sockets within 60 cm of bath/shower edge or washbasin spout
- Gas boiler needs permanent vent ≥ 6 cm²/kW (≥ 100 cm² total) or sealed-chamber/external
- Plumbing risers: do not relocate across slabs

FIRE (DPR 151/2011 + DM 246/1987 residential)
- Buildings antincendio height > 24 m → VVF approval required
- Protected stairs (filtro a prova fumo) when height > 32 m
- Apartment door EI30 (height 12-24 m) / EI60 (> 24 m)
- Common-corridor escape ≤ 30 m single dir / ≤ 40 m two dir
- No bedrooms in piano interrato without secondary escape

NEVER:
✗ Move/remove/pierce an external perimeter wall
✗ Add, remove, resize or reposition any window
✗ Add, remove, resize or reposition any balcony / French door (porta-finestra); never convert it to a window or wall
✗ Move, resize or reorient the main entrance door
✗ Change the overall apartment shape, footprint or net floor area
✗ Place habitable room with no openable exterior window
✗ Place kitchen/bedroom/living over bathroom of unit below
✗ Remove load-bearing element without flagging structural project
✗ Reduce corridor < 100 cm or door < 75 cm clear
✗ Reduce habitable ceiling height < 2.70 m (or heritage waiver value)
✗ Move plumbing stack across slab without acoustic + structural note
✗ Output a plan as "compliant" without §5 validation table

PERMITS: CILA (non-structural internal), SCIA (ristrutturazione leggera, openings in non-LB walls), PdC (ristrutturazione pesante, load-bearing modifications, volumetric changes). Never reduce the required title.

/* ══════════════════════════════════════════════════════════════
   AI MODEL AUTO-SELECTION
   Automatically activate the most recent / advanced models the API key can
   reach: the newest Gemini for info extraction + validation, and Nano Banana
   (Nano Banana Pro / Gemini image) for rendering. Defaults are safe; once a
   key is present detectBestModels() queries the live model list and upgrades.
   ══════════════════════════════════════════════════════════════ */
const AI_MODELS = { vision: "gemini-2.5-flash", image: "gemini-3-pro-image-preview", detected: false, label: "" };
/* Preference order — first available wins (newest / most capable first) */
const VISION_PREFS = ["gemini-3.5-flash","gemini-3.1-pro-preview","gemini-3-pro-preview","gemini-3-flash-preview","gemini-flash-latest","gemini-2.5-flash","gemini-2.0-flash"];
const IMAGE_PREFS  = ["gemini-3-pro-image","gemini-3-pro-image-preview","gemini-3.1-flash-image","gemini-3.1-flash-image-preview","gemini-2.5-flash-image"];
/* Gemini 3.x / 2.5 are "thinking" models: reasoning consumes the output-token
   budget, so a small maxOutputTokens truncates the JSON (fr=MAX_TOKENS) and
   extraction/validation silently return nothing. Disable thinking for these
   structured-output tasks and give an ample token budget. */
function _thinkingModel(m){ return /gemini-(2\.5|3(\.\d+)?)/.test(m||""); }
function visionCfg(maxTokens, extra){
  const c = Object.assign({temperature:0.1, maxOutputTokens:maxTokens||2048}, extra||{});
  if(_thinkingModel(AI_MODELS.vision)) c.thinkingConfig = {thinkingBudget:0};
  return c;
}

async function detectBestModels(apiKey){
  if(!apiKey) return AI_MODELS;
  try{
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key="+apiKey);
    if(!r.ok) return AI_MODELS;
    const j = await r.json();
    const gen = new Set((j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace("models/","")));
    const pick = (prefs,cur)=>prefs.find(m=>gen.has(m))||cur;
    AI_MODELS.vision = pick(VISION_PREFS, AI_MODELS.vision);
    AI_MODELS.image  = pick(IMAGE_PREFS,  AI_MODELS.image);
    AI_MODELS.detected = true;
    AI_MODELS.label = "🍌 "+AI_MODELS.image+" · ✨ "+AI_MODELS.vision;
    console.log("[AI models] render:",AI_MODELS.image," | extract/validate:",AI_MODELS.vision);
  }catch(e){ console.warn("model detection failed", e); }
  return AI_MODELS;
}

/* Serialize d.iv into a v7 §B prompt block for plan & render generation */
function ivBrief(d){
  const iv=d.iv||{};const ks=Object.keys(iv).filter(k=>iv[k]);if(!ks.length)return"";
  const byCat={};ks.forEach(k=>{const[c]=k.split("::");(byCat[c]=byCat[c]||[]).push(k)});
  let out="\nSELECTED INTERVENTION PROGRAMME (Unified Agent v7 §A/§B) — the client selected these interventions. They EXTEND the permitted optimisations above but remain SUBORDINATE to every envelope hard constraint (outer walls, main entrance, sagoma/footprint, windows, balcony/French doors (porte-finestra), load-bearing structure, risers = FROZEN; only internal partitions and internal doors may change). Where an intervention conflicts with a hard constraint, do NOT execute it silently — flag it and apply the closest compliant alternative.\n";
  Object.entries(byCat).forEach(([c,items])=>{
    out+=`\n[${c}]${IV_CAT[c]?.v?` ⚠ ${IV_CAT[c].v}`:""}\n`;
    items.forEach(k=>{const o=iv[k],n=k.split("::")[1];
      out+=`• ${n} — priority ${o.pri||"Preferred"} · extent ${o.ext||"Full"} · budget ${o.bud||"Balanced"} · timing ${o.tim||"Immediate"} · ${o.flx||"Open to alternatives"}${o.rooms?` · target: ${o.rooms}`:""}${o.keep?` · preserve: ${o.keep}`:""}${o.rm?` · remove: ${o.rm}`:""}\n`;});
  });
  out+=`\nFor EACH intervention above assess: layout effect · usable surface · structural implications · plumbing/drainage · electrical/HVAC · light & ventilation · accessibility · fire safety · acoustics · energy · façade/condominium · authorisations · relative cost & complexity. Classify each as feasible / conditionally feasible / non-feasible / not verifiable. Essential interventions must be included or explicitly flagged as infeasible with the reason and the closest compliant alternative.\n`;
  return out;
}

/* Match user city / address to Milan zone (fuzzy keyword) */
function matchMilanZone(d){
  const hay = ((d.address||"")+" "+(d.city||"")+" "+(d.listingExtracted?.address||"")).toLowerCase();
  if(!hay.includes("milan")&&!hay.includes("milano")) return null;
  /* find best matching zone by keyword */
  let best=null,bestScore=0;
  MILAN_ZONE_BENCHMARKS.forEach(zone=>{
    const keys=zone.z.toLowerCase().split(/[,\s]+/).filter(k=>k.length>3);
    let score=0;
    keys.forEach(k=>{if(hay.includes(k))score++;});
    if(score>bestScore){bestScore=score;best=zone;}
  });
  return bestScore>0?best:MILAN_ZONE_BENCHMARKS.find(z=>z.z==="Centro"); // default Milan central if no match
}

/* Master valuation function — returns full traceable breakdown */
function calcLombardyVal(d, sol){
  const area = parseFloat(d.area)||85;
  const trace = []; // step-by-step log

  /* STEP 1: Geography → reference €/m² */
  const milanZone = matchMilanZone(d);
  const askingRef = milanZone?.sale || CITY_PRICES[(d.city||"").toLowerCase().trim()] || LOMBARDY_AVG;
  const rentRef = milanZone?.rent || 14;
  const omiMin = Math.round(askingRef * 0.85); // OMI typically 15% below listing
  const omiMax = Math.round(askingRef * 1.05);
  trace.push({step:1, label:"Geography", note: milanZone ? `Milan zone "${milanZone.z}"` : (d.city||"Lombardy")+" municipality avg",
    OMI_min:omiMin, OMI_max:omiMax, asking_ref:askingRef, rent_ref:rentRef});

  /* STEP 2: Base OMI €/m² weighted by current condition */
  const condPos = COND_POSITION[d.currentStatus] ?? 0.50;
  const baseOMI = Math.round(omiMin + (omiMax - omiMin) * condPos);
  trace.push({step:2, label:"Base OMI (weighted by current condition)", note:`${d.currentStatus||"normal"} → position ${condPos}`, value:baseOMI});

  /* STEP 3: Market calibration — blend OMI (60%) with asking (40%) - discount 5% */
  const OMI_WEIGHT = 0.60, ASK_WEIGHT = 0.40, ASK_DISCOUNT = 0.05;
  const calibrated = Math.round(OMI_WEIGHT * baseOMI + ASK_WEIGHT * askingRef * (1 - ASK_DISCOUNT));
  trace.push({step:3, label:"Calibrated market €/m²", note:`60% OMI + 40% asking (–5% to transaction)`, value:calibrated});

  /* STEP 4: Property-specific adjustments */
  const adj = {};
  /* Floor */
  const floor = parseInt(d.floor)||3;
  const hasElevator = d.elevator !== false;
  if(hasElevator){
    if(floor===0) adj.floor=-0.04;
    else if(floor>=4) adj.floor=0.04;
    else adj.floor=0.02;
  } else {
    if(floor===0) adj.floor=-0.05;
    else if(floor>=4) adj.floor=-0.10;
    else if(floor>=3) adj.floor=-0.06;
    else adj.floor=-0.02;
  }
  /* Outdoor space (best guess from features) */
  const features = (d.listingExtracted?.features||[]).map(f=>f.toLowerCase()).join(" ");
  if(features.includes("terraz")) adj.outdoor = features.includes("grand")||features.includes("large") ? 0.08 : 0.05;
  else if(features.includes("balcon")) adj.outdoor = 0.02;
  else adj.outdoor = 0;
  /* Condo expenses */
  const condoY = parseFloat(d.listingExtracted?.condominium)||0;
  if(condoY>0){
    if(condoY < 1200) adj.condo=0.02;
    else if(condoY < 2500) adj.condo=0.00;
    else if(condoY < 4000) adj.condo=-0.03;
    else adj.condo=-0.06;
  } else adj.condo=0;

  const adjSum = Math.max(-0.20, Math.min(0.20, (adj.floor||0)+(adj.outdoor||0)+(adj.condo||0)));
  const adjusted = Math.round(calibrated * (1 + adjSum));
  trace.push({step:4, label:"Property adjustments", note:`floor ${adj.floor*100||0}% · outdoor ${(adj.outdoor*100)||0}% · condo ${(adj.condo*100)||0}% → total ${(adjSum*100).toFixed(1)}%`, value:adjusted, adjustments:adj});

  /* STEP 5: Energy class premium (pre-renovation) */
  const ePremPre = ENERGY_PREMIUM[d.eCls] ?? -0.03;
  const preRenovPerSqm = Math.round(adjusted * (1 + ePremPre));
  const preRenovTotal = Math.round(preRenovPerSqm * area);
  trace.push({step:5, label:"Energy class premium (pre)", note:`${d.eCls||"?"}: ${(ePremPre*100).toFixed(1)}%`, value:preRenovPerSqm, total:preRenovTotal});

  /* STEP 6: Renovation cost from tier + interventions */
  const tier = TIER_TO_RENO[sol.nm] || TIER_TO_RENO["Balanced"];
  const renoBase = RENO_COST_PER_SQM[tier.tier].typ;
  let renoCost = area * renoBase;
  /* Add intervention adders */
  const interv = sol.ch || [];
  const adders = {};
  if(interv.includes("Electrical upgrade")) adders.electrical = 6000;
  if(interv.includes("Plumbing upgrade")) adders.plumbing = 12000;
  if(interv.includes("Bathroom upgrade")) adders.bathroom = 12000;
  if(interv.includes("Transparent envelope")) adders.windows = area * 0.15 * 750; // ~15% wall is windows
  if(interv.includes("Heating system")) adders.heatpump = 9000;
  if(interv.includes("Cooling system")) adders.aircon = 4500;
  if(interv.includes("Complete energy upgrade")) adders.deep_retrofit = 15000;
  adders.cila = 2500;
  Object.values(adders).forEach(v => renoCost += v);
  const contingency = renoCost * 0.12;
  renoCost = Math.round(renoCost + contingency);
  trace.push({step:6, label:"Renovation cost", note:`${tier.tier}: €${renoBase}/m² × ${area}m² + adders + 12% contingency`, value:renoCost, adders, contingency:Math.round(contingency)});

  /* STEP 7: Post-renovation value */
  const postCondPos = COND_POSITION[tier.postCond];
  const postBaseOMI = Math.round(omiMin + (omiMax - omiMin) * postCondPos);
  const postCalibrated = Math.round(OMI_WEIGHT * postBaseOMI + ASK_WEIGHT * askingRef * (1 - ASK_DISCOUNT));
  const targetECls = sol.en?.aC || "C";
  const ePremPost = ENERGY_PREMIUM[targetECls] ?? 0.02;
  let postPerSqmUncapped = Math.round(postCalibrated * (1 + adjSum + ePremPost + tier.qualityAdj));
  /* Market ceiling = local prime benchmark × 1.05 */
  const ceiling = Math.round(askingRef * 1.05);
  const postPerSqm = Math.min(postPerSqmUncapped, ceiling);
  const ceilingHit = postPerSqmUncapped > ceiling;
  const postRenovTotal = Math.round(postPerSqm * area);
  trace.push({step:7, label:"Post-renovation €/m²", note:`post-condition ${tier.postCond} + ${targetECls} class +${(ePremPost*100).toFixed(1)}% + quality +${(tier.qualityAdj*100).toFixed(1)}%${ceilingHit?" [capped at market ceiling]":""}`, value:postPerSqm, total:postRenovTotal, ceilingHit, ceiling});

  /* STEP 8: Investment + ROI */
  const purchase = d.listingExtracted?.price || preRenovTotal;
  const agencyFee = purchase * 0.03;
  const notaryTax = purchase * 0.04;
  const totalInvestment = Math.round(purchase + agencyFee + notaryTax + renoCost);
  const grossUplift = postRenovTotal - preRenovTotal;
  const netUplift = grossUplift - renoCost;
  const profitIfResold = postRenovTotal - totalInvestment;
  const roi = totalInvestment>0 ? (profitIfResold/totalInvestment)*100 : 0;
  trace.push({step:8, label:"Investment & ROI", note:`Purchase €${(purchase/1000).toFixed(0)}k + 3% agency + 4% notary/tax + reno`, value:totalInvestment, gross_uplift:grossUplift, net_uplift:netUplift, profit_resold:profitIfResold, roi_pct:Math.round(roi*10)/10});

  /* STEP 9: Rent + yield */
  const rentCoef = {"Essential":1.05, "Balanced":1.12, "Premium":1.20}[sol.nm] || 1.0;
  const monthlyRent = Math.round(rentRef * area * rentCoef);
  const annualRent = monthlyRent * 12;
  const grossYield = totalInvestment>0 ? (annualRent/totalInvestment)*100 : 0;
  trace.push({step:9, label:"Rent potential", note:`Zone rent €${rentRef}/m²/mo × ${area}m² × ${rentCoef} condition coef`, monthly:monthlyRent, annual:annualRent, gross_yield_pct:Math.round(grossYield*100)/100});

  /* STEP 10: Recommendation */
  let recommendation = "Not recommended unless strategic reason";
  if(roi >= 15) recommendation = "Strong investment candidate";
  else if(roi >= 8) recommendation = "Moderate investment candidate";
  else if(roi >= 0) recommendation = "Low-margin — negotiate price or reduce reno scope";

  return {
    /* legacy compat */
    pB: preRenovPerSqm, pA: postPerSqm, vB: preRenovTotal, vA: postRenovTotal,
    up: Math.round((postPerSqm/preRenovPerSqm - 1)*1000)/10,
    taxBenefit: Math.round(renoCost*0.50),
    taxBenefitAnnual: Math.round(renoCost*0.50/10),
    /* new traceable detail */
    zone: milanZone?.z || (d.city||"Lombardy"),
    OMI_range: [omiMin, omiMax],
    asking_ref: askingRef,
    rent_ref: rentRef,
    cond_pre: d.currentStatus, cond_post: tier.postCond,
    energy_pre: d.eCls, energy_post: targetECls,
    reno_cost: renoCost, reno_tier: tier.tier,
    total_investment: totalInvestment,
    gross_uplift: grossUplift, net_uplift: netUplift,
    profit_resold: profitIfResold, roi_pct: Math.round(roi*10)/10,
    monthly_rent: monthlyRent, annual_rent: annualRent, gross_yield_pct: Math.round(grossYield*100)/100,
    recommendation, ceiling_hit: ceilingHit,
    trace
  };
}

/* Compliance checker — runs against design data + scenario plan */
function runCompliance(d, s, area){
  const issues=[]; // {sev:"err"|"warn"|"ok", cat, code, msg}
  const ch=parseFloat(d.ch)||2.7;
  const eCls=d.eCls||"E";
  const postECls=s?.en?.aC||"C";
  const rooms=parseInt(d.rooms)||3;
  const baths=parseInt(d.baths)||1;

  /* Ceiling height — DM 5/7/1975 Art.1 */
  if(ch<REGS.ceilingExistingMin) issues.push({sev:"err",cat:"Altezza",code:"DM 5/7/1975",msg:`Altezza ${ch}m < ${REGS.ceilingExistingMin}m minimo per locali principali (anche in recupero)`});
  else if(ch<REGS.ceilingMain) issues.push({sev:"warn",cat:"Altezza",code:"DM 5/7/1975",msg:`Altezza ${ch}m < ${REGS.ceilingMain}m raccomandato per nuovi interventi (ammesso ${REGS.ceilingExistingMin}m in recupero)`});
  else issues.push({sev:"ok",cat:"Altezza",code:"DM 5/7/1975",msg:`Altezza ${ch}m ≥ ${REGS.ceilingMain}m ✓`});

  /* Total floor area */
  if(area<REGS.minAlloggio) issues.push({sev:"err",cat:"Superficie",code:"Reg.Ed. Art.96",msg:`Sup. utile ${area}m² < ${REGS.minAlloggio}m² minimo alloggio`});
  else issues.push({sev:"ok",cat:"Superficie",code:"Reg.Ed. Art.96",msg:`Sup. utile ${area}m² ≥ ${REGS.minAlloggio}m² ✓`});

  /* Estimate per-room area & flag if undersized */
  const livingArea=Math.max(14,area*0.30);
  const bedroomArea=rooms>1?(area*0.20):0;
  if(rooms>=2&&bedroomArea<REGS.minRoom.cameraDoppia) issues.push({sev:"warn",cat:"Camere",code:"Reg.Ed. Art.97",msg:`Verifica camera doppia ≥ ${REGS.minRoom.cameraDoppia}m² (stima ${bedroomArea.toFixed(1)}m²)`});
  if(livingArea<REGS.minRoom.soggiorno) issues.push({sev:"warn",cat:"Soggiorno",code:"DM 5/7/1975",msg:`Soggiorno < ${REGS.minRoom.soggiorno}m² minimo`});

  /* Bathroom — verify ≥ 1 with window OR VMC */
  if(baths<1) issues.push({sev:"err",cat:"Servizi",code:"Reg.Ed. Art.97-98",msg:"Almeno un bagno con dotazione minima (lavabo, doccia/vasca, wc, bidet)"});
  else issues.push({sev:"ok",cat:"Servizi",code:"Reg.Ed. Art.97-98",msg:`${baths} bagno/i — verificare lato min 1.20m e dotazione completa ✓`});

  /* Aeration & Illumination — needs window area data; flag as advisory */
  issues.push({sev:"warn",cat:"Aeroilluminazione",code:"Reg.Ed. Art.103-105",msg:`Verificare apribile ≥ 1/10 superficie locale (${(area*REGS.aerationRatio).toFixed(1)}m² tot.) e illuminante ≥ 1/8 (${(area*REGS.illumRatio).toFixed(1)}m²)`});

  /* Energy — DM Requisiti Minimi */
  const cls=["A4","A3","A2","A1","B","C","D","E","F","G"];
  const post=cls.indexOf(postECls), target=cls.indexOf(REGS.minEnergyClassRenov);
  if(post<0||target<0) issues.push({sev:"warn",cat:"Energetico",code:"DM 26/6/2015",msg:"Verificare classe post-intervento"});
  else if(post>target) issues.push({sev:"err",cat:"Energetico",code:"DM 26/6/2015",msg:`Post-renov classe ${postECls} non raggiunge ${REGS.minEnergyClassRenov} (ristrutturazione importante 1° liv.)`});
  else issues.push({sev:"ok",cat:"Energetico",code:"DM 26/6/2015",msg:`Classe ${postECls} ≥ ${REGS.minEnergyClassRenov} target ✓`});

  /* Accessibility — DM 236/1989 visitabilità sempre richiesta */
  issues.push({sev:"warn",cat:"Accessibilità",code:"DM 236/1989",msg:`Visitabilità: porta ingresso luce netta ≥ ${REGS.doorWidthEntrance*100}cm, almeno 1 bagno raggiungibile, soggiorno fruibile`});

  /* Acoustic — DPCM 5/12/1997 */
  issues.push({sev:"warn",cat:"Acustico",code:"DPCM 5/12/1997",msg:`Cat.A residenziale: facciata D2m,nT ≥ ${REGS.acoustic.facciataD2mnT}dB, R'w pareti ≥ ${REGS.acoustic.partizioneR}dB, calpestio L'nw ≤ ${REGS.acoustic.calpestioL}dB`});

  /* Riscontro d'aria — Reg.Ed. Art.100 */
  if(area>=60) issues.push({sev:"warn",cat:"Riscontro d'aria",code:"Reg.Ed. Art.100",msg:`Sup. ${area}m² ≥ 60m²: richiesto doppio affaccio o VMC`});
  else issues.push({sev:"ok",cat:"Riscontro d'aria",code:"Reg.Ed. Art.100",msg:`< 60m²: monoaffaccio ammesso (purché non orientato Nord ±30°) ✓`});

  return issues;
}

/* ══════ V7 UNIFIED AGENT GATE (Unified Master Prompt v7) ══════
   Envelope-invariance hard constraints + rule-ID compliance matrix.
   Per v7 §1.1 hard-constraint principle, §0.2 rule IDs, §1.7 permitted
   statuses: the app NEVER claims "compliant/approved/certified". */
const V7_INVARIANTS=[
  {id:"BLG-ENV-01",el:"Muri perimetrali · External walls",rule:"D.P.R. 380/2001 art.3 — manutenzione straordinaria: involucro invariato, nessun muro esterno spostato di 1 mm"},
  {id:"BLG-ENV-02",el:"Porta d'ingresso · Main entrance",rule:"Posizione, larghezza, verso di apertura CONGELATI · luce netta ≥ 80 cm preservata (D.M. 236/1989)"},
  {id:"BLG-ENV-03",el:"Sagoma · Overall shape",rule:"RET-DTU-18 (D.G.R. XI/695/2018) — involucro 3D invariato: SCOP, VT, footprint e forma dell'appartamento identici"},
  {id:"BLG-ENV-04",el:"Finestre · Windows",rule:"Numero, posizione, dimensione invariati — nessuna modifica di facciata (D.Lgs. 42/2004 dove vincolato)"},
  {id:"STR-ENV-05",el:"Struttura portante · Load-bearing",rule:"NTC 2018 + L.R. 33/2015 — muri portanti, pilastri, travi, solai INTOCCATI; qualsiasi apertura = progetto strutturale + deposito sismico"},
  {id:"MEP-ENV-06",el:"Colonne montanti · Risers/stacks",rule:"Scarichi, montanti e cavedi invariati — D.M. 37/2008; locali umidi solo su colonne esistenti"},
];
function runComplianceV7(d,s,area){
  const issues=runCompliance(d,s,area);
  const RULE_ID={Altezza:"HYG-01",Superficie:"HYG-02",Camere:"HYG-03",Soggiorno:"HYG-04",Servizi:"HYG-05","Aeroilluminazione":"HYG-06",Energetico:"ENE-01","Accessibilità":"ACC-DM-01",Acustico:"ACO-01","Riscontro d'aria":"HYG-07"};
  const matrix=issues.map(it=>({...it,ruleId:RULE_ID[it.cat]||"BLG-00",status:it.sev==="ok"?"PASS":it.sev==="warn"?"UNVERIFIED":"FAIL",
    evidence:it.sev==="ok"?"Dato fornito dall'utente / dimensione di piano (v7 §0.3)":it.sev==="warn"?"Evidenza mancante — PASS vietato senza fonte (v7 §1.6): richiesta verifica professionale":"Valore misurato sotto il minimo di legge — no rounding up (v7 §1.4)"}));
  const fails=matrix.filter(m=>m.status==="FAIL").length;
  const unver=matrix.filter(m=>m.status==="UNVERIFIED").length;
  const status=fails>0?"CONDITIONALLY FEASIBLE — CORRECTIONS REQUIRED":unver>0?"CONCEPT FEASIBLE — VERIFICATIONS OUTSTANDING":"FEASIBLE SUBJECT TO PROFESSIONAL VALIDATION";
  return {matrix,invariants:V7_INVARIANTS,fails,unver,status};
}

function calcCosts(a,ch,st,bd,rm){

  o.ventilation=ch.includes("Ventilation system")?CR.vent:0;
  o.fire_safety=ch.includes("Fire safety")?CR.fire:0;
  o.solar=ch.includes("Renewable sources")?CR.solar+CR.pv:0;
  o.led=ch.includes("Other energy interventions")?a*CR.led:0;
  o.laundry=ch.includes("Laundry room")?CR.laundry:0;
  o.walkin=ch.includes("Walk-in closet")?CR.walkin:0;
  o.door_reloc=ch.includes("Doorway relocation")?CR.door_reloc:0;
  o.partitions=ch.includes("Partition walls addition")?a*.3*CR.partition:0;
  o.structural=ch.includes("Structural reinforcement")?a*CR.struct:0;
  if(ch.includes("Complete energy upgrade")){o.heating=CR.hv;o.cooling=CR.cool;o.insulation_int=a*.55*CR.ins_wall;o.windows=Math.max(2,Math.round(a/13))*CR.wi;o.smart=CR.sm;o.solar=CR.solar+CR.pv;o.ventilation=CR.vent;o.led=a*CR.led;}
  const sm=1+(["Classic Modern","Mediterranean"].includes(st)?.03:0)+(["Biophilic","Japandi"].includes(st)?.02:0);
  const sub=Object.values(o).reduce((x,y)=>x+y,0)*cc*sm;
  /* Professional fees: minimum €5000 */
  o.professional_fees=Math.max(5000,Math.round(sub*(CR.de+CR.pe+CR.co)));
  o.total=Math.round(sub)+o.professional_fees;
  Object.keys(o).forEach(k=>{if(k!=="total"&&k!=="professional_fees")o[k]=Math.round(o[k])});
  return o;
}

function calcEnergy(cls,ch,a){
  /* Reductions calibrated on ENEA "riqualificazione importante" data 2020-2024.
     Combined multiplicatively (not summed) on the residual demand. */
  const b=ENERGY_MID[cls]||230;
  let residual = 1.0;
  if(ch.includes("Opaque envelope"))      residual *= 0.74;   // cappotto -26%
  if(ch.includes("Transparent envelope")) residual *= 0.90;   // serramenti -10%
  if(ch.includes("Ventilation system"))   residual *= 0.93;   // VMC double-flow -7%
  if(ch.includes("Heating system"))       residual *= 0.78;   // condensing boiler or PdC -22%
  if(ch.includes("Renewable sources"))    residual *= 0.85;   // solar+PV self-cons -15%
  if(ch.includes("Cooling system"))       residual *= 0.96;   // -4% on EPgl
  if(ch.includes("Smart controls"))       residual *= 0.96;   // -4% via zoning/regulation
  if(ch.includes("Other energy interventions")) residual *= 0.98;
  if(ch.includes("Complete energy upgrade")) residual = 0.42; // 58% total (NZEB-ready)
  if(ch.includes("Electrical upgrade"))   residual *= 0.99;
  if(ch.includes("Finishes refresh"))     residual *= 0.99;
  /* Realistic floor: cannot go below 0.30 (70% reduction) without NZEB intervention */
  residual = Math.max(0.30, residual);
  const af = b * residual;
  const sp = Math.round((1 - residual)*1000)/10;
  return{bC:cls,bS:b,aC:eCl(af),aS:Math.round(af*10)/10,sp};
}
function calcSave(a,eB,eA){
  const epDelta = Math.max(0,(ENERGY_MID[eB]||230)-(ENERGY_MID[eA]||230)); // kWh/m²·yr PRIMARY
  const deliveredPerSqm = epDelta / 1.6;          // primary→delivered
  const blendedPrice = 0.155;                      // €/kWh delivered (70% gas + 30% ele blend)
  const rawYear = deliveredPerSqm * a * blendedPrice;
  const capped = Math.min(rawYear, a * 40);        // realistic ceiling ~€40/m²·yr for deep retrofit
  return {yr:Math.round(capped), mo:Math.round(capped/12)};
}
function calcSched(a,ch){const lt=ch.every(c=>INTERVENTIONS[c]?.pm==="free");const hv=ch.includes("Internal layout optimization")||ch.includes("Home office / flex room");let cw=lt?Math.max(4,Math.ceil(1+a/35)):hv?Math.max(7,Math.ceil(1+a/18)):Math.max(6,Math.ceil(1+a/24));const heavyItems=["Bathroom upgrade","Kitchen upgrade","Transparent envelope","Heating system","Opaque envelope","Cooling system","Bathroom addition","Structural reinforcement","Complete energy upgrade"];heavyItems.forEach(c=>{if(ch.includes(c))cw++});const t=[{n:"Survey",w:1,s:0},{n:"Concept",w:1,s:1},{n:"Design",w:2,s:2}];let w=4;if(!lt){t.push({n:"CILA/Permits",w:2,s:w});w+=2;}t.push({n:"Procurement",w:2,s:w});w+=2;t.push({n:"Construction",w:cw,s:w});w+=cw;t.push({n:"Handover",w:1,s:w});w+=1;return{t,tw:w};}

/* ══════════════════════════════════════════════════════════════
   LOMBARDY CENED+2 ENERGY ENGINE (DDUO 2456/2017 + DM 26/6/2015)
   Pre/post-renovation EPgl,nren, class, consumption by vector,
   annual cost, CO2, and 30-year NPV with tax deductions
   ══════════════════════════════════════════════════════════════ */

/* Degree-days by Lombardy city (DPR 412/93) */
const LOMBARDY_GG = {
  milano:2404, milan:2404, bergamo:2533, brescia:2410, como:2587,
  cremona:2389, lecco:2598, lodi:2448, mantova:2388, monza:2404,
  "monza e brianza":2404, pavia:2623, sondrio:3084, varese:2652
};

/* Typical EPgl,nren by build era (Lombardy zone E, residential) */
const EPnren_BY_ERA = {
  "<1976":   {min:250, max:450, def:330, cls:"G"},
  "1976-1991":{min:180, max:280, def:225, cls:"F"},
  "1991-2005":{min:130, max:200, def:165, cls:"E"},
  "2005-2015":{min:90,  max:150, def:115, cls:"D"},
  ">2015":   {min:30,  max:60,  def:50,  cls:"A1"}
};
const ERA_FROM_YEAR = (y) => !y ? "1976-1991" : y<1976?"<1976" : y<1991?"1976-1991" : y<2005?"1991-2005" : y<2015?"2005-2015" : ">2015";

/* Primary energy non-renewable conversion factors (DM 26/6/2015 Tab.1) */
const F_PNREN = {gas:1.05, gpl:1.05, gasolio:1.07, pellet:0.20, elettricita:1.95, teleriscaldamento:1.50};

/* CO2 emission factors kgCO2/kWh */
const F_CO2 = {gas:0.202, gpl:0.227, gasolio:0.267, pellet:0.025, elettricita:0.257, teleriscaldamento:0.200};

/* ARERA Q2 2026 default tariffs */
const TARIFFS = {ele:0.3018, gas:1.2105, pellet:0.40, gasolio:1.55, fixed_ele:45, fixed_gas:70};

/* PCI (lower heating value) */
const PCI_GAS = 9.45; // kWh/Smc
const PCI_PELLET = 4.8; // kWh/kg

/* Determine class from EPgl,nren / EPgl,nren,rif ratio (DDUO 2456/2017 Tab.4) */
function classFromRatio(r){
  if(r<=0.40) return "A4";
  if(r<=0.60) return "A3";
  if(r<=0.80) return "A2";
  if(r<=1.00) return "A1";
  if(r<=1.20) return "B";
  if(r<=1.50) return "C";
  if(r<=2.00) return "D";
  if(r<=2.60) return "E";
  if(r<=3.50) return "F";
  return "G";
}

/* Reference EP for the standard building (zone E Lombardy) */
function EPnren_rif(GG, S_su_V){
  return (45 + 25*S_su_V) * (GG/2100) + 14; // kWh/m²·anno
}

/* Estimate pre-renovation EPgl,nren from user inputs or APE */
function estimateEPnrenPre(d){
  if(d.eCls && d.eCls !== "Unknown" && d.annualEnergy){
    const a = parseFloat(d.area)||85;
    return parseFloat(d.annualEnergy)/a;
  }
  const era = d.buildingEra || ERA_FROM_YEAR(parseInt(d.listingExtracted?.buildingYear));
  return EPnren_BY_ERA[era]?.def || 220;
}

/* Apply interventions multiplicatively to the heating-load fraction */
function applyInterventions(EP_pre, interventions){
  let EP = EP_pre;
  /* Envelope-related reductions on heating demand (about 60% of EP) */
  const heatingShare = 0.60;
  const acsShare = 0.20;
  const coolingShare = 0.10;
  let H = EP*heatingShare, W = EP*acsShare, C = EP*coolingShare;
  const baseElec = EP*0.10;

  if(interventions.includes("Opaque envelope")){ H*=0.62; C*=0.85; }    // cappotto 35% / 15%
  if(interventions.includes("Transparent envelope")){ H*=0.90; C*=0.93; } // serramenti 10% / 7%
  if(interventions.includes("Ventilation system")){ H*=0.90; }              // VMC 10%
  /* Plant changes */
  if(interventions.includes("Heating system")){ H *= 0.78; }                // caldaia condens. 22%
  if(interventions.includes("Complete energy upgrade")){ H*=0.45; C*=0.70; W*=0.55; }
  if(interventions.includes("Cooling system")){ C*=0.80; }
  if(interventions.includes("Renewable sources")){ W*=0.40; } // 60% ACS from solar/PV
  if(interventions.includes("Smart controls")){ H*=0.95; C*=0.95; }
  if(interventions.includes("Other energy interventions")){ H*=0.98; C*=0.98; }
  return Math.max(15, H + W + C + baseElec);
}

/* Decompose EP into gas + electricity consumption */
function decomposeConsumption(EP, area, heatingVector, hasHeatPump){
  const total_kWh = EP * area;
  const heating_kWh = total_kWh * 0.60;
  const acs_kWh = total_kWh * 0.20;
  const cooling_kWh = total_kWh * 0.10;
  const base_elec = total_kWh * 0.10;

  if(hasHeatPump){
    /* All H+W on electricity via SCOP=3.8 */
    const elec_total = (heating_kWh+acs_kWh)/3.8 + cooling_kWh/3.5 + base_elec + 2700;
    return {gas_Smc:0, elec_kWh:Math.round(elec_total), pellet_kg:0};
  }
  if(heatingVector==="pellet"){
    const pellet_kWh = heating_kWh + acs_kWh;
    return {gas_Smc:0, elec_kWh:Math.round(cooling_kWh/3.5 + base_elec + 2700), pellet_kg:Math.round(pellet_kWh/(0.85*PCI_PELLET))};
  }
  /* Default: gas heating + electric cooling + base */
  const eta_H = 0.85;
  const gas_kWh = (heating_kWh + acs_kWh) / eta_H;
  const elec_kWh = cooling_kWh/3.5 + base_elec + 2700;
  return {gas_Smc:Math.round(gas_kWh/PCI_GAS), elec_kWh:Math.round(elec_kWh), pellet_kg:0};
}

/* Cost from consumption */
function annualCost(c){
  return Math.round(c.gas_Smc * TARIFFS.gas + c.elec_kWh * TARIFFS.ele + c.pellet_kg * TARIFFS.pellet + (c.gas_Smc>0?TARIFFS.fixed_gas:0) + TARIFFS.fixed_ele);
}

/* CO2 from consumption */
function annualCO2(c){
  const gas_kWh = c.gas_Smc * PCI_GAS;
  return Math.round(gas_kWh * F_CO2.gas + c.elec_kWh * F_CO2.elettricita + (c.pellet_kg * PCI_PELLET * F_CO2.pellet));
}

/* PV annual production (Lombardy ~1100 kWh/kWp) with autoconsumo factor */
function pvProduction(kWp, hasBattery){
  const factor = hasBattery ? 0.70 : 0.32;
  return Math.round(kWp * 1100 * factor); // kWh self-consumed
}

/* 30-year NPV with discount rate, energy escalation, tax deductions */
function calcEnergyNPV(investment, taxDeductionRate, annualSaving, years=30, discount=0.04, energyEscalation=0.03){
  /* Tax deduction recovered in 10 years (Ecobonus/Bonus Casa) */
  const annualDeduction = investment * taxDeductionRate / 10;
  let npv = -investment;
  const cashflow = [];
  for(let y=1; y<=years; y++){
    const saving = annualSaving * Math.pow(1+energyEscalation, y-1);
    const deduction = y<=10 ? annualDeduction : 0;
    const yearCF = saving + deduction;
    npv += yearCF / Math.pow(1+discount, y);
    cashflow.push({year:y, saving:Math.round(saving), deduction:Math.round(deduction), cumNPV:Math.round(npv)});
  }
  return {npv:Math.round(npv), cashflow, paybackYears: investment>0&&annualSaving>0 ? +(investment*(1-taxDeductionRate)/annualSaving).toFixed(1) : null};
}

/* Master function — runs the full pre/post + NPV pipeline */
function runFullEnergyCalc(d, sol){
  const area = parseFloat(d.area)||85;
  const cityKey = (d.city||"").toLowerCase().trim();
  const GG = LOMBARDY_GG[cityKey] || 2404;
  const S_su_V = 0.65;
  const EPrif = EPnren_rif(GG, S_su_V);
  const EP_pre = estimateEPnrenPre(d);
  const EP_post = applyInterventions(EP_pre, sol.ch);
  const heatingVector = d.heatingType==="Pompa di calore" ? "elettricita" : d.heatingType==="Centralizzato"?"teleriscaldamento":"gas";
  const hasPdC_pre = d.heatingType==="Pompa di calore";
  const hasPdC_post = sol.ch.includes("Heating system") || sol.ch.includes("Complete energy upgrade");
  const cons_pre = decomposeConsumption(EP_pre, area, heatingVector, hasPdC_pre);
  let cons_post = decomposeConsumption(EP_post, area, heatingVector, hasPdC_post);

  /* PV self-consumption subtracts from electricity */
  if(sol.ch.includes("Renewable sources") || sol.ch.includes("Complete energy upgrade")){
    const kWp = 3, hasBattery = sol.ch.includes("Complete energy upgrade");
    const pv = pvProduction(kWp, hasBattery);
    cons_post.elec_kWh = Math.max(0, cons_post.elec_kWh - pv);
  }

  const cost_pre = annualCost(cons_pre);
  const cost_post = annualCost(cons_post);
  const co2_pre = annualCO2(cons_pre);
  const co2_post = annualCO2(cons_post);
  const cls_pre = classFromRatio(EP_pre/EPrif);
  const cls_post = classFromRatio(EP_post/EPrif);
  const saving_year = cost_pre - cost_post;

  /* Investment subset for energy-only interventions */
  const energyInterv = ["Opaque envelope","Transparent envelope","Heating system","Cooling system","Renewable sources","Ventilation system","Complete energy upgrade","Smart controls","Other energy interventions"];
  const investmentEnergy = Math.round(
    (sol.co.heating||0) + (sol.co.cooling||0) + (sol.co.windows||0) +
    (sol.co.insulation_int||0) + (sol.co.solar||0) + (sol.co.ventilation||0) +
    (sol.co.smart||0) + (sol.co.led||0)
  );
  const taxRate = 0.50; // Ecobonus primary residence 2026

  const npvResult = calcEnergyNPV(investmentEnergy, taxRate, saving_year, 30, 0.04, 0.03);

  const rapportoPre = EP_pre/EPrif;
  const rapportoPost = EP_post/EPrif;

  return {
    GG, EPrif: Math.round(EPrif*10)/10,
    ante: {
      EPnren: Math.round(EP_pre*10)/10,
      classe: cls_pre,
      rapporto: Math.round(rapportoPre*100)/100,
      cons: cons_pre,
      cost: cost_pre,
      co2: co2_pre
    },
    post: {
      EPnren: Math.round(EP_post*10)/10,
      classe: cls_post,
      rapporto: Math.round(rapportoPost*100)/100,
      cons: cons_post,
      cost: cost_post,
      co2: co2_post
    },
    delta: {
      saving_year,
      saving_pct: Math.round((1 - EP_post/EP_pre)*1000)/10,
      co2_kg_saved: co2_pre - co2_post,
      class_jumps: Math.max(0, (ENERGY_RANK[cls_post]||0) - (ENERGY_RANK[cls_pre]||0))
    },
    economy: {
      investment_gross: investmentEnergy,
      tax_deduction: Math.round(investmentEnergy*taxRate),
      investment_net: Math.round(investmentEnergy*(1-taxRate)),
      payback_years: npvResult.paybackYears,
      npv_30y: npvResult.npv,
      cashflow: npvResult.cashflow
    }
  };
}

function calcVal(a,ci,bd,ch,eB,eA,currentStatus){
  const cityKey=(ci||"").toLowerCase().trim();
  let ref=CITY_PRICES[cityKey]||LOMBARDY_AVG;
  /* Status-based discount on current value */
  const statusDiscount={"Da ristrutturare":.82,"Buono / Abitabile":.92,"Ristrutturato":.98,"Nuovo / In costruzione":1.02,"Ottimo":1.0};
  const disc=statusDiscount[currentStatus]||.88;
  const pB=ref*disc;
  /* Renovation uplift */
  let rP=0;
  if(ch.includes("Finishes refresh"))rP+=.04;if(ch.includes("Kitchen upgrade"))rP+=.03;if(ch.includes("Bathroom upgrade"))rP+=.03;
  if(ch.includes("Internal layout optimization")||ch.includes("Home office / flex room"))rP+=.04;if(ch.includes("Storage boost"))rP+=.02;
  if(ch.includes("Bathroom addition"))rP+=.02;if(ch.includes("Walk-in closet"))rP+=.01;if(ch.includes("Ceiling renovation"))rP+=.01;
  const cG=Math.max(0,(ENERGY_RANK[eA]||0)-(ENERGY_RANK[eB]||0));
  const up=Math.min(.18,rP+Math.min(.09,cG*.015));
  const pA=pB*(1+up);
  /* Tax benefit calculation (2026 rates) */
  const taxableItems=ch.filter(c=>INTERVENTIONS[c]?.tax50);
  const taxBenefitRate=.36; /* 2026: 36% primary, 30% secondary — use 36% as default */
  const taxBenefitMax=96000;
  const totalTaxable=Math.min(taxBenefitMax,Math.round(Object.entries(calcCosts(a,ch,"Contemporary",bd,3)).filter(([k])=>!["total","professional_fees"].includes(k)).reduce((s,[_,v])=>s+v,0)));
  const taxBenefit=Math.round(totalTaxable*taxBenefitRate);
  return{pB:Math.round(pB),pA:Math.round(pA),vB:Math.round(pB*a),vA:Math.round(pA*a),up:Math.round(up*1e3)/10,taxBenefit,taxBenefitAnnual:Math.round(taxBenefit/10)};
}

const fmt=n=>n==null?"—":"€"+n.toLocaleString("it-IT");
const fmtK=n=>n>=1e3?"€"+(n/1e3).toFixed(0)+"k":"€"+n;

/* 3-SOLUTION GENERATOR */
const T_E=["Finishes refresh","Storage boost","Ceiling renovation","Wall treatments","Other energy interventions"];
const T_C=["Kitchen upgrade","Bathroom upgrade","Electrical upgrade","Plumbing upgrade","Smart controls"];
const T_P=["Internal layout optimization","Heating system","Transparent envelope","Opaque envelope","Cooling system","Renewable sources","Complete energy upgrade","Home office / flex room","Ventilation system","Bathroom addition"];

function genSols(d){
  const a=parseFloat(d.area)||85,rm=parseInt(d.rooms)||3,ec=d.eCls==="Unknown"?"E":d.eCls,all=d.changes;
  const ess=[...all.filter(c=>T_E.includes(c)),...all.filter(c=>T_C.includes(c)).slice(0,2)];
  const bal=[...all];
  const pre=[...all,...T_P.filter(c=>!all.includes(c)).slice(0,3)];
  const mk=(nm,ch,qm,mg)=>{
    const ch2=ch.length?ch:["Finishes refresh"];
    const co=calcCosts(a,ch2,d.style,d.band,rm),adj={...co};
    Object.keys(adj).forEach(k=>{if(k!=="total"&&k!=="professional_fees")adj[k]=Math.round(adj[k]*qm)});
    adj.total=Object.entries(adj).filter(([k])=>k!=="total").reduce((x,[_,v])=>x+v,0);
    const en=calcEnergy(ec,ch2,a),sv=calcSave(a,en.bC,en.aC),sc=calcSched(a,ch2);
    const solDraft={nm,ch:ch2,co:adj,en,sv,sc,mg,qm};
    const vl=calcLombardyVal(d,solDraft);
    return{...solDraft,vl};
  };
  return[
    mk("Essential",ess,.85,"Standard-grade: laminate, painted MDF, basic ceramic, standard fixtures"),
    mk("Balanced",bal,1,"Mid-range "+d.style+": "+(STYLES[d.style]?.mat||"quality finishes")),
    mk("Premium",pre,1.25,"Premium "+d.style+": high-end "+(STYLES[d.style]?.mat||"luxury finishes")+", top fixtures, custom joinery")
  ];
}

function renderPrompt(d,sol,room){

  const dims=(type)=>{
    const r=roomData[type];

    const w=exR?.estimatedDimensions?.widthM||parseFloat(r?.width)||null;
    const l=exR?.estimatedDimensions?.lengthM||parseFloat(r?.length)||null;

    if(w&&l)return` SURVEYED ROOM DIMENSIONS (authoritative): ${l.toFixed(1)}m long × ${w.toFixed(1)}m wide × ${ch.toFixed(1)}m ceiling. These are real measured dimensions — the render must match them exactly. Room area = ${(w*l).toFixed(1)}m².`;
    return` Apartment total: ${parseFloat(d.area)||85}m². Use realistic Italian apartment proportions for a ${room} room.`;
  };

  /* Window constraints from extracted data */
  const winStr=(type)=>{
    const exR=roomData[type]?.extractedData;
    if(!exR?.windows?.length)return"Windows: maintain existing positions exactly as in original photos/plan.";
    return"WINDOWS — extracted from your photos (positions are LOCKED):\n"+exR.windows.map((w,i)=>`  Window ${i+1}: ${w.wall} wall · ${w.positionOnWall} · ~${w.approximateWidthM||1.2}m wide × ${w.approximateHeightM||1.4}m tall · sill ${w.sillHeightM||0.9}m from floor`).join("\n")+"\nNo new windows. No removed windows. No resized openings.";
  };

  /* Door constraints — entrance is LOCKED; internal doors MAY be reconfigured */
  const doorStr=(type)=>{
    const exR=roomData[type]?.extractedData;
    if(!exR?.doors?.length)return"Doors: the main entrance stays fixed; internal doors may be added/moved/widened (clear ≥ 75 cm).";

const STYLE_TO_PROVIDERS = {
  Japandi:           {prefer:["IKEA_IT","MAISONS_DU_MONDE","WESTWING","SCAVOLINI"]},

  "Classic Modern":  {prefer:["NATUZZI","MAISONS_DU_MONDE","COIN_CASA","SCAVOLINI"]},

};

/* Generate BOM (bill of materials) for a solution tier */
function generateBOM(sol, d){
  const tier = sol.nm; // Essential / Balanced / Premium
  const style = d.style || "Japandi";
  const preferredProviders = STYLE_TO_PROVIDERS[style]?.prefer || [];
  const area = parseFloat(d.area) || 85;
  const rooms = parseInt(d.rooms) || 3;

  /* Pick one item per category per room */
  const selectedByRoom = {};
  Object.entries(PROCUREMENT_CATALOG).forEach(([roomKey, items])=>{
    selectedByRoom[roomKey] = [];
    /* Group by category */
    const byCat = {};
    items.forEach(it=>{
      if(!byCat[it.cat]) byCat[it.cat] = [];
      byCat[it.cat].push(it);
    });
    /* For each category, pick best matching tier + provider preference */
    Object.entries(byCat).forEach(([cat, options])=>{
      /* Filter to those matching tier */
      let candidates = options.filter(o => o.tier===tier);
      if(candidates.length===0){
        /* Fallback: pick closest tier */
        const tierOrder = ["Essential","Balanced","Premium"];
        const targetIdx = tierOrder.indexOf(tier);
        for(let delta=1; delta<3 && candidates.length===0; delta++){
          candidates = options.filter(o=>tierOrder.indexOf(o.tier)===targetIdx-delta) ;
          if(candidates.length===0) candidates = options.filter(o=>tierOrder.indexOf(o.tier)===targetIdx+delta);
        }
      }
      if(candidates.length===0) return;
      /* Sort by provider preference */
      candidates.sort((a,b)=>{
        const aPref = preferredProviders.indexOf(a.provider);
        const bPref = preferredProviders.indexOf(b.provider);
        if(aPref===-1 && bPref===-1) return PROVIDERS[a.provider].priority - PROVIDERS[b.provider].priority;
        if(aPref===-1) return 1;
        if(bPref===-1) return -1;
        return aPref - bPref;
      });
      const pick = candidates[0];
      /* Quantity heuristics */
      let qty = 1;
      if(cat==="bedside" || cat==="dining_chairs") qty = 1; // already pack of 4 or pair
      if(cat==="bedroom_single" && rooms>=4) qty = rooms-2;
      selectedByRoom[roomKey].push({...pick, qty});
    });
  });

  /* Compute totals */
  let grandTotal = 0;
  const providerTotals = {};
  const byRoomTotals = {};
  Object.entries(selectedByRoom).forEach(([roomKey, items])=>{
    let roomTotal = 0;
    items.forEach(it=>{
      const lineTotal = it.price * it.qty;
      const delivery = Math.round(lineTotal * 0.04);
      const install = it.cat==="kitchen_system"||it.cat==="vanity"||it.cat==="wardrobe"||it.cat==="hob"||it.cat==="oven"||it.cat==="washer" ? Math.round(lineTotal*0.12) : 0;
      it.lineTotal = lineTotal;
      it.delivery = delivery;
      it.install = install;
      it.totalAllIn = lineTotal + delivery + install;
      roomTotal += it.totalAllIn;
      grandTotal += it.totalAllIn;
      if(!providerTotals[it.provider]) providerTotals[it.provider] = {count:0, total:0, categories:new Set()};
      providerTotals[it.provider].count += it.qty;
      providerTotals[it.provider].total += it.totalAllIn;
      providerTotals[it.provider].categories.add(it.cat);
    });
    byRoomTotals[roomKey] = roomTotal;
  });

  return { selectedByRoom, providerTotals, byRoomTotals, grandTotal, tier, style };
}

/* Calculate Feng Shui score (0-100) based on selected principles and interventions */
function calcFengShuiScore(fengshui, changes, roomDetails) {
  if (!fengshui || fengshui.length === 0) return {score:50,label:"Neutral",detail:"No feng shui preferences selected"};
  let score = 30; /* Base score */
  const details = [];
  /* Points per selected principle */
  score += fengshui.length * 8;
  if (fengshui.includes("Command position (bed/desk facing door)")) { details.push("Command position +10"); score += 10; }
  if (fengshui.includes("Five elements balance (wood, fire, earth, metal, water)")) { details.push("Five elements +8"); score += 8; }
  if (fengshui.includes("Natural light maximization & mirror placement")) { details.push("Light optimization +7"); score += 7; }
  if (fengshui.includes("Clutter-free flow & rounded furniture edges")) { details.push("Flow optimization +8"); score += 8; }
  if (fengshui.includes("Living plants in east/southeast sectors")) { details.push("Plant energy +5"); score += 5; }
  /* Bonus for complementary interventions */
  if (changes.includes("Internal layout optimization")) { details.push("Layout optimization aligns with chi flow +5"); score += 5; }
  if (changes.includes("Smart controls")) { details.push("Smart controls support element balance +3"); score += 3; }
  if (changes.includes("Finishes refresh")) { details.push("Fresh finishes clear stagnant energy +4"); score += 4; }
  /* Room proportions bonus */
  const rd = roomDetails || {};
  if (rd.living?.length && rd.living?.width) {
    const ratio = Math.max(parseFloat(rd.living.length),parseFloat(rd.living.width)) / Math.min(parseFloat(rd.living.length),parseFloat(rd.living.width));
    if (ratio < 1.8) { details.push("Living room proportions favorable (ratio "+ratio.toFixed(1)+") +5"); score += 5; }
  }
  score = Math.min(100, Math.max(0, score));
  const label = score >= 85 ? "Excellent" : score >= 70 ? "Good" : score >= 50 ? "Moderate" : "Needs attention";
  return {score, label, details};
}

/* Convert File → base64 data URL */
async function fileToBase64(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
}

/* Shared Gemini vision call — returns parsed JSON or null */
async function geminiVision(file, textPrompt, apiKey){
  try{
    const b64=await fileToBase64(file);
    const base=b64.split(",")[1];
    const mime=file.type||"image/jpeg";
    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${AI_MODELS.vision}:generateContent?key=${apiKey}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts:[
         {inlineData:{mimeType:mime,data:base}},
         {text:textPrompt}
       ]}],generationConfig:visionCfg(2048)})
      }
    );
    if(!res.ok) throw new Error("Gemini "+res.status);
    const data=await res.json();
    const txt=data.candidates?.[0]?.content?.parts?.[0]?.text||"{}";
    return JSON.parse(txt.replace(/```json|```/g,"").trim());
  }catch(e){console.warn("Gemini vision failed:",e);return null;}
}

/* Generate IKEA furniture list for a solution tier */
function getIkeaList(sol, d) {
  /* Backwards-compat shim: returns flat BOM list */
  if(!d) return [];
  const bom = generateBOM(sol, d);
  const list = [];
  Object.entries(bom.selectedByRoom).forEach(([room, items])=>{
    items.forEach(it=>{
      list.push({
        name: it.name,
        url: mkSearchUrl(it.provider, it.q),
        price: it.lineTotal,
        room: room,
        provider: PROVIDERS[it.provider].name
      });
    });
  });
  return list;
}

const PASS_SCORE = 80;
const MAX_ROUNDS = 3;

/* Nano Banana 2 = Google "Nano Banana Pro" / Gemini 3 Pro Image.
   Single source of truth for the image-generation/editing model. */
const NANO_BANANA_MODEL = "gemini-3-pro-image-preview";

const RETRY_ADDENDUM = [
  "",
  " SPATIAL VIOLATION DETECTED IN PREVIOUS ATTEMPT. MANDATORY CORRECTIONS: (1) Count the windows in the original description and show EXACTLY that many in EXACT positions. (2) Keep every balcony / French door (porta-finestra) exactly as in the original — same count, wall and size; never convert one to a window or wall. (3) Room dimensions must match EXACTLY — no stretching or compressing. (4) Bathroom position FROZEN — do not move it. (5) Entrance door FROZEN — same wall, same position. (6) Total area and overall footprint must equal original. Only internal partitions/doors may differ. Regenerate with these corrections strictly applied.",
  " FINAL ATTEMPT — STRICT SPATIAL COMPLIANCE REQUIRED. The previous renders failed validation. You MUST reproduce the EXACT room shell from the original description: same external walls, same window count and positions, same balcony/French doors (porte-finestra), same overall footprint and area, same room proportions, same ceiling height, same bathroom location, same entrance door. The ONLY differences from the original should be: internal (non-load-bearing) partitions and internal doors, surface finishes, furniture (IKEA), and the specific client requirements listed. Any change to an exterior opening, perimeter wall or footprint = immediate rejection."
];

/* ══════════════════════════════════════════════════════════════

/* Generate via image-to-image edit if original photo available,
   otherwise fall back to text-to-image with constraints */
async function generateWithImagen(prompt, apiKey, originalPhotoFile){
  /* ── Image-to-image: pass original photo as reference ── */
  if(originalPhotoFile){
    try{
      const b64 = await fileToBase64(originalPhotoFile);
      const base = b64.split(",")[1];
      const mime = originalPhotoFile.type||"image/jpeg";
      const editPrompt = `${STRICT_BOUNDARY_PROTOCOL}

You are looking at an original room photo / plan. Generate a photorealistic renovation of THIS EXACT SPACE — the original image is the sole source of truth for geometry.

WHAT YOU MUST KEEP IDENTICAL (copy exactly from the photo):
- Every EXTERNAL / perimeter wall, its position, thickness, and angle
- Every window: exact count, exact position on wall, exact size
- Every balcony / French door (porta-finestra) to a balcony, loggia or terrace: exact count, position and size — do NOT convert it to a window or wall
- The main entrance door: exact position and width
- Ceiling height: exactly as in the photo
- Overall room shape, proportions and floor area: exactly as in the photo
- Bathroom: if visible, exact same position and size

WHAT YOU MAY CHANGE (the renovation) — INTERNAL only:
- Internal (non-load-bearing) partition walls and internal doors may be added, removed or moved
- Finishes, furniture and fittings
${prompt}

The result must look like a photograph of the SAME ROOM after renovation — not a different room. A viewer who knows the original should immediately recognise the same spatial layout.`;

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${AI_MODELS.image}:generateContent?key=${apiKey}`,
        {method:"POST", headers:{"Content-Type":"application/json"},
         body:JSON.stringify({
           contents:[{parts:[
             {inlineData:{mimeType:mime, data:base}},
             {text:editPrompt.slice(0,9000)}
           ]}],
           generationConfig:{responseModalities:["IMAGE"]}
         })
        }
      );
      if(res.ok){
        const data=await res.json();
        const part=data.candidates?.[0]?.content?.parts?.find(p=>p.inlineData);
        if(part?.inlineData){
          const m=part.inlineData.mimeType||"image/png";
          return {dataUrl:`data:${m};base64,${part.inlineData.data}`, base64:part.inlineData.data, mime:m, mode:"image-edit"};
        }
      }
    }catch(e){console.warn("Image-to-image failed, falling back:",e);}
  }

  /* ── Fallback: text-to-image with full constraints ── */
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${AI_MODELS.image}:generateContent?key=${apiKey}`,
    {method:"POST", headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       contents:[{parts:[{text: prompt.slice(0,9000)}]}],
       generationConfig:{responseModalities:["IMAGE"]}
     })
    }
  );
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error?.message||"Nano Banana error "+res.status); }
  const data = await res.json();
  const part = data.candidates?.[0]?.content?.parts?.find(p=>p.inlineData);
  if(!part?.inlineData) throw new Error("No image returned from Nano Banana 2");
  const mime = part.inlineData.mimeType||"image/png";
  return {dataUrl:`data:${mime};base64,${part.inlineData.data}`, base64:part.inlineData.data, mime, mode:"text-to-image"};
}

Return ONLY valid JSON (no markdown):

/* Build a Gemini image part from a File, a data: URL, or an http(s) URL */
async function imgPartFromAny(src){
  if(src instanceof File){
    const b64=await fileToBase64(src);
    return {inlineData:{mimeType:src.type||"image/jpeg", data:b64.split(",")[1]}};
  }
  if(typeof src==="string" && src.startsWith("data:")){
    return {inlineData:{mimeType:src.split(";")[0].replace("data:",""), data:src.split(",")[1]}};
  }
  if(typeof src==="string" && src) return {fileData:{mimeType:"image/jpeg", fileUri:src}};
  return null;
}

/* Parse a JSON object out of a Gemini text response */
function parseJsonLoose(txt){
  const clean=(txt||"{}").replace(/```json|```/g,"").trim();
  const m=clean.match(/\{[\s\S]*\}/);
  return JSON.parse(m?m[0]:clean);
}

/* ══════════════════════════════════════════════════════════════
   CROSS-CHECK 1 — POST-INTERVENTION PLAN vs INITIAL PLAN
   Two-image comparison: confirm the generated plan presents the SAME
   space/envelope as the original (only internal partitions/doors differ).
   ══════════════════════════════════════════════════════════════ */
async function comparePlanToOriginal(originalSrc, generatedSrc, spatialData, apiKey){
  if(!apiKey) return null;
  try{
    const a=await imgPartFromAny(originalSrc), b=await imgPartFromAny(generatedSrc);
    if(!a||!b) return null;
    const ctx=spatialData?`Reference data for the ORIGINAL: total area ${spatialData.totalArea||"?"}m², shape "${spatialData.overallShape||"?"}", entrance ${spatialData.entranceDoor?spatialData.entranceDoor.wall+" wall":"as drawn"}.`:"";
    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${AI_MODELS.vision}:generateContent?key=${apiKey}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts:[
         {text:"IMAGE 1 = ORIGINAL floor plan (existing apartment). IMAGE 2 = AI-generated POST-INTERVENTION floor plan of the SAME apartment."},
         a,
         {text:"IMAGE 2 follows:"},
         b,
         {text:`You are a strict Italian/Lombardy building-code reviewer verifying ENVELOPE INVARIANCE (D.P.R. 380/2001 sagoma) between the two plans. ${ctx}
The post-intervention plan is ACCEPTABLE only if it depicts the SAME SPACE as the original: identical external/perimeter walls, identical overall shape & footprint, identical total floor area, identical main entrance (wall/position/width), identical windows (count/position/size) and identical balcony/French doors (porte-finestra).
CRITICAL BOUNDARY RULES:
- The post-intervention plan must stay ENTIRELY WITHIN the original apartment perimeter — nothing may extend beyond it.
- NO new room, space, balcony, terrace, extension or annex may be ADDED that is not in the original apartment. The renovation only REDISTRIBUTES the existing internal area.
- The set of enclosed spaces must be the SAME apartment — internal partitions and internal doors may move, and rooms may be merged or split, but no space outside the original footprint may appear.
Anything else = HARD CONSTRAINT VIOLATION.
Apply these STRICT BOUNDARY PROTOCOL tests (§7):
- Boundary overlay: proposed external boundary overlays the original exactly (P_proposed ⊆ P_original, ΔB≈0).
- Area: proposed net internal area ≤ original net internal area (A_proposed/A_original ≤ 1.00, small partition-thickness tolerance only). Set areaRatioOK=false if the proposal looks larger.
- Traceability: EVERY room/space in the proposal must be obtainable from existing internal area (subdivision/merge/reallocation). Set allSpacesTraceable=false if any space cannot come from the original interior (i.e. it was added).
Return ONLY valid JSON (no markdown):
{"sameSpace":true/false,"outerWallsMatch":true/false,"overallShapeMatch":true/false,"totalAreaMatch":true/false,"withinOriginalBoundary":true/false,"areaRatioOK":true/false,"noSpacesAdded":true/false,"allSpacesTraceable":true/false,"entranceMatch":true/false,"windowsMatch":true/false,"balconyDoorsMatch":true/false,"onlyInternalChanged":true/false,"structuralWallsUntouched":true/false,"overallScore":0-100,"approved":true/false,"mismatches":["list every difference beyond internal partitions/doors, incl. any added room/space or anything outside the original perimeter"],"summary":"one line"}
HARD GATE: if ANY of sameSpace, outerWallsMatch, overallShapeMatch, totalAreaMatch, withinOriginalBoundary, areaRatioOK, noSpacesAdded, allSpacesTraceable, entranceMatch, windowsMatch, balconyDoorsMatch, onlyInternalChanged is false → approved:false and overallScore ≤ 40.`}
       ]}],generationConfig:visionCfg(1400)})

    if(!res.ok) return null;

  }catch(e){ console.warn("Plan-vs-original compare failed:",e); return null; }

HARD GATE: if ANY of consistent, windowsConsistent, balconyDoorsConsistent, proportionsConsistent, openingsConsistent, roomSequenceConsistent, noExtraRoom, noInventedElements, viewpointValid is false → approved:false and overallScore ≤ 45.`}
