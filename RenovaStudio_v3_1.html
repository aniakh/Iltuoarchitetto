/* ══════════════════════════════════════════════════════════════
   FAST IMAGE-TO-IMAGE PIPELINE
   - One render per uploaded photo (parallel)
   - Single round when original photo provided (no retry loop needed)
   - Multi-round only for text-to-image fallback
   ══════════════════════════════════════════════════════════════ */

const _envBad = v => v && [v.outerWallsUnchanged,v.overallShapeUnchanged,v.entranceDoorUnchanged,v.balconyDoorsUnchanged,v.noWallMoves,v.totalAreaPreserved].some(x=>x===false);

async function runRefinementPipeline(prompt, apiKey, spatialData, roomType, onProgress, originalPhotoFile){
  const isPlan = roomType==="Floor Plan";

  /* ── Image-to-image path (original photo/plan provided) ── */
  if(originalPhotoFile){
    /* Plans get corrective retries if the boundary/same-space cross-check fails */
    const rounds = isPlan ? 3 : 1;
    let best=null;
    for(let r=0;r<rounds;r++){
      onProgress({stage:r===0?"generating":"refining", round:r+1, total:rounds});
      const corrective = r>0 ? RETRY_ADDENDUM[1] : "";
      const result = await generateWithImagen((prompt+corrective).slice(0,9000), apiKey, originalPhotoFile);
      if(spatialData && isPlan){
        onProgress({stage:"validating", round:r+1, total:rounds});
        const v=await validateRender(result.dataUrl, roomType, spatialData, apiKey);
        /* CROSS-CHECK 1: generated plan vs the ORIGINAL uploaded plan image */
        onProgress({stage:"comparing", round:r+1, total:rounds});
        const cmp=await comparePlanToOriginal(originalPhotoFile, result.dataUrl, spatialData, apiKey);
        const hardViolation = _envBad(v) || (cmp && cmp.approved===false);
        const score = hardViolation ? Math.min(v?.overallScore??cmp?.overallScore??0,40)
                                    : Math.min(v?.overallScore??95, cmp?.overallScore??95);
        const cand={url:result.dataUrl, score, validation:v, planCompare:cmp, mode:"image-edit"};
        if(!best || cand.score>best.score) best=cand;
        if(!hardViolation) break;
      } else {
        best={url:result.dataUrl, score:95, validation:null, planCompare:null, mode:"image-edit"};
        break;
      }
    }
    return best;
  }

  /* ── Text-to-image path with up to MAX_ROUNDS (no original image to compare against) ── */
  let bestDataUrl=null, bestScore=-1, bestValidation=null;
  for(let round=0; round<MAX_ROUNDS; round++){
    onProgress({stage:round===0?"generating":"refining", round:round+1, total:MAX_ROUNDS});
    const fullPrompt=(prompt+RETRY_ADDENDUM[round]).slice(0,9000);
    const {dataUrl,base64,mime}=await generateWithImagen(fullPrompt, apiKey, null);
    if(spatialData){
      onProgress({stage:"validating", round:round+1, total:MAX_ROUNDS});
      const v=await validateRender(`data:${mime};base64,${base64}`, roomType, spatialData, apiKey);
      const hardViolation = _envBad(v);
      const score=hardViolation?Math.min(v?.overallScore??0,40):(v?.overallScore??50);
      if(score>bestScore){bestScore=score; bestDataUrl=dataUrl; bestValidation=v;}
      if(score>=PASS_SCORE && !hardViolation) break;
    } else {
      bestDataUrl=dataUrl; bestScore=100; bestValidation=null; break;
    }
  }
  return {url:bestDataUrl, score:bestScore, validation:bestValidation, planCompare:null, mode:"text-to-image"};
}

/* ══════ RENDER TILE — shows only the final approved render ══════ */
function AIRenderTile({prompt, style, solName, room, apiKey, spatialData, originalPhotoFile, batchTrigger, planImg, onPlanReady}) {
  const isPlan = room==="Floor Plan";
  const [phase, setPhase] = useState("idle"); // idle | pipeline | done | error
  const [progress, setProgress] = useState({stage:"generating",round:1,total:MAX_ROUNDS});
  const [imgUrl, setImgUrl] = useState("");
  const [finalScore, setFinalScore] = useState(null);
  const [validation, setValidation] = useState(null);
  const [planCompare, setPlanCompare] = useState(null); // plan-tile: generated plan vs original plan
  const [planConsistency, setPlanConsistency] = useState(undefined); // room-tile: render vs plan (undefined=not run)
  const [xcheckRetries, setXcheckRetries] = useState(0); // bounded render regenerations on failed plan↔render check
  const [error, setError] = useState("");
  const XCHECK_MAX_RETRY = 2;

  const start = useCallback(async () => {
    if(!apiKey){ setError("Set Nano Banana API key above"); setPhase("error"); return; }
    setPhase("pipeline"); setError(""); setImgUrl(""); setFinalScore(null); setPlanCompare(null); setPlanConsistency(undefined);
    try{
      const result = await runRefinementPipeline(
        prompt, apiKey, spatialData, room,
        (p) => setProgress(p),
        originalPhotoFile
      );
      setImgUrl(result.url);
      setFinalScore(result.score);
      setValidation(result.validation||null);
      setPlanCompare(result.planCompare||null);
      setPhase("done");
      /* Share the generated plan image so room renders can be cross-checked against it */
      if(isPlan && onPlanReady) onPlanReady(result.url);
    }catch(e){ setError(e.message||"Failed"); setPhase("error"); }
  }, [prompt, apiKey, spatialData, room, originalPhotoFile, isPlan, onPlanReady]);

  /* Auto-start when batch trigger fires (only if idle) */
  useEffect(()=>{ if(batchTrigger>0 && phase==="idle"){ setXcheckRetries(0); start(); } },[batchTrigger]);

  /* CROSS-CHECK 2 — room render vs the post-intervention plan.
     Runs once this tile's render is done AND the plan image is available.
     A ref keyed on (render,plan) ensures we kick exactly once per pair —
     planConsistency is deliberately NOT a dependency so setting "running"
     does not retrigger this effect and cancel its own in-flight request. */
  const xcheckRef = useRef("");
  useEffect(()=>{
    if(isPlan || phase!=="done" || !imgUrl || !planImg || !apiKey) return;
    const sig = imgUrl+"|"+planImg;
    if(xcheckRef.current===sig) return; // already checked this pair
    xcheckRef.current=sig;
    let cancelled=false;
    setPlanConsistency("running");
    comparePlanToRender(planImg, imgUrl, room, apiKey).then(r=>{
      if(cancelled) return;
      const failing = r && (r.approved===false || r.consistent===false);
      /* §8.5 mandatory gate: a render that conflicts with the plan must be
         REGENERATED, not presented — bounded so we never loop forever. */
      if(failing && xcheckRetries < XCHECK_MAX_RETRY){
        setXcheckRetries(n=>n+1);
        start();
      } else {
        setPlanConsistency(r||null);
      }
    });
    return ()=>{cancelled=true;};
  },[isPlan, phase, imgUrl, planImg, apiKey, room, xcheckRetries]);

  const stageLabel = {
    generating: originalPhotoFile ? "Editing your original photo…" : "Generating render…",
    validating: "Verifying spatial accuracy…",
    comparing:  isPlan ? "Cross-checking against the original plan…" : "Cross-checking against the plan…",
    refining:   "Refining spatial fidelity…"
  };
  const stageIcon = {generating:"🎨", validating:"🔍", comparing:"🧭", refining:"🔧"};

  /* Score badge colour */
  const sc = finalScore;
  const scoreClr = sc==null?"#78716C":sc>=80?"#1B3A2D":sc>=60?"#C87941":"#B91C1C";
  const scoreLabel = sc==null?"":sc>=80?"✓ Verified":sc>=60?"~ Acceptable":"⚠ Best attempt";

  /* Cross-check outcome (plan-vs-original for the plan tile, render-vs-plan for rooms) */
  const xcheckFailed = isPlan
    ? !!(planCompare && (planCompare.approved===false || planCompare.sameSpace===false))
    : !!(planConsistency && planConsistency!=="running" && (planConsistency.approved===false || planConsistency.consistent===false));
  const xcheckDone = isPlan ? !!planCompare : (planConsistency!==undefined && planConsistency!=="running" && planConsistency!==null);

  return (
    <div className="card" style={{padding:0,overflow:"hidden",border:"1px solid #E2DCD2"}}>
      {/* IDLE */}
      {phase==="idle"&&(
        <div className="render-idle" onClick={start}
          style={{background:"linear-gradient(135deg,"+(STYLES[style]?.pal||["#F5F0E8"])[2]+"88,"+(STYLES[style]?.pal||["#E8DCC8"])[1]+"55)"}}>
          <span style={{fontSize:36,marginBottom:6}}>🎨</span>
          <span style={{fontSize:13,fontWeight:700,color:"#1B3A2D"}}>Generate Render</span>
          <span style={{fontSize:11,color:"#78716C",marginTop:2}}>{room} · {solName}</span>
          <span style={{fontSize:9,color:"#87A98F",marginTop:5,padding:"2px 10px",background:"#D1E7DD",borderRadius:10}}>
            {originalPhotoFile ? "🖼 Image-to-image · Spatial Refinement" : "Text-to-image · Spatial Refinement"}
          </span>
          {originalPhotoFile&&<span style={{fontSize:9,color:"#1B3A2D",marginTop:3,padding:"2px 8px",background:"#B5CDB8",borderRadius:8}}>
            ✓ Original photo attached — editing in place
          </span>}
        </div>
      )}

      {/* PIPELINE IN PROGRESS */}
      {phase==="pipeline"&&(
        <div className="render-loading" style={{flexDirection:"column",gap:0,padding:24}}>
          <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:18}}>
            <div className="spinner"/>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:"#1B3A2D"}}>{stageIcon[progress.stage]} {stageLabel[progress.stage]}</div>
              <div style={{fontSize:10,color:"#78716C",marginTop:2}}>Round {progress.round} of {progress.total} · {room} · {solName}</div>
            </div>
          </div>
          {/* Progress steps */}
          {(()=>{
            const steps=isPlan?[["generating","Generate"],["validating","Verify"],["comparing","Cross-check"]]:[["generating","Generate"],["validating","Verify"]];
            const rank={generating:0,refining:0,validating:1,comparing:2};
            const cur=rank[progress.stage]??0;
            return(<div style={{display:"flex",gap:6,alignItems:"center",width:"100%",maxWidth:340}}>
              {steps.map(([k,l],i)=>{
                const active=i===cur, done=i<cur;
                return<React.Fragment key={k}>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                    <div style={{width:28,height:28,borderRadius:"50%",background:active?"#1B3A2D":done?"#87A98F":"#E2DCD2",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,transition:"all .3s"}}>{done?"✓":<span style={{color:active?"#fff":"#B8AFA5"}}>{i+1}</span>}</div>
                    <span style={{fontSize:9,color:active?"#1B3A2D":"#78716C",fontWeight:active?700:400}}>{l}</span>
                  </div>
                  {i<steps.length-1&&<div style={{flex:1,height:2,background:done?"#87A98F":"#E2DCD2",borderRadius:1,marginBottom:16,transition:"background .3s"}}/>}
                </React.Fragment>;
              })}
            </div>);
          })()}
          <div style={{fontSize:10,color:"#87A98F",marginTop:14,textAlign:"center"}}>
            {isPlan?"Verifying the new plan presents the SAME space as the original — only approved plans are shown":"Auto-refining for spatial fidelity — only the approved result will be shown"}
          </div>
        </div>
      )}

      {/* FINAL RENDER */}
      {phase==="done"&&imgUrl&&(
        <div style={{position:"relative"}}>
          <img src={imgUrl} alt={style+" "+room+" — "+solName} className="render-img"
            style={xcheckFailed?{filter:"grayscale(.85) brightness(.8)"}:undefined}
            onError={()=>{setPhase("error");setError("Image failed to load");}}/>
          {sc!=null&&(
            <div style={{position:"absolute",top:8,right:8,background:scoreClr+"ee",padding:"4px 10px",borderRadius:20,fontSize:10,fontWeight:700,color:"#fff",backdropFilter:"blur(4px)"}}>
              {scoreLabel} {sc}/100
            </div>
          )}
          {/* §11 mandatory gate: a result that fails a hard boundary/geometry
              check after the allowed regenerations is marked NOT VALID. */}
          {xcheckFailed&&(
            <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(185,28,28,.28)"}}>
              <div style={{background:"#B91C1C",color:"#fff",padding:"8px 14px",borderRadius:8,fontSize:12,fontWeight:800,textAlign:"center",lineHeight:1.35,maxWidth:"90%"}}>
                ⛔ NON CONFORME<br/><span style={{fontSize:9.5,fontWeight:600}}>Vincolo di confine violato — non presentato come soluzione valida. Rigenera.</span>
              </div>
            </div>
          )}
        </div>
      )}

      {/* V7 COMPLIANCE STATUS — all renders */}
      {phase==="done"&&(()=>{
        const isPlan=room==="Floor Plan";
        const checks=isPlan?[
          ["Muri esterni",validation?.outerWallsUnchanged,"BLG-ENV-01"],
          ["Ingresso",validation?.entranceDoorUnchanged,"BLG-ENV-02"],
          ["Sagoma",validation?.overallShapeUnchanged,"BLG-ENV-03"],
          ["Porte-finestra",validation?.balconyDoorsUnchanged,"BLG-ENV-05"],
          ["Superficie",validation?.totalAreaPreserved,"HYG-02"],
        ]:[
          ["Finestre",validation?validation.windowCountMatch!==false&&validation.windowPositionsMatch!==false:undefined,"BLG-ENV-04"],
          ["Porte-finestra",validation?.balconyDoorsUnchanged,"BLG-ENV-05"],
          ["Muri",validation?validation.noWallMoves!==false&&validation.outerWallsUnchanged!==false:undefined,"BLG-ENV-01"],
          ["Altezze",validation?.complianceCeilingHeight,"HYG-01"],
          ["Superfici min.",validation?.complianceRoomAreas,"HYG-03"],
          ["Aeroillum.",validation?.complianceLightVent,"HYG-06"],
          ["Accessibilità",validation?.complianceAccessibility,"ACC-DM-01"],
        ];
        const violations=(validation?.violations||[]).concat(validation?.complianceNotes||[]).filter(Boolean).slice(0,4);
        const anyFail=checks.some(([,v])=>v===false);
        const allPass=checks.every(([,v])=>v===true);
        const verdict=anyFail?"REJECTED — HARD CONSTRAINT VIOLATION":allPass?(isPlan?"ENVELOPE INVARIANCE CONFIRMED — VERIFICHE PROFESSIONALI RICHIESTE":"SPATIAL & CODE CHECKS PASSED — VERIFICHE PROFESSIONALI RICHIESTE"):"CONCEPT FEASIBLE — VERIFICATIONS OUTSTANDING";
        const vCol=anyFail?"#B91C1C":allPass?"#1B3A2D":"#A16207";
        return(<div style={{padding:"8px 12px",borderTop:"1px solid #ECE8E1",background:anyFail?"#FEF2F2":"#F6F9F6"}}>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}}>
            {checks.map(([l,v,id])=>(
              <span key={id} title={id} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:10,fontSize:9.5,fontWeight:700,background:v===false?"#FEE2E2":v===true?"#D1E7DD":"#FEF3C7",color:v===false?"#B91C1C":v===true?"#1B3A2D":"#A16207"}}>
                {v===false?"✗":v===true?"✓":"⚠"} {l}
              </span>
            ))}
          </div>
          <div style={{fontSize:9.5,fontWeight:700,letterSpacing:".04em",color:vCol}}>{verdict}</div>
          {violations.length>0&&<ul style={{margin:"4px 0 0",paddingLeft:16,fontSize:9.5,color:"#B91C1C",lineHeight:1.5}}>{violations.map((vi,i)=><li key={i}>{vi}</li>)}</ul>}
          {!validation&&<div style={{fontSize:9,color:"#78716C",marginTop:2}}>Validazione visiva non eseguita (image-to-image / dati assenti) — vincoli comunque imposti nel prompt di generazione.</div>}
        </div>);
      })()}

      {/* CROSS-CHECK 1 — post-intervention PLAN vs INITIAL plan (plan tile only) */}
      {phase==="done"&&isPlan&&planCompare&&(()=>{
        const rows=[
          ["Muri esterni",planCompare.outerWallsMatch],
          ["Sagoma/impronta",planCompare.overallShapeMatch],
          ["Superficie",planCompare.totalAreaMatch],
          ["Entro il perimetro",planCompare.withinOriginalBoundary],
          ["Area ≤ originale",planCompare.areaRatioOK],
          ["Nessun locale aggiunto",planCompare.noSpacesAdded],
          ["Spazi tracciabili",planCompare.allSpacesTraceable],
          ["Ingresso",planCompare.entranceMatch],
          ["Finestre",planCompare.windowsMatch],
          ["Porte-finestra",planCompare.balconyDoorsMatch],
          ["Solo modifiche interne",planCompare.onlyInternalChanged],
        ];
        const fail=planCompare.approved===false||rows.some(([,v])=>v===false)||planCompare.sameSpace===false;
        const ms=(planCompare.mismatches||[]).filter(Boolean).slice(0,4);
        return(<div style={{padding:"8px 12px",borderTop:"1px solid #ECE8E1",background:fail?"#FEF2F2":"#EEF4FA"}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:".05em",color:fail?"#B91C1C":"#2E5A82",marginBottom:5}}>🧭 PIANO NUOVO ↔ PIANO INIZIALE {fail?"— SPAZIO NON COINCIDENTE":"— STESSO SPAZIO CONFERMATO"}{planCompare.overallScore!=null?` · ${planCompare.overallScore}/100`:""}</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {rows.map(([l,v],i)=>(
              <span key={i} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:10,fontSize:9.5,fontWeight:700,background:v===false?"#FEE2E2":v===true?"#D1E7DD":"#FEF3C7",color:v===false?"#B91C1C":v===true?"#1B3A2D":"#A16207"}}>{v===false?"✗":v===true?"✓":"⚠"} {l}</span>
            ))}
          </div>
          {ms.length>0&&<ul style={{margin:"5px 0 0",paddingLeft:16,fontSize:9.5,color:"#B91C1C",lineHeight:1.5}}>{ms.map((m,i)=><li key={i}>{m}</li>)}</ul>}
          {!fail&&<div style={{marginTop:6,padding:"6px 8px",background:"#D1E7DD",borderRadius:6,fontSize:9,color:"#1B3A2D",lineHeight:1.45}}>✓ <strong>Dichiarazione di conformità geometrica:</strong> l'intervento resta interamente entro il perimetro originale dell'appartamento. Muri esterni, ingresso, finestre e aperture esterne non sono modificati. Tutti i locali proposti derivano dalla sola riorganizzazione della superficie interna esistente.</div>}
        </div>);
      })()}

      {/* CROSS-CHECK 2 — 3D render vs the post-intervention PLAN (room tiles) */}
      {phase==="done"&&!isPlan&&planConsistency!==undefined&&(()=>{
        if(planConsistency==="running") return(<div style={{padding:"7px 12px",borderTop:"1px solid #ECE8E1",background:"#EEF4FA",fontSize:9.5,color:"#2E5A82",display:"flex",alignItems:"center",gap:7}}><div className="spinner" style={{width:14,height:14,borderWidth:2}}/> Verifica coerenza render ↔ piano…</div>);
        if(planConsistency===null) return(<div style={{padding:"7px 12px",borderTop:"1px solid #ECE8E1",background:"#F6F4EF",fontSize:9,color:"#78716C"}}>Render ↔ piano: confronto non disponibile (piano non ancora generato).</div>);
        const rows=[
          ["Finestre",planConsistency.windowsConsistent],
          ["Porte-finestra",planConsistency.balconyDoorsConsistent],
          ["Proporzioni",planConsistency.proportionsConsistent],
          ["Aperture/muri",planConsistency.openingsConsistent],
          ["Sequenza locali",planConsistency.roomSequenceConsistent],
          ["Nessun locale extra",planConsistency.noExtraRoom],
          ["Nessun elemento inventato",planConsistency.noInventedElements],
        ];
        const fail=planConsistency.approved===false||planConsistency.consistent===false||rows.some(([,v])=>v===false);
        const ms=(planConsistency.mismatches||[]).filter(Boolean).slice(0,4);
        return(<div style={{padding:"8px 12px",borderTop:"1px solid #ECE8E1",background:fail?"#FEF2F2":"#F6F9F6"}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:".05em",color:fail?"#B91C1C":"#1B3A2D",marginBottom:5}}>🧭 RENDER 3D ↔ PIANO {fail?"— INCOERENTE":"— COERENTE"}{planConsistency.overallScore!=null?` · ${planConsistency.overallScore}/100`:""}</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {rows.map(([l,v],i)=>(
              <span key={i} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:10,fontSize:9.5,fontWeight:700,background:v===false?"#FEE2E2":v===true?"#D1E7DD":"#FEF3C7",color:v===false?"#B91C1C":v===true?"#1B3A2D":"#A16207"}}>{v===false?"✗":v===true?"✓":"⚠"} {l}</span>
            ))}
          </div>
          {ms.length>0&&<ul style={{margin:"5px 0 0",paddingLeft:16,fontSize:9.5,color:"#B91C1C",lineHeight:1.5}}>{ms.map((m,i)=><li key={i}>{m}</li>)}</ul>}
        </div>);
      })()}

      {/* ERROR */}
      {phase==="error"&&(
        <div className="render-idle" onClick={start} style={{background:"#FEF2F2"}}>
          <span style={{fontSize:28}}>⚠️</span>
          <span style={{fontSize:12,color:"#B91C1C",fontWeight:600,marginTop:4}}>{error}</span>
          <span style={{fontSize:10,color:"#B91C1C",marginTop:2}}>Click to retry</span>
        </div>
      )}

      {/* Footer */}
      <div style={{padding:"8px 12px",borderTop:"1px solid #ECE8E1",background:"#fff",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <div style={{fontSize:12,fontWeight:600}}>{room} — {solName}</div>
          <div style={{fontSize:10,color:xcheckFailed?"#B91C1C":"#78716C"}}>{style}{phase==="done"?(xcheckFailed?" · ⚠ cross-check failed — review before use":xcheckDone?" · cross-checked vs "+(isPlan?"original plan":"plan"):" · spatially verified render"):""}</div>
        </div>
        <div style={{display:"flex",gap:4}}>
          {phase==="done"&&<button className="btn btn-g" style={{padding:"3px 8px",fontSize:10}} onClick={()=>{setPhase("idle");setImgUrl("");setFinalScore(null);}}>🔄</button>}
          {phase==="done"&&imgUrl&&<a href={imgUrl} target="_blank" rel="noopener noreferrer" className="btn btn-g" style={{padding:"3px 8px",fontSize:10,textDecoration:"none"}}>🔗</a>}
        </div>
      </div>
    </div>
  );
}

/* ══════ INPUT STEPS ══════ */

/* STEP 1: Proprietà — with listing link, status, energy, floor */
function S1({d,u,apiKey}){
  const [fetching,setFetching]=useState(false);
  const [listingData,setListingData]=useState(null);
  const [fetchErr,setFetchErr]=useState("");

  const LISTING_SCHEMA = '{"address":"","city":"","cap":"","area":<m²>,"rooms":<n>,"bathrooms":<n>,"floor":"","ceiling":<m>,"pType":"<Apartment|Attico|Loft|Monolocale|Villa|Mansarda>","currentStatus":"<Da ristrutturare|Buono / Abitabile|Ristrutturato|Ottimo|Nuovo / In costruzione>","eCls":"<A4-G>","annualEnergy":<n>,"heatingType":"<Centralizzato|Autonomo|Pompa di calore|Nessuno>","price":<€>,"description":"","features":[],"buildingYear":<year>,"condominium":""}';

  /* Shared: map a parsed listing object onto the form and report the outcome */
  const applyParsed = (parsed, secs, srcLabel) => {
    parsed = parsed || {};
    setListingData(parsed);
    const urlStr = (d.listingUrl||"").toLowerCase();
    const cityMatch = urlStr.match(/(milano|milan|bergamo|brescia|como|cremona|lecco|lodi|mantova|monza|pavia|sondrio|varese)/i);
    const fallbackCity = cityMatch ? cityMatch[1].charAt(0).toUpperCase()+cityMatch[1].slice(1).toLowerCase() : (parsed.city||"Milano");
    const updates = {listingExtracted: parsed};
    const setIf = (key, val) => { if(val != null && val !== '') updates[key] = String(val); };
    setIf('address', parsed.address); setIf('city', parsed.city); setIf('cap', parsed.cap);
    setIf('area', parsed.area); setIf('rooms', parsed.rooms); setIf('floor', parsed.floor); setIf('ceiling', parsed.ceiling);
    if(parsed.pType) updates.pType = parsed.pType;
    if(parsed.currentStatus) updates.currentStatus = parsed.currentStatus;
    if(parsed.eCls && parsed.eCls !== "Unknown") updates.eCls = parsed.eCls;
    if(parsed.annualEnergy) updates.annualEnergy = String(parsed.annualEnergy);
    if(parsed.heatingType) updates.heatingType = parsed.heatingType;
    if(parsed.band) updates.band = parsed.band;
    const merged = {...d, ...updates};
    if(!merged.city) merged.city = fallbackCity;
    if(!merged.area) merged.area = "80";
    if(!merged.rooms) merged.rooms = "3";
    if(!merged.floor) merged.floor = "3";
    if(!merged.ceiling) merged.ceiling = "2.7";
    if(!merged.pType) merged.pType = "Apartment";
    if(!merged.currentStatus) merged.currentStatus = "Buono / Abitabile";
    if(!merged.eCls || merged.eCls === "Unknown") merged.eCls = "E";
    if(!merged.heatingType) merged.heatingType = "Centralizzato";
    if(!merged.band) merged.band = "Major city";
    u(merged);
    const filled = Object.keys(updates).filter(k => k !== 'listingExtracted').length;
    if(filled === 0){
      setFetchErr('No data extracted from '+(srcLabel||'the URL')+'. Real-estate sites (immobiliare.it, idealista…) block automated reading and trip Gemini’s recitation filter. Most reliable fix: take a screenshot of the listing and use “🖼 Extract from screenshot” below — or just fill the fields in manually.');
    } else {
      setFetchErr('✓ '+filled+' field'+(filled===1?'':'s')+' filled'+(secs?(' in '+secs.toFixed(1)+'s'):'')+(srcLabel?(' · '+srcLabel):''));
    }
    setFetching(false);
  };

  /* Reliable path: read a screenshot of the listing with vision (no scraping,
     no recitation filter — the user supplies the image directly) */
  const extractFromScreenshot = async (file) => {
    if(!file) return;
    if(!apiKey){ setFetchErr('Enter your Nano Banana 2 / Google AI Studio key in the header first.'); return; }
    setFetching(true); setListingData(null); setFetchErr('Reading the screenshot…');
    const prompt = 'You are reading a screenshot of an Italian real-estate listing (annuncio immobiliare). Extract every property field you can see. Return ONLY valid JSON, no markdown, matching this schema (use null for anything not visible):\n'+LISTING_SCHEMA+'\nFor the description field, write a short paraphrase in your own words (max 30 words) — never copy the listing text verbatim.';
    let parsed = null;
    try{ parsed = await geminiVision(file, prompt, apiKey); }catch(e){ console.warn('screenshot extract failed', e); }
    applyParsed(parsed||{}, null, 'screenshot');
  };

  const fetchListing=async()=>{
    if(!d.listingUrl){ setFetchErr("Enter a listing URL first"); return; }
    setFetching(true); setListingData(null); setFetchErr("Extracting…");
    const url = d.listingUrl.trim();
    const t0 = Date.now();
    const dbg = [];
    const log = (m)=>{ const s='[listing '+((Date.now()-t0)/1000).toFixed(1)+'s] '+m; console.log(s); dbg.push(s); };

    const SCHEMA = '{"address":"","city":"","cap":"","area":<m²>,"rooms":<n>,"bathrooms":<n>,"floor":"","ceiling":<m>,"pType":"<Apartment|Attico|Loft|Monolocale|Villa|Mansarda>","currentStatus":"<Da ristrutturare|Buono / Abitabile|Ristrutturato|Ottimo|Nuovo / In costruzione>","eCls":"<A4-G>","annualEnergy":<n>,"heatingType":"<Centralizzato|Autonomo|Pompa di calore|Nessuno>","price":<€>,"description":"","features":[],"buildingYear":<year>,"condominium":""}';

    /* IMPORTANT: instruct extraction WITHOUT quoting — bypasses Gemini's RECITATION filter */
    const ANTI_RECITATION = 'IMPORTANT: Do NOT quote, copy or repeat any text from the source page verbatim. Extract NUMERIC values, single-word category enums, and paraphrased summaries only. For the description field, write a brief paraphrase in your own words (max 30 words). This is critical to avoid recitation filtering.';

    const extractFromSchema = (o) => {
      if(!o || typeof o !== 'object') return {};
      const out = {};
      if(o.offers?.price) out.price = parseInt(String(o.offers.price).replace(/[^\d]/g,''));
      if(o.price) out.price = parseInt(String(o.price).replace(/[^\d]/g,''));
      if(o.floorSize?.value) out.area = parseFloat(o.floorSize.value);
      if(o.numberOfRooms) out.rooms = parseInt(o.numberOfRooms);
      if(o.numberOfBathroomsTotal) out.bathrooms = parseInt(o.numberOfBathroomsTotal);
      if(o.address){
        out.address = o.address.streetAddress;
        out.city = o.address.addressLocality;
        out.cap = o.address.postalCode;
      }
      return out;
    };

    const tryGemini = async (model, body, label, timeoutMs=15000) => {
      if(!apiKey){ log(label+': no API key'); return null; }
      try{
        const ctrl = new AbortController();
        const t = setTimeout(()=>ctrl.abort(), timeoutMs);
        const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+apiKey,
          {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctrl.signal});
        clearTimeout(t);
        if(!r.ok){ const e=await r.text(); log(label+' HTTP '+r.status+': '+e.slice(0,150)); return null; }
        const j = await r.json();
        const cand = j.candidates?.[0];
        if(!cand){ log(label+': no candidate'); return null; }
        const fr = cand.finishReason || '';
        if(fr === 'RECITATION' || fr === 'SAFETY' || fr === 'BLOCKLIST'){
          log(label+' BLOCKED: '+fr+' — retrying with paraphrase mode');
          return 'RETRY_PARAPHRASE';
        }
        const parts = cand.content?.parts || [];
        const txt = parts.map(p=>p.text||'').join('').trim();
        if(!txt){ log(label+': empty text, fr='+fr); return null; }
        const mat = txt.replace(/```json|```/g,'').match(/\{[\s\S]*\}/);
        if(!mat){ log(label+' no JSON: '+txt.slice(0,150)); return null; }
        try{
          const obj = JSON.parse(mat[0]);
          const keys = Object.keys(obj).filter(k=>obj[k]!=null && obj[k]!=='');
          log(label+' OK '+keys.length+'k');
          return keys.length > 0 ? obj : null;
        }catch(e){ log(label+' parse: '+e.message); return null; }
      }catch(e){ log(label+' '+(e.name==='AbortError'?'TIMEOUT':e.message)); return null; }

        generationConfig:visionCfg(4096,{responseMimeType:'application/json'})

    /* === Attempt B: google_search with paraphrase instruction === */

      const r = await tryGemini(AI_MODELS.vision, body, 'B:search', 32000);
      if(r === 'RETRY_PARAPHRASE'){
        const body2 = {
          contents:[{parts:[{text:'Find this listing online. Output STRICTLY numerical and categorical data only — never quote any text. '+ANTI_RECITATION+' Use the city name and zone but paraphrase everything else.\n\nURL: '+url+'\n\nJSON only:\n'+SCHEMA}]}],
          tools:[{google_search:{}}],
          generationConfig:visionCfg(4096,{temperature:0.3})
        };
        return tryGemini(AI_MODELS.vision, body2, 'B2:search-paraphrase', 32000);

      return r;
    };

    /* === Attempt C: url_context with paraphrase + retry === */
    const attemptUrlCtx = async () => {
      const body = {
        contents:[{parts:[{text:'Open this URL and extract numerical/categorical fields only. '+ANTI_RECITATION+'\n\nURL: '+url+'\n\nJSON only:\n'+SCHEMA}]}],

          tools:[{url_context:{}}],

        return tryGemini(AI_MODELS.vision, body2, 'C2:urlctx-paraphrase', 32000);

    /* === Attempt D: gemini-2.0-flash search === */

    /* === Attempt E: proxy scrape + text-mine === */
    const attemptScrape = async () => {
      const proxies = [
        u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
        u => 'https://corsproxy.io/?' + encodeURIComponent(u),

      ];
      let html = '';
      for(const p of proxies){
        try{

          if(r.ok){

      if(!html) return null;
      const mined = {};

      [...html.matchAll(/<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)].forEach(m=>{

      /* Next.js embedded state (immobiliare.it, idealista, casa.it) — the richest source */

/* ══════ SOLUTION RENDER CARD ══════ */
function SolRenderCard({x, solIdx, d, apiKey}){
  const m=SM[solIdx];
  const [batchTrigger,setBatchTrigger]=useState(0);
  const [planImg,setPlanImg]=useState(""); // generated post-intervention plan image, shared to room tiles for cross-check
  const tiles=[];
  [{roomKey:"living",label:"Living Area"},{roomKey:"kitchen",label:"Kitchen"},{roomKey:"bedroom",label:"Bedroom"},{roomKey:"bathroom",label:"Bathroom"}].forEach(({roomKey,label})=>{
    const photos=(d.roomDetails?.[roomKey]?.photos||[]).filter(f=>f instanceof File);
    const spatialData=d.roomDetails?.[roomKey]?.extractedData||null;
    if(photos.length>0){
      photos.forEach((photoFile,pi)=>{
        tiles.push({roomKey,label:`${label}${photos.length>1?" ("+(pi+1)+"/"+photos.length+")":""}`,photoFile,spatialData});

    } else {
      tiles.push({roomKey,label,photoFile:null,spatialData});
    }
  });
  const planPhoto=(d.plans||[]).find(f=>f instanceof File)||null;
  tiles.push({roomKey:"plan",label:"Floor Plan",photoFile:planPhoto,spatialData:d.extractedPlan||null});
  const imgToImg=tiles.filter(t=>t.photoFile).length;
  return(
    <div className="card" style={{borderColor:solIdx===1?m.color+"60":"#E2DCD2",borderWidth:solIdx===1?2:1,marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
        <span style={{fontSize:17}}>{m.em}</span>
        <div style={{flex:1}}>
          <div style={{fontFamily:"'Cormorant Garamond'",fontSize:17,fontWeight:700,color:m.color}}>{x.nm} — {fmt(x.co.total)}</div>

/* ══════ MARKET FETCH BUTTON ══════ */
function MarketFetchBtn({d, s, area, apiKey}){
  const [state,setState]=useState("idle");
  const [md,setMd]=useState(null);
  const [err,setErr]=useState("");

  const fetch2=async()=>{
    if(!apiKey){setErr("Enter API key in header");return;}
    setState("loading"); setErr("");
    try{
      const city=d.city||"Milano";
      const res=await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${AI_MODELS.vision}:generateContent?key=${apiKey}`,
        {method:"POST",headers:{"Content-Type":"application/json"},
         body:JSON.stringify({
           contents:[{parts:[{text:`Search immobiliare.it Lombardia market data and OMI Agenzia Entrate for ${city}, Italy. Return ONLY valid JSON:\n{"omiMin":<€/m²>,"omiMax":<€/m²>,"omiZone":"<zone>","marketAvgSqm":<€/m²>,"marketTrend":"<increasing|stable|decreasing>","marketTrendPct":<number>,"comparableCurrent":<€/m²>,"comparableRenovated":<€/m²>,"energyPremium":<€/m²>,"demandScore":<1-10>,"avgDaysOnMarket":<days>,"notes":"<key observations>"}`}]}],
           tools:[{google_search:{}}],
           generationConfig:visionCfg(4096,{temperature:0})
         })
        }
      );
      const data=await res.json();
      const txt=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
      const match=txt.match(/\{[\s\S]*?\}/);
      if(match){const p=JSON.parse(match[0]);setMd(p);setState("done");}
      else throw new Error("No data returned");
    }catch(e){setErr(e.message||"Failed");setState("error");}
  };

  return(
    <div>
      <button className="btn" onClick={fetch2} disabled={state==="loading"}
        style={{background:"rgba(255,255,255,.15)",color:"#fff",border:"1px solid rgba(255,255,255,.3)",fontSize:12,padding:"8px 16px"}}>
        {state==="loading"?"🔍 Fetching…":"🌐 Fetch Live Market Data"}
      </button>
      {state==="loading"&&<div style={{fontSize:10,color:"rgba(255,255,255,.7)",marginTop:4}}>Searching OMI + immobiliare.it…</div>}
      {err&&<div style={{fontSize:10,color:"#FECACA",marginTop:4}}>{err}</div>}
      {state==="done"&&md&&<div style={{marginTop:12,display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
        {[["OMI Range",md.omiMin&&md.omiMax?fmt(md.omiMin*area)+"–"+fmt(md.omiMax*area):"—"],["Market Avg/m²",md.marketAvgSqm?fmt(md.marketAvgSqm):"—"],["Trend",md.marketTrend+" "+(md.marketTrendPct?(md.marketTrendPct>0?"+":"")+md.marketTrendPct+"%":"")],["Renovated/m²",md.comparableRenovated?fmt(md.comparableRenovated):"—"],["Energy premium",md.energyPremium?fmt(md.energyPremium*area):"—"],["Demand",md.demandScore?md.demandScore+"/10":"—"]].map(([l,v])=>(
          <div key={l} style={{padding:"6px 8px",background:"rgba(255,255,255,.12)",borderRadius:6}}>
            <div style={{fontSize:9,opacity:.7}}>{l}</div>
            <div style={{fontSize:11,fontWeight:700}}>{v}</div>
          </div>
        ))}
        {md.notes&&<div style={{gridColumn:"1/4",fontSize:10,opacity:.8,marginTop:4}}>📝 {md.notes}</div>}
      </div>}
    </div>
  );
}

    {/* MARKET ANALYSIS */}

          </tbody></table>
          <div style={{fontSize:10.5,fontWeight:700,color:"#1B3A2D",marginBottom:4,textTransform:"uppercase",letterSpacing:".08em"}}>Matrice di conformità</div>
          <table><tbody>
            {v7.matrix.map((m,i)=>(<tr key={i} style={{borderBottom:"1px solid #ECE8E1"}}>
              <td style={{fontFamily:"monospace",fontSize:9.5,whiteSpace:"nowrap",verticalAlign:"top"}}>{m.ruleId}</td>
              <td style={{fontSize:10.5,fontWeight:600,verticalAlign:"top",whiteSpace:"nowrap"}}>{m.cat}<div style={{fontSize:8.5,fontWeight:400,color:"#78716C"}}>{m.code}</div></td>
              <td style={{fontSize:9.5,color:"#57534E"}}>{m.msg}</td>
              <td style={{fontSize:9.5,fontWeight:700,whiteSpace:"nowrap",verticalAlign:"top",color:m.status==="PASS"?"#1B3A2D":m.status==="FAIL"?"#B91C1C":"#A16207"}}>{m.status}</td>
            </tr>))}
          </tbody></table>
          <div className="note note-warn" style={{marginTop:10}}>⚠️ Documento concettuale — non costituisce certificazione legale, strutturale, energetica o di agibilità (v7 §1.7). Le voci UNVERIFIED richiedono verifica di tecnico abilitato. Muri esterni, ingresso e sagoma dell'appartamento restano invariati in ogni soluzione proposta.</div>
        </div>
      </div>);
    })()}
  </div>);
}

/* ══════ MAIN APP ══════ */
function App(){
  const [step,setStep]=useState(0);
  const [ld,setLd]=useState(false);
  /* Google AI Studio key (Gemini + Nano Banana) — pasted at runtime.
     The repo copy ships WITHOUT a hardcoded key: GitHub secret scanning blocks
     any committed key and Google auto-revokes it. Paste your key into the
     header field (the downloadable build can have it pre-filled). */
  const [apiKey,setApiKey]=useState("");
  const [showKey,setShowKey]=useState(false);
  const [models,setModels]=useState(AI_MODELS);

  /* Auto-activate the newest Gemini + Nano Banana models the key can access */
  useEffect(()=>{ let on=true; if(apiKey) detectBestModels(apiKey).then(m=>{ if(on) setModels({...m}); }); return ()=>{on=false;}; },[apiKey]);
  const [d,setD]=useState({address:"",city:"Milano",cap:"",area:"85",rooms:"3",eCls:"E",band:"Major city",floor:"3",ceiling:"2.7",currentStatus:"Da ristrutturare",heatingType:"Centralizzato",annualEnergy:"",pType:"Apartment",listingUrl:"",plans:[],photos:[],roomDetails:{},changes:["Kitchen upgrade","Bathroom upgrade","Finishes refresh","Storage boost"],style:"Japandi",customStyle:"",fengshui:[],preferredPalette:null});
  const steps=[{n:"Proprietà · Property",i:"🏛️"},{n:"Planimetria · Floor Plan",i:"📐"},{n:"Interventi · Interventions",i:"🏗️"},{n:"Stile · Style",i:"🎨"},{n:"Analisi · Analysis",i:"📊"}];
  const ok=step===0?(d.city&&d.area):step===2?d.changes.length>0:true;
  const go=()=>{setLd(true);setTimeout(()=>{setLd(false);setStep(4)},1800)};

  if(ld)return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#FFFFFF"}}><div style={{textAlign:"center"}}><div className="spinner" style={{margin:"0 auto 20px"}}></div><h3 style={{fontFamily:"'Source Sans 3',sans-serif",color:"#4A7AAA",fontSize:18,letterSpacing:2,textTransform:"uppercase",fontWeight:400}}>Generazione 3 Soluzioni · Generating 3 Solutions</h3><p style={{color:"#78716C",fontSize:12,marginTop:6}}>Essenziale · Bilanciato · Premium / Essential · Balanced · Premium</p></div></div>);

  return(<div style={{minHeight:"100vh",background:"#F6F4EF"}}>
    <div style={{background:"#fff",color:"#3D3D3D",padding:"0",borderBottom:"1px solid #E5E0D8"}}>
      <div style={{background:"#F5F2EE",borderBottom:"1px solid #E5E0D8",fontSize:11,color:"#7A7A7A",padding:"6px 0"}}><div style={{maxWidth:1020,margin:"0 auto",padding:"0 28px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span>📞 +39 339 144 6039 · ✉ info@iltuoarchitetto.it</span><span style={{color:"#4A7AAA",fontWeight:600}}>Studio di Architettura Colombo</span></div></div><div style={{maxWidth:1020,margin:"0 auto",padding:"18px 28px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:54,height:54,border:"2.5px solid #4A7AAA",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontFamily:"'Source Sans 3',sans-serif",fontWeight:800,color:"#4A7AAA",letterSpacing:.5}}>2·5D</div><div><h1 style={{fontSize:22,fontWeight:400,letterSpacing:3,color:"#4A7AAA",fontFamily:"'Source Sans 3',sans-serif",textTransform:"uppercase"}}>2D to 5D</h1><p style={{fontSize:11,color:"#7A7A7A",letterSpacing:.3,marginTop:2}}>Integrated Design Solutions · Soluzioni di Progettazione Integrata</p></div></div>
        <div style={{display:"flex",alignItems:"center",gap:6}}><input type={showKey?"text":"password"} value={apiKey} onChange={e=>setApiKey(e.target.value.trim())} placeholder="Google AI Studio key (AIza… / AQ.…)" title="Gemini + Nano Banana key" style={{width:240,padding:"6px 10px",borderRadius:6,border:"1px solid rgba(255,255,255,.2)",background:"rgba(255,255,255,.1)",color:"#fff",fontSize:11}}/><button onClick={()=>setShowKey(!showKey)} style={{background:"none",border:"none",color:"#fff",cursor:"pointer",fontSize:13}}>{showKey?"🙈":"👁️"}</button>{apiKey&&<span title={models.detected?("Render: "+models.image+"\nExtract/validate: "+models.vision):"Connecting — detecting best models…"} style={{fontSize:9.5,color:models.detected?"#8CC63F":"#C9B24A",whiteSpace:"nowrap"}}>{models.detected?("✓ "+models.image.replace("gemini-","").replace("-preview","")+" · "+models.vision.replace("gemini-","")):"⏳ detecting models…"}</span>}</div>
      </div>
    </div>
    {step<4&&<div style={{maxWidth:1020,margin:"0 auto",padding:"12px 22px 0"}}><div style={{display:"flex",alignItems:"center",gap:3}}>{steps.map((x,i)=><div key={x.n} style={{display:"flex",alignItems:"center",flex:1}}><div style={{width:30,height:30,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:i<step?"#1B3A2D":i===step?"#C87941":"#ECE8E1",color:i<=step?"#fff":"#78716C",fontWeight:600,fontSize:11,flexShrink:0}}>{x.i}</div><span style={{fontSize:9.5,marginLeft:5,color:i===step?"#1C1917":"#78716C",fontWeight:i===step?600:400,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{x.n}</span>{i<steps.length-1&&<div style={{flex:1,height:2,background:i<step?"#1B3A2D":"#ECE8E1",margin:"0 7px",minWidth:8}}/>}</div>)}</div></div>}
    <div style={{maxWidth:1020,margin:"0 auto",padding:"16px 22px 56px"}}>
      {step===0&&<S1 d={d} u={setD} apiKey={apiKey}/>}{step===1&&<S2 d={d} u={setD} apiKey={apiKey}/>}{step===2&&<S3 d={d} u={setD}/>}{step===3&&<S4 d={d} u={setD}/>}{step===4&&<Results d={d} apiKey={apiKey}/>}
      {step<4&&<div style={{display:"flex",justifyContent:"space-between",marginTop:22}}><button className="btn btn-g" onClick={()=>setStep(Math.max(0,step-1))} disabled={step===0}>← Indietro · Back</button>{step<3?<button className="btn btn-p" onClick={()=>setStep(step+1)} disabled={!ok}>Continua · Next →</button>:<button className="btn btn-w" onClick={go}>Genera 3 Soluzioni · Generate 3 Solutions ✨</button>}</div>}
      {step===4&&<div style={{display:"flex",gap:8,marginTop:22}}><button className="btn btn-g" onClick={()=>setStep(0)}>← Modifica · Edit</button><button className="btn btn-s" onClick={()=>window.print()}>📄 Stampa · Print</button></div>}
    </div>
  </div>);
}

(function tryMount(){
  var el = document.getElementById("root");
  if(el){ ReactDOM.render(<App/>, el); }
  else { requestAnimationFrame(tryMount); }
})();
</script>
</body>
